{{#hasPager}}
<div class="panel-soft rounded-2xl px-4 py-3">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div class="text-sm muted">Showing {{pager.start}} to {{pager.stop}} of {{pager.total}}</div>
    <div class="flex items-center gap-3">
      <span class="badge badge-slate">Page {{pager.page}} of {{pager.lastPage}}</span>
      {{#pager.hasPrev}}<a href="{{pager.prevHref}}" class="quick-button">Previous</a>{{/pager.hasPrev}}
      {{#pager.hasNext}}<a href="{{pager.nextHref}}" class="quick-button">Next</a>{{/pager.hasNext}}
    </div>
  </div>
</div>
{{/hasPager}}
