<div class="window-layer is-empty" id="windowLayer">
  <section class="float-win" data-float-window="explorer">
    <div class="float-head" data-float-handle="explorer"><div class="font-semibold">Routine explorer</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="explorer">✕</button></div></div>
    <div class="float-body scroll-vscode" id="floatExplorerBody"></div>
  </section>
  <section class="float-win" data-float-window="search">
    <div class="float-head" data-float-handle="search"><div class="font-semibold">Search</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="search">✕</button></div></div>
    <div class="float-body scroll-vscode" id="floatSearchBody"></div>
  </section>
  <section class="float-win" data-float-window="debug">
    <div class="float-head" data-float-handle="debug"><div class="font-semibold">Run and Debug</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="debug">✕</button></div></div>
    <div class="float-body scroll-vscode" id="floatDebugBody"></div>
  </section>
  <section class="float-win" data-float-window="problems">
    <div class="float-head" data-float-handle="problems"><div class="font-semibold">PROBLEMS</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="problems">✕</button></div></div>
    <div class="float-body scroll-vscode" id="floatProblemsBody"></div>
  </section>
  <section class="float-win" data-float-window="snippets">
    <div class="float-head" data-float-handle="snippets"><div class="font-semibold">Snippet library</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="snippets">✕</button></div></div>
    <div class="float-body scroll-vscode" id="floatSnippetsBody"></div>
  </section>
  <section class="float-win" data-float-window="output">
    <div class="float-head" data-float-handle="output"><div class="font-semibold">Output</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="output">✕</button></div></div>
    <div class="float-body scroll-vscode"><div id="floatOutputList" class="space-y-1"></div></div>
  </section>
  <section class="float-win" data-float-window="terminal">
    <div class="float-head" data-float-handle="terminal"><div class="font-semibold">Terminal</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="terminal">✕</button></div></div>
    <div class="float-body"><div class="terminal-host" id="floatTerminalHost"></div></div>
  </section>
</div>
