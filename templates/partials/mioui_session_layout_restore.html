<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{restoreTitle}}</h2>
    <p class="text-sm text-slate-300">{{restoreLead}}</p>
  </div>
  <div class="flex flex-wrap gap-2">
    {{#restore}}
    <button class="{{class}}">{{label}}</button>
    {{/restore}}
  </div>
  <div class="grid gap-3 xl:grid-cols-4 md:grid-cols-2">
    {{#restore}}
    <article class="panel-soft space-y-1">
      <p class="text-sm font-semibold text-white">{{label}}</p>
      <p class="text-xs text-slate-300">{{detail}}</p>
      <div class="flex items-center justify-between text-[11px] text-slate-400">
        <span>{{state}}</span>
        <code>{{callback}}</code>
      </div>
    </article>
    {{/restore}}
  </div>
</section>
