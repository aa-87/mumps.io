<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{mobileTitle}}</h2>
    <p class="text-sm text-slate-300">{{mobileLead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
    {{#mobileVariant}}
    <article class="panel-soft space-y-2">
      <p class="text-sm font-semibold text-white">{{label}}</p>
      <p class="text-xs text-slate-300">{{detail}}</p>
      <code class="text-[11px] text-sky-300">{{callback}}</code>
    </article>
    {{/mobileVariant}}
  </div>
</section>
