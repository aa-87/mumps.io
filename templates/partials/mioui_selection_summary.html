<div class="panel-soft rounded-[1.25rem] p-4">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
    <div>
      <div class="text-sm font-semibold">{{selection.summary}}</div>
      <p class="mt-1 text-sm muted max-w-3xl">{{selection.body}}</p>
    </div>
    <div class="flex flex-wrap gap-2">
      {{#selection.action}}
      <a href="{{href}}" class="{{class}}">{{label}}</a>
      {{/selection.action}}
    </div>
  </div>
</div>
