<div class="space-y-3">
  <div>
    <h3 class="text-lg font-semibold">{{workbench.inspect.title}}</h3>
    <p class="mt-1 muted">{{workbench.inspect.subtitle}}</p>
  </div>
  <div class="panel-soft p-4 rounded-2xl border border-white/10 space-y-3">
    {{#workbench.inspect.fact}}
    <div class="flex items-start justify-between gap-4 text-sm">
      <div class="muted">{{label}}</div>
      <div class="font-medium text-right">{{value}}</div>
    </div>
    {{/workbench.inspect.fact}}
  </div>
  <div class="flex flex-wrap gap-2">
    {{#workbench.inspect.action}}
    <a href="{{href}}" class="{{class}}">{{label}}</a>
    {{/workbench.inspect.action}}
  </div>
</div>
