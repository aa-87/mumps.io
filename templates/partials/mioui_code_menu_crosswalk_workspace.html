<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Mapping variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{cross.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{cross.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{cross.action.add}}</div>
      <div>{{cross.action.edit}}</div>
      <div>{{cross.action.delete}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#cross.row}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="font-semibold text-white">{{local}} → {{external}}</div>
        <div class="text-xs text-slate-300">{{status}}</div>
      </div>
      <div class="mt-2 text-xs text-slate-400">{{payer}} • effective {{effective}}</div>
    </div>
    {{/cross.row}}
  </div>
</section>
