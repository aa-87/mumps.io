<div class="panel p-5 collab-surface">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <div class="collab-kicker">Connected users</div>
      <h2 class="mt-2 text-xl font-semibold collab-title">Live workspace presence strip</h2>
      <p class="mt-2 text-sm collab-copy">Dense, scanable connected-user cards for workspaces, sidebars, and header rails.</p>
    </div>
    <div class="collab-pill text-xs">filterConnectedUsers</div>
  </div>
  <div class="mt-5 presence-strip">
    {{#connected}}
    <div class="presence-card">
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="presence-avatar presence-avatar-md avatar-initials {{statusClass}}">{{initials}}</div>
          <div>
            <div class="font-semibold collab-label">{{name}}</div>
            <div class="text-xs collab-muted">{{role}} · {{zone}}</div>
          </div>
        </div>
        <span class="text-xs collab-muted">{{status}}</span>
      </div>
    </div>
    {{/connected}}
  </div>
</div>
