<div class="panel-soft rounded-[1.35rem] p-5" id="report-underpayments-lanes">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Payer leakage lanes</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Where recoverable variance sits by payer</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Rows combine total leakage, visual weight, and a short note about the underlying contract spread.</p>
    </div>
    <span class="badge badge-rose">4 payers</span>
  </div>
  <div class="mt-5 space-y-3">
    {{#billReportUnder.lane}}
    <div class="rounded-[1.15rem] border border-slate-300/70 bg-white/80 p-4 dark:border-slate-700/70 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <span class="badge {{badgeClass}}">{{value}}</span>
      </div>
      <div class="mt-3 h-2.5 rounded-full bg-slate-200 dark:bg-slate-800">
        <div class="h-2.5 rounded-full bg-rose-700/75 dark:bg-rose-500/75" style="width: {{percent}}%;"></div>
      </div>
      <p class="mt-3 text-sm text-slate-700 dark:text-slate-300">{{note}}</p>
    </div>
    {{/billReportUnder.lane}}
  </div>
</div>
