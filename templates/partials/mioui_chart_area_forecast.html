<article class="panel p-5">
  <div class="chart-kicker">Area</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{area.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{area.desc}}</p>
  <div class="chart-surface mt-5 rounded-2xl p-4">
    <svg viewBox="0 0 308 120" class="h-40 w-full">
      <path d="M 10 104 L 298 104" class="chart-axis" stroke-width="1" fill="none"></path>
      <polygon points="{{area.polygon}}" class="chart-fill-violet"></polygon>
      <polyline points="{{area.polyline}}" class="chart-line-violet" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"></polyline>
    </svg>
    <div class="chart-soft-note mt-3 rounded-xl px-3 py-2 text-sm">{{area.note}}</div>
  </div>
</article>
