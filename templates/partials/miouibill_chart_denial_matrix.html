<div class="panel-soft rounded-[1.35rem] p-5" id="report-denials-matrix">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Risk matrix</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Payer risk matrix</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Reason concentration by payer family using a darker light-theme treatment for fast scan reliability.</p>
    </div>
    <span class="badge badge-amber">16 cells</span>
  </div>
  <div class="mt-5 space-y-3">
    {{#billReportDenial.matrix}}
    <div class="grid grid-cols-[11rem_repeat(4,minmax(0,1fr))] gap-2 items-stretch">
      <div class="rounded-2xl border border-slate-300/70 px-3 py-3 text-sm font-semibold text-slate-900 dark:border-slate-700/70 dark:text-slate-100 bg-white/75 dark:bg-slate-950/35">{{label}}</div>
      {{#cell}}
      <div class="rounded-2xl border border-slate-300/70 px-3 py-3 dark:border-slate-700/70 {{panelClass}}" style="opacity: {{opacity}};">
        <div class="text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{label}}</div>
        <div class="mt-1 text-sm font-semibold text-slate-900 dark:text-slate-100">{{value}}</div>
      </div>
      {{/cell}}
    </div>
    {{/billReportDenial.matrix}}
  </div>
</div>
