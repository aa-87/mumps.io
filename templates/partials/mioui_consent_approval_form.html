<section class="panel rounded-[1.35rem] p-5 space-y-4">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>
  <div class="space-y-3">
    {{#item}}
    <label class="flex items-start gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-700 dark:border-white/10 dark:bg-slate-950/40 dark:text-slate-200">
      <input type="checkbox" class="mt-1 h-4 w-4 rounded border-slate-300" {{#isChecked}}checked{{/isChecked}} />
      <span>{{label}}</span>
    </label>
    {{/item}}
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white/60 px-4 py-3 text-sm dark:border-white/10 dark:bg-slate-950/40">
    <div class="text-slate-500 dark:text-slate-400">{{approverLabel}}</div>
    <div class="font-medium text-slate-900 dark:text-white">{{approverValue}}</div>
  </div>
  <button class="primary-button" data-callback="{{callback}}">{{primaryLabel}}</button>
</section>
