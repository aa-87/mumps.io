<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Avatar stack</p>
      <h2 class="mt-2 text-lg font-semibold">Shared review rail</h2>
    </div>
    <span class="badge badge-slate">5 participant types</span>
  </div>
  <div class="mt-4 flex flex-wrap items-center gap-4">
    <div class="flex -space-x-3">
      {{#stack}}
      <div class="flex h-12 w-12 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}} ring-2 ring-slate-950/50">{{initials}}</div>
      {{/stack}}
    </div>
    <div class="space-y-1 text-sm">
      <div class="font-semibold">Role chips</div>
      <div class="muted">Participant stacks should stay readable on dense light and dark shells.</div>
    </div>
  </div>
  <div class="mt-4 grid gap-3 md:grid-cols-2">
    {{#stack}}
    <article class="panel-soft rounded-[1.1rem] px-3 py-3">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}}">{{initials}}</div>
        <div>
          <div class="text-sm font-semibold">{{name}}</div>
          <div class="text-xs muted">{{role}}</div>
        </div>
      </div>
      <div class="mt-2 text-sm">{{workspace}}</div>
      <div class="mt-1 text-xs muted">{{detail}}</div>
    </article>
    {{/stack}}
  </div>
</section>
