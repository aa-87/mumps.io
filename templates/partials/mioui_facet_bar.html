<div class="panel space-y-4">
  <div>
    <div class="section-kicker">Facets</div>
    <h3 class="text-xl font-semibold">{{sync.facetTitle}}</h3>
    <p class="mt-2 text-sm text-slate-300">{{sync.facetLead}}</p>
  </div>
  <div class="flex flex-wrap gap-3">
    {{#sync.facet}}
    <a href="{{href}}" class="panel-soft rounded-2xl border border-white/10 px-4 py-3 min-w-[12rem]">
      <div class="text-xs uppercase tracking-wide muted">{{group}}</div>
      <div class="mt-2 flex items-center justify-between gap-3">
        <span class="font-medium">{{label}}</span>
        <span class="{{badgeClass}}">{{count}}</span>
      </div>
    </a>
    {{/sync.facet}}
    <a href="{{sync.facetClearHref}}" class="ghost-button">Clear all facets</a>
  </div>
</div>
