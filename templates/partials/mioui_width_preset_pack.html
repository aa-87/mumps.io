<div class="panel space-y-4">
  <div>
    <div class="section-kicker">Presets</div>
    <h3 class="text-xl font-semibold">{{sync.presetTitle}}</h3>
    <p class="mt-2 text-sm text-slate-300">{{sync.presetLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-2">
    <div class="space-y-3">
      <div class="text-xs uppercase tracking-wide muted">Width presets</div>
      {{#sync.preset}}
      <div class="panel-soft rounded-2xl border border-white/10 p-3">
        <div class="flex items-center justify-between gap-3">
          <span class="font-medium">{{label}}</span>
          <button class="{{class}}" type="button">{{callback}}</button>
        </div>
        <div class="mt-2 text-xs text-slate-400">{{detail}}</div>
      </div>
      {{/sync.preset}}
    </div>
    <div class="space-y-3">
      <div class="text-xs uppercase tracking-wide muted">Density packs</div>
      {{#sync.density}}
      <div class="panel-soft rounded-2xl border border-white/10 p-3 flex items-center justify-between gap-3">
        <div>
          <div class="font-medium">{{label}}</div>
          <div class="mt-1 text-xs text-slate-400">{{detail}}</div>
        </div>
        <span class="{{badgeClass}}">{{callback}}</span>
      </div>
      {{/sync.density}}
    </div>
  </div>
</div>
