<section class="panel space-y-4">
  <div>
    <h2 class="text-lg font-semibold text-white">{{layout.tri.title}}</h2>
    <p class="text-sm text-slate-300">{{layout.tri.lead}}</p>
  </div>
  <div class="grid gap-3 xl:grid-cols-3">
    {{#layout.tri.col}}
    <article class="panel-soft min-h-28 space-y-1">
      <p class="text-sm font-semibold text-white">{{title}}</p>
      <p class="text-xs text-slate-300">{{detail}}</p>
    </article>
    {{/layout.tri.col}}
  </div>
  <p class="text-xs text-slate-400">Primary callback: <span class="font-mono text-slate-200">{{layout.tri.callback}}</span></p>
</section>
