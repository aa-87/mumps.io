<section class="panel rounded-[1.35rem] p-5 space-y-5">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>
  <div class="grid gap-3 sm:grid-cols-2">
    {{#summary}}
    <div class="rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-3 dark:border-white/10 dark:bg-slate-900/70">
      <div class="text-xs uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{label}}</div>
      <div class="mt-1 text-sm font-medium text-slate-900 dark:text-white">{{value}}</div>
    </div>
    {{/summary}}
  </div>
  <div class="rounded-[1.1rem] border border-sky-500/20 bg-sky-500/5 p-4 dark:border-sky-400/20 dark:bg-sky-400/10">
    <h3 class="text-sm font-semibold text-slate-900 dark:text-white">{{noteTitle}}</h3>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{noteBody}}</p>
  </div>
  <div class="space-y-3">
    {{#device}}
    <div class="flex items-start justify-between gap-3 rounded-xl border border-slate-200 bg-white/70 px-3 py-3 dark:border-white/10 dark:bg-slate-950/40">
      <div>
        <div class="text-sm font-medium text-slate-900 dark:text-white">{{label}}</div>
        <div class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{detail}}</div>
      </div>
      <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium {{badgeClass}}">{{badge}}</span>
    </div>
    {{/device}}
  </div>
  <div class="flex flex-wrap gap-3">
    <button class="primary-button" data-callback="{{callback}}">{{primaryLabel}}</button>
    <button class="ghost-button" data-callback="{{secondaryCallback}}">{{secondaryLabel}}</button>
    <button class="ghost-button" data-callback="{{tertiaryCallback}}">{{tertiaryLabel}}</button>
  </div>
</section>
