<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{emergencyTitle}}</h2>
    <p class="text-sm text-slate-300">{{emergencyLead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-3">
    {{#focusMode}}
    <article class="rounded-2xl border border-amber-900/40 bg-amber-950/20 p-4">
      <div class="font-medium text-white">{{label}}</div>
      <div class="mt-1 text-sm text-slate-300">{{detail}}</div>
      <div class="mt-2 text-xs text-amber-300">{{callback}}</div>
    </article>
    {{/focusMode}}
  </div>
</section>
