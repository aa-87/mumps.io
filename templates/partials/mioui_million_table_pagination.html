<div class="panel rounded-[1.45rem] p-5">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
    <div>
      <div class="text-sm font-semibold">{{pageLabel}}</div>
      <div class="mt-1 text-sm muted">{{windowLabel}}</div>
    </div>
    <div class="flex flex-wrap gap-2">
      {{#hasPrev}}<a href="{{prevHref}}" class="quick-button">Previous page</a>{{/hasPrev}}
      {{#hasNext}}<a href="{{nextHref}}" class="quick-button">Next page</a>{{/hasNext}}
    </div>
  </div>
</div>
