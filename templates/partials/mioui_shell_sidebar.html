<aside class="hidden border-r border-slate-500/10 bg-slate-950/30 px-4 py-5 lg:flex lg:flex-col lg:gap-5">
  <div class="panel rounded-[1.45rem] px-4 py-4">
    <div class="section-kicker">{{shell.eyebrow}}</div>
    <div class="mt-2 text-xl font-semibold tracking-tight">{{app.name}}</div>
    <div class="mt-1 text-sm muted">{{app.tagline}}</div>
  </div>
  <nav class="panel rounded-[1.45rem] p-3">
    <div class="section-kicker px-2 pb-2">Library</div>
    <div class="space-y-1">
      {{#nav}}
      <a href="{{href}}" class="nav-link {{#isActive}}active{{/isActive}}">
        <span class="text-sm font-semibold">{{label}}</span>
        <span class="nav-hint">{{hint}}</span>
      </a>
      {{/nav}}
    </div>
  </nav>
</aside>
