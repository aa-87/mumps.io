<section class="panel rounded-[1.35rem] p-5 space-y-5">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>
  <div class="grid gap-4 xl:grid-cols-2">
    {{#section}}
    <div class="rounded-2xl border border-slate-200 bg-white/60 p-4 dark:border-white/10 dark:bg-slate-950/40">
      <div class="mb-3">
        <h3 class="text-base font-semibold text-slate-900 dark:text-white">{{title}}</h3>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{help}}</p>
      </div>
      <div class="space-y-3">
        {{#item}}
        <label class="flex items-start gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm dark:border-white/10 dark:bg-slate-900/70">
          <input type="checkbox" class="mt-1 h-4 w-4 rounded border-slate-300" {{#isChecked}}checked{{/isChecked}} />
          <span>
            <span class="block font-medium text-slate-900 dark:text-white">{{label}}</span>
            <span class="mt-1 block text-slate-600 dark:text-slate-300">{{hint}}</span>
          </span>
        </label>
        {{/item}}
      </div>
    </div>
    {{/section}}
  </div>
  <div class="flex flex-wrap gap-3">
    <button class="primary-button" data-callback="{{callback}}">{{primaryLabel}}</button>
    <button class="ghost-button">{{secondaryLabel}}</button>
  </div>
</section>
