<div class="panel-soft rounded-[1.35rem] p-4">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Delivery queue</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Scheduled exports</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Outbound report jobs with their format, cadence, and destination controls.</p>
    </div>
    <span class="badge badge-slate">3 exports</span>
  </div>
  <div class="mt-4 space-y-3">
    {{#billReport.export}}
    <div class="rounded-2xl border border-slate-300/70 px-4 py-4 dark:border-slate-700/70 {{panelClass}}">
      <div class="flex flex-col gap-3 xl:flex-row xl:items-start xl:justify-between">
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="font-semibold text-slate-900 dark:text-slate-100">{{name}}</div>
            <span class="badge {{badgeClass}}">{{status}}</span>
          </div>
          <div class="mt-3 grid gap-2 sm:grid-cols-3 text-sm text-slate-700 dark:text-slate-300">
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Format</div>
              <div class="mt-1 font-semibold text-slate-900 dark:text-slate-100">{{format}}</div>
            </div>
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Schedule</div>
              <div class="mt-1 font-semibold text-slate-900 dark:text-slate-100">{{schedule}}</div>
            </div>
            <div>
              <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Destination</div>
              <div class="mt-1 font-semibold text-slate-900 dark:text-slate-100 break-all">{{destination}}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    {{/billReport.export}}
  </div>
</div>
