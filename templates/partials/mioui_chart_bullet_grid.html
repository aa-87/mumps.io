<article class="panel p-5">
  <div class="chart-kicker">Bullet</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{bullet.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{bullet.desc}}</p>
  <div class="mt-5 space-y-5">
    {{#bullet.item}}
    <div>
      <div class="mb-2 flex items-center justify-between text-sm">
        <span class="font-medium chart-label">{{label}}</span>
        <span class="chart-muted">Actual <span class="font-semibold chart-value">{{actual}}</span> / Target <span class="font-semibold chart-value">{{target}}</span></span>
      </div>
      <div class="chart-track relative h-5 rounded-full">
        <div class="absolute inset-y-0 left-0 rounded-full bg-sky-500/70" style="width: {{actualPct}}%;"></div>
        <div class="absolute inset-y-0 w-0.5 bg-amber-400" style="left: {{targetPct}}%;"></div>
      </div>
    </div>
    {{/bullet.item}}
  </div>
</article>
