<div class="space-y-3">
  <div>
    <h3 class="text-lg font-semibold">{{workbench.queryTitle}}</h3>
    <p class="mt-1 muted">{{workbench.queryLead}}</p>
  </div>
  <div class="space-y-2">
    {{#workbench.rule}}
    <div class="panel-soft p-3 rounded-2xl border border-white/10 flex flex-wrap items-center gap-2 text-sm">
      <span class="badge badge-slate">{{field}}</span>
      <span class="muted">{{operator}}</span>
      <span class="font-medium">{{value}}</span>
    </div>
    {{/workbench.rule}}
  </div>
  <div class="flex flex-wrap gap-2 pt-1">
    {{#workbench.chip}}
    <span class="{{class}}">{{label}}</span>
    {{/workbench.chip}}
  </div>
</div>
