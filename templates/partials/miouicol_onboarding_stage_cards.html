<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Setup blocks</p>
      <h2 class="mt-2 text-lg font-semibold">Onboarding variants</h2>
    </div>
    <span class="badge badge-sky">{{onboardVariantLabel}}</span>
  </div>
  <div class="mt-4 grid gap-3 md:grid-cols-2">
    {{#stageCard}}
    <article class="rounded-[1.2rem] border px-3 py-3 {{panelClass}}">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-xs uppercase tracking-[0.24em] muted">{{title}}</div>
          <div class="mt-2 text-sm font-semibold">{{label}}</div>
        </div>
        <span class="badge {{badgeClass}}">{{metric}}</span>
      </div>
      <p class="mt-3 text-sm muted">{{detail}}</p>
    </article>
    {{/stageCard}}
  </div>
</section>
