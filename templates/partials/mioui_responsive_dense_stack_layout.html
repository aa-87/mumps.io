<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{responsiveTitle}}</h2>
    <p class="text-sm text-slate-300">{{responsiveLead}}</p>
  </div>
  <div class="grid gap-3 xl:grid-cols-4 md:grid-cols-2">
    {{#stack}}
    <article class="panel-soft space-y-1">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm font-semibold text-white">{{label}}</p>
        <code class="text-[11px] text-slate-400">{{callback}}</code>
      </div>
      <p class="text-xs uppercase tracking-[0.22em] text-slate-400">{{mode}}</p>
      <p class="text-xs text-slate-300">{{detail}}</p>
    </article>
    {{/stack}}
  </div>
</section>
