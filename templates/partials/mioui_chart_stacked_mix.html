<article class="panel p-5">
  <div class="chart-kicker">Stacked bars</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{stack.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{stack.desc}}</p>
  <div class="mt-5 space-y-5">
    {{#stack.row}}
    <div>
      <div class="mb-2 flex items-center justify-between text-sm">
        <span class="font-medium chart-label">{{label}}</span>
      </div>
      <div class="chart-track flex h-4 overflow-hidden rounded-full">
        {{#segment}}
        <div class="h-4 {{toneClass}}" style="width: {{pct}}%;"></div>
        {{/segment}}
      </div>
      <div class="mt-2 flex flex-wrap gap-2 text-[11px]">
        {{#segment}}
        <span class="chart-stat-chip">{{label}} {{pct}}%</span>
        {{/segment}}
      </div>
    </div>
    {{/stack.row}}
  </div>
</article>
