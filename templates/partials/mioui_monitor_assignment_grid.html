<section class="panel space-y-3">
  <div>
    <p class="section-kicker">Monitor assignment grid</p>
    <h2 class="text-lg font-semibold text-white">{{assignTitle}}</h2>
    <p class="text-sm text-slate-300">{{assignLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-3 text-sm text-slate-300">
    {{#monitor}}
    <article class="rounded-xl border border-slate-800 bg-slate-950/70 p-4 space-y-2">
      <div class="font-medium text-white">{{label}}</div>
      <div class="text-slate-400">{{role}}</div>
      <div>{{detail}}</div>
      <div class="text-xs text-sky-300">{{callback}}</div>
    </article>
    {{/monitor}}
  </div>
</section>
