<div class="panel rounded-[1.45rem] p-5" id="trace-table">
  <div class="section-kicker">Trace table</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  {{#hasRows}}
  <div class="mt-4 overflow-x-auto">
    <table class="grid-table min-w-full text-sm">
      <thead>
        <tr>
          {{#col}}<th class="{{align}}">{{label}}</th>{{/col}}
        </tr>
      </thead>
      <tbody>
        {{#row}}
        <tr>
          {{#cell}}<td>{{value}}</td>{{/cell}}
        </tr>
        {{/row}}
      </tbody>
    </table>
  </div>
  {{/hasRows}}
  {{^hasRows}}
  <div class="mt-4 text-sm muted">{{emptyText}}</div>
  {{/hasRows}}
</div>
