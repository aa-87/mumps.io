<div class="panel rounded-[1.45rem] p-5">
  <div>
    <div class="section-kicker">Column order</div>
    <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
    <p class="mt-2 text-sm muted">{{lead}}</p>
  </div>
  <div class="mt-4 space-y-3">
    {{#item}}
    <div class="panel-soft rounded-2xl p-4">
      <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
        <div class="flex items-center gap-3">
          <span class="badge badge-slate">{{position}}</span>
          <div>
            <div class="text-sm font-semibold">{{label}}</div>
            <div class="mt-1 text-xs muted">{{fieldKey}}</div>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          <span class="quick-button {{^canMoveUp}}opacity-50{{/canMoveUp}}">Move up</span>
          <span class="quick-button {{^canMoveDown}}opacity-50{{/canMoveDown}}">Move down</span>
        </div>
      </div>
    </div>
    {{/item}}
  </div>
</div>
