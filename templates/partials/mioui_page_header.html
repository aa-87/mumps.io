<div class="panel rounded-[1.45rem] p-5">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
    <div>
      <div class="section-kicker">{{eyebrow}}</div>
      <h2 class="mt-2 text-xl font-semibold">{{title}}</h2>
      <p class="mt-2 text-sm muted max-w-3xl">{{lead}}</p>
      <div class="mt-4 flex flex-wrap gap-2">
        {{#meta}}
        <span class="badge {{badgeClass}}">{{label}}: {{value}}</span>
        {{/meta}}
      </div>
    </div>
    <div class="flex flex-wrap gap-2">
      {{#action}}{{> partials/mioui_button.html}}{{/action}}
    </div>
  </div>
</div>
