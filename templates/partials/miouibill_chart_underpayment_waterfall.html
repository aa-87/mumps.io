<div class="panel-soft rounded-[1.35rem] p-5" id="report-underpayments-waterfall">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Underpayment waterfall</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">{{billReportUnder.headline}}</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{billReportUnder.subhead}}</p>
    </div>
    <span class="badge badge-amber">5 steps</span>
  </div>
  <div class="mt-5 grid gap-3 xl:grid-cols-5">
    {{#billReportUnder.waterfall}}
    <div class="rounded-[1.15rem] border border-slate-300/70 bg-white/80 p-4 dark:border-slate-700/70 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <span class="badge {{badgeClass}}">{{percent}}%</span>
      </div>
      <div class="mt-3 text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">{{value}}</div>
      <div class="mt-3 h-2.5 rounded-full bg-slate-200 dark:bg-slate-800">
        <div class="h-2.5 rounded-full bg-slate-800/80 dark:bg-slate-100/80" style="width: {{percent}}%;"></div>
      </div>
      <p class="mt-3 text-sm leading-6 text-slate-700 dark:text-slate-300">{{note}}</p>
    </div>
    {{/billReportUnder.waterfall}}
  </div>
</div>
