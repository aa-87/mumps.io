<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Retirement variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{retire.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{retire.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{retire.action.preview}}</div>
      <div>{{retire.action.archive}}</div>
      <div>{{retire.action.delete}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#retire.impact}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="font-semibold text-white">{{target}}</div>
        <div class="text-xs text-slate-400">{{refs}}</div>
      </div>
      <div class="mt-2 text-sm text-slate-300">{{resolution}}</div>
    </div>
    {{/retire.impact}}
  </div>
</section>
