<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{footerTitle}}</h2>
    <p class="text-sm text-slate-300">{{footerLead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-5">
    <article class="panel-soft space-y-1">
      <p class="text-[11px] uppercase tracking-[0.2em] text-slate-500">State key</p>
      <p class="text-sm text-white">{{stateKey}}</p>
    </article>
    <article class="panel-soft space-y-1">
      <p class="text-[11px] uppercase tracking-[0.2em] text-slate-500">Route</p>
      <p class="text-sm text-white">{{stateRoute}}</p>
    </article>
    <article class="panel-soft space-y-1">
      <p class="text-[11px] uppercase tracking-[0.2em] text-slate-500">Preset</p>
      <p class="text-sm text-white">{{statePreset}}</p>
    </article>
    <article class="panel-soft space-y-1">
      <p class="text-[11px] uppercase tracking-[0.2em] text-slate-500">Changed</p>
      <p class="text-sm text-white">{{stateChanged}}</p>
    </article>
    <article class="panel-soft space-y-1">
      <p class="text-[11px] uppercase tracking-[0.2em] text-slate-500">Callback</p>
      <code class="text-[11px] text-sky-300">{{stateCallback}}</code>
    </article>
  </div>
</section>
