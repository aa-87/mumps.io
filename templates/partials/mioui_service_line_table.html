<div class="panel rounded-[1.45rem] p-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <div class="section-kicker">Billing lines</div>
      <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
    </div>
    <span class="badge badge-slate">{{rowCount}} rows</span>
  </div>
  {{#hasRows}}
  <div class="mt-4 overflow-x-auto rounded-2xl border border-slate-500/10">
    <table class="grid-table min-w-full text-sm">
      <thead class="bg-slate-500/5 text-left muted">
        <tr>
          {{#col}}<th>{{label}}</th>{{/col}}
        </tr>
      </thead>
      <tbody>
        {{#row}}
        <tr class="border-t border-slate-500/10">
          {{#cell}}<td>{{value}}</td>{{/cell}}
        </tr>
        {{/row}}
      </tbody>
    </table>
  </div>
  {{/hasRows}}
  {{^hasRows}}<p class="mt-4 text-sm muted">{{emptyText}}</p>{{/hasRows}}
</div>
