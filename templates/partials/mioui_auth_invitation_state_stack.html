<section class="panel rounded-[1.35rem] p-5 space-y-5">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>
  <div class="grid gap-4 xl:grid-cols-2">
    {{#card}}
    <article class="rounded-[1.2rem] border border-slate-200 bg-white/70 p-4 dark:border-white/10 dark:bg-slate-950/40">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h3 class="text-base font-semibold text-slate-900 dark:text-white">{{title}}</h3>
          <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{desc}}</p>
        </div>
        <span class="rounded-full px-3 py-1 text-xs font-medium {{badgeClass}}">{{badge}}</span>
      </div>
      <dl class="mt-4 space-y-2 text-sm">
        {{#meta}}
        <div class="flex items-start justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 dark:border-white/10 dark:bg-slate-900/70">
          <dt class="text-slate-500 dark:text-slate-400">{{label}}</dt>
          <dd class="text-right font-medium text-slate-900 dark:text-white">{{value}}</dd>
        </div>
        {{/meta}}
      </dl>
      <div class="mt-4 flex flex-wrap gap-3">
        <button class="primary-button" data-callback="{{primaryCallback}}">{{primaryLabel}}</button>
        <button class="ghost-button" data-callback="{{secondaryCallback}}">{{secondaryLabel}}</button>
      </div>
    </article>
    {{/card}}
  </div>
</section>
