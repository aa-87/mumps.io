<div class="panel rounded-[1.45rem] p-5">
  <div class="section-kicker">Filtering</div>
  <h2 class="mt-2 text-lg font-semibold">Filters</h2>
  <p class="mt-2 text-sm muted">Facet groups and active chips stay server-owned so very large result sets do not drift from truth.</p>
  <div class="mt-4 flex flex-wrap gap-2">
    {{#activeFilter}}<a href="{{href}}" class="{{class}}">{{label}}</a>{{/activeFilter}}
  </div>
  <div class="mt-5 space-y-4">
    {{#filterGroup}}
    <div>
      <div class="text-sm font-semibold">{{label}}</div>
      <div class="mt-2 flex flex-wrap gap-2">
        {{#item}}<a href="{{href}}" class="{{class}}">{{label}} ({{count}})</a>{{/item}}
      </div>
    </div>
    {{/filterGroup}}
  </div>
</div>
