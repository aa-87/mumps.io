<section class="panel space-y-4">
  <div>
    <div class="section-kicker">Grouped aggregates</div>
    <h3 class="text-lg font-semibold">{{subtotalTitle}}</h3>
    <p class="text-sm text-slate-300">{{subtotalLead}}</p>
  </div>
  <div class="space-y-2">
    {{#mxSubtotal}}
    <div class="rounded-xl border border-violet-500/30 bg-violet-500/10 px-4 py-3 text-sm">
      <div class="flex items-center justify-between gap-3">
        <div class="font-medium text-slate-100">{{label}}</div>
        <div class="badge badge-violet">Subtotal bands</div>
      </div>
      <div class="mt-1 grid gap-2 text-slate-300 md:grid-cols-3">
        <div>{{count}}</div>
        <div>Charge {{charge}}</div>
        <div>Allowed {{allowed}}</div>
      </div>
    </div>
    {{/mxSubtotal}}
  </div>
</section>
