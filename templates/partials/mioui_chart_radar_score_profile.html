<article class="panel p-5">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <div class="chart-kicker">Radar profile</div>
      <h2 class="mt-2 text-lg font-semibold chart-title">{{radar.title}}</h2>
      <p class="mt-2 max-w-3xl text-sm chart-copy">{{radar.desc}}</p>
    </div>
    <div class="chart-hero-pill text-xs">{{radar.profileLabel}}</div>
  </div>
  <div class="mt-5 grid gap-6 xl:grid-cols-[1.08fr_0.92fr]">
    <div class="chart-soft rounded-2xl p-5">
      <div class="chart-radar-wrap">
        <svg viewBox="0 0 200 200" class="h-80 w-full max-w-md">
          <polygon points="100,24 165,62 154,138 100,176 46,138 35,62" class="chart-axis-soft" fill="none" stroke-width="1.5"></polygon>
          <polygon points="100,46 145,72 138,126 100,152 62,126 55,72" class="chart-axis" fill="none" stroke-width="1.5"></polygon>
          <polygon points="100,68 127,84 123,114 100,132 77,114 73,84" class="chart-axis-soft" fill="none" stroke-width="1.5"></polygon>
          <line x1="100" y1="100" x2="100" y2="18" class="chart-axis" stroke-width="1.5"></line>
          <line x1="100" y1="100" x2="171" y2="59" class="chart-axis" stroke-width="1.5"></line>
          <line x1="100" y1="100" x2="161" y2="141" class="chart-axis" stroke-width="1.5"></line>
          <line x1="100" y1="100" x2="100" y2="184" class="chart-axis" stroke-width="1.5"></line>
          <line x1="100" y1="100" x2="39" y2="141" class="chart-axis" stroke-width="1.5"></line>
          <line x1="100" y1="100" x2="29" y2="59" class="chart-axis" stroke-width="1.5"></line>
          <polygon points="{{radar.overlay}}" class="chart-radar-benchmark"></polygon>
          <polygon points="{{radar.polygon}}" class="chart-radar-fill"></polygon>
        </svg>
        {{#radar.axis}}
        <div class="chart-radar-label" style="left: {{left}}; top: {{top}};">{{label}}</div>
        {{/radar.axis}}
      </div>
    </div>
    <div class="space-y-4">
      <div class="chart-soft rounded-2xl p-4">
        <div class="text-xs uppercase tracking-[0.2em] chart-muted">Legend</div>
        <div class="mt-3 flex flex-wrap gap-2 text-xs">
          <span class="chart-stat-chip">{{radar.legendCurrent}}</span>
          <span class="chart-stat-chip">{{radar.legendBenchmark}}</span>
        </div>
      </div>
      <div class="grid gap-3 sm:grid-cols-2">
        {{#radar.axis}}
        <div class="chart-soft rounded-2xl p-4">
          <div class="text-[11px] uppercase tracking-[0.18em] chart-muted">{{label}}</div>
          <div class="mt-2 flex items-end justify-between gap-3">
            <div class="text-lg font-semibold chart-value">{{score}}</div>
            <div class="chart-track h-2 w-20 overflow-hidden rounded-full">
              <div class="h-2 rounded-full bg-sky-500" style="width: {{score}}%;"></div>
            </div>
          </div>
        </div>
        {{/radar.axis}}
      </div>
    </div>
  </div>
</article>
