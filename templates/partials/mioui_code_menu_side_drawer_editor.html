<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Editor variation</div>
      <h3 class="mt-2 text-lg font-semibold text-white">{{drawer.title}}</h3>
      <p class="mt-2 text-sm text-slate-300">{{drawer.desc}}</p>
    </div>
    <span class="rounded-full border border-slate-700 bg-slate-950 px-3 py-1 text-xs text-slate-200">{{drawer.action.open}}</span>
  </div>
  <div class="mt-4 rounded-2xl border border-slate-800 bg-slate-950/40 p-4">
    <div class="space-y-3">
      {{#drawer.field}}
      <div class="rounded-xl border border-slate-800 bg-slate-950/50 px-3 py-2">
        <div class="text-[11px] uppercase tracking-[0.18em] text-slate-500">{{label}}</div>
        <div class="mt-1 text-sm text-slate-200">{{value}}</div>
      </div>
      {{/drawer.field}}
    </div>
  </div>
  <div class="mt-4 flex flex-wrap gap-2 text-xs">
    <span class="rounded-full border border-sky-500/30 bg-sky-500/10 px-3 py-1 text-sky-200">{{drawer.action.create}}</span>
    <span class="rounded-full border border-rose-500/30 bg-rose-500/10 px-3 py-1 text-rose-200">{{drawer.action.delete}}</span>
  </div>
</section>
