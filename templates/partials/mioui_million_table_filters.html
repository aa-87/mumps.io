<div class="panel rounded-[1.45rem] p-5">
  <div class="section-kicker">Server filters</div>
  <h2 class="mt-2 text-lg font-semibold">Filters</h2>
  <p class="mt-2 text-sm muted">Server-owned facet groups keep one-million-row queues explicit and page-safe.</p>
  <div class="mt-4 flex flex-wrap gap-2">
    {{#activeFilter}}<a href="{{href}}" class="{{class}}">{{label}}</a>{{/activeFilter}}
  </div>
  <div class="mt-4 space-y-4">
    {{#filterGroup}}
    <div class="panel-soft rounded-2xl p-4">
      <div class="text-sm font-semibold">{{label}}</div>
      <div class="mt-3 flex flex-wrap gap-2">
        {{#item}}<a href="{{href}}" class="{{class}}">{{label}} ({{count}})</a>{{/item}}
      </div>
    </div>
    {{/filterGroup}}
  </div>
</div>
