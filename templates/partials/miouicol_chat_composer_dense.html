<section class="panel rounded-[1.35rem] px-3 py-3 lg:px-4" data-miouicol-chat-composer-dense>
  <div class="flex items-center justify-between gap-2">
    <p class="section-kicker">{{composer.helper}}</p>
    <span class="badge badge-slate">Dense</span>
  </div>
  <div class="mt-2 rounded-xl border border-slate-500/10 bg-slate-50/80 px-3 py-3 text-sm text-slate-700 dark:bg-slate-500/5 dark:text-slate-200">{{composer.placeholder}}</div>
  <div class="mt-3 flex flex-wrap gap-2 text-xs">
    {{#composerAction}}
    <span class="quick-button">{{label}}</span>
    {{/composerAction}}
  </div>
</section>
