<div class="panel rounded-[1.45rem] p-5" id="saved-views">
  <div class="section-kicker">Saved views</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <div class="mt-4 flex flex-wrap gap-2">
    {{#item}}
    <a href="{{href}}" class="{{class}}">{{label}} ({{count}})</a>
    {{/item}}
  </div>
</div>
