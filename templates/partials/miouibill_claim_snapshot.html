<div class="panel rounded-[1.45rem] p-5 {{billHeader.panelClass}}">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-start xl:justify-between">
    <div>
      <div class="section-kicker">Key Info</div>
      <div class="mt-1 text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Claim detail</div>
      <div class="mt-2 flex flex-wrap items-center gap-3">
        <h2 class="text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">{{billHeader.claimId}}</h2>
        <span class="badge {{billHeader.badgeClass}}">{{billHeader.status}}</span>
      </div>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">
        Patient: <span class="font-semibold text-slate-900 dark:text-slate-100">{{billHeader.patient}}</span>
        <span class="mx-2 text-slate-400">•</span>
        Payer: <span class="font-semibold text-slate-900 dark:text-slate-100">{{billHeader.payer}}</span>
      </p>
    </div>
    <div class="flex flex-wrap gap-2">
      <a href="#transaction-component" class="primary-button">Open transactions</a>
      <a href="#x12-component" class="quick-button">Open raw X12</a>
      <a href="/mioui/billing-patient-dense" class="quick-button">Dense workspace</a>
    </div>
  </div>

  <div class="mt-5 grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
    {{#billFact}}
    <div class="panel-soft rounded-2xl p-4">
      <dt class="stat-label">{{label}}</dt>
      <dd class="mt-2 text-sm font-semibold text-slate-900 dark:text-slate-100 break-words">{{value}}</dd>
    </div>
    {{/billFact}}
  </div>
</div>
