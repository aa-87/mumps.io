<section class="panel rounded-[1.35rem] p-5 space-y-5">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <div class="mt-2 flex flex-wrap items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
      </div>
      <span class="inline-flex rounded-full px-2.5 py-1 text-xs font-medium {{statusClass}}">{{status}}</span>
    </div>
  </div>

  <div class="rounded-[1.1rem] border border-slate-200 bg-white/70 p-4 dark:border-white/10 dark:bg-slate-950/40">
    <div class="text-lg font-semibold text-slate-900 dark:text-white">{{name}}</div>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{accountRef}}</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
      {{#summary}}
      <div class="rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-3 dark:border-white/10 dark:bg-slate-900/70">
        <div class="text-xs uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{label}}</div>
        <div class="mt-1 text-base font-semibold text-slate-900 dark:text-white">{{value}}</div>
      </div>
      {{/summary}}
    </div>
  </div>

  <div class="grid gap-4 xl:grid-cols-[1.08fr_0.92fr]">
    <div class="rounded-[1.1rem] border border-slate-200 bg-white/70 p-4 dark:border-white/10 dark:bg-slate-950/40">
      <h3 class="text-base font-semibold text-slate-900 dark:text-white">Ledger posture</h3>
      <div class="mt-4 space-y-3">
        {{#ledger}}
        <div class="rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-3 dark:border-white/10 dark:bg-slate-900/70">
          <div class="flex items-start justify-between gap-3">
            <div class="text-sm font-medium text-slate-900 dark:text-white">{{label}}</div>
            <div class="text-xs uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{value}}</div>
          </div>
          <div class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{detail}}</div>
        </div>
        {{/ledger}}
      </div>
    </div>
    <div class="rounded-[1.1rem] border border-slate-200 bg-white/70 p-4 dark:border-white/10 dark:bg-slate-950/40">
      <h3 class="text-base font-semibold text-slate-900 dark:text-white">Assistance and statement rules</h3>
      <div class="mt-4 space-y-3">
        {{#policy}}
        <div class="rounded-xl border border-slate-200 bg-slate-50/80 px-3 py-3 dark:border-white/10 dark:bg-slate-900/70">
          <div class="text-xs uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{label}}</div>
          <div class="mt-1 text-sm font-medium text-slate-900 dark:text-white">{{value}}</div>
          <div class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{detail}}</div>
        </div>
        {{/policy}}
      </div>
    </div>
  </div>

  <div class="flex flex-wrap gap-3">
    <button class="primary-button" data-callback="{{primaryCallback}}">{{primaryLabel}}</button>
    <button class="ghost-button" data-callback="{{secondaryCallback}}">{{secondaryLabel}}</button>
    <button class="ghost-button" data-callback="{{tertiaryCallback}}">{{tertiaryLabel}}</button>
  </div>
</section>
