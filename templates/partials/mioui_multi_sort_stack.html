<section class="panel space-y-4">
  <div>
    <div class="section-kicker">Ordered server sort</div>
    <h3 class="text-lg font-semibold">{{sortTitle}}</h3>
    <p class="text-sm text-slate-300">{{sortLead}}</p>
  </div>
  <div class="space-y-2">
    {{#mxSort}}
    <a href="{{href}}" class="flex items-center justify-between rounded-xl border border-slate-700/80 px-3 py-2 text-sm text-slate-200 hover:border-sky-400/40">
      <span>#{{priority}} {{label}}</span>
      <span class="badge badge-sky">{{dir}}</span>
    </a>
    {{/mxSort}}
  </div>
</section>
