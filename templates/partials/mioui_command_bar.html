<div class="panel rounded-[1.45rem] p-5" id="premium-command-bar">
  <div class="section-kicker">Command bar</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <div class="mt-4 space-y-4">
    {{#group}}
    <div class="panel-soft rounded-2xl p-4">
      <div class="stat-label">{{label}}</div>
      <p class="mt-2 text-sm muted">{{lead}}</p>
      <div class="mt-3 flex flex-wrap gap-3">
        {{#action}}<a href="{{href}}" class="{{class}}">{{label}}</a>{{/action}}
      </div>
    </div>
    {{/group}}
  </div>
</div>
