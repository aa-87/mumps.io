<div class="panel space-y-4">
  <div>
    <div class="section-kicker">Comparison</div>
    <h3 class="text-xl font-semibold">{{sync.compareTitle}}</h3>
    <p class="mt-2 text-sm text-slate-300">{{sync.compareLead}}</p>
  </div>
  <div class="grid gap-4 xl:grid-cols-[1fr_1fr_20rem]">
    <div class="panel-soft rounded-2xl border border-white/10 p-3">
      <div class="text-xs uppercase tracking-wide muted">Row A</div>
      <div class="mt-3 space-y-2">
        {{#sync.compare.left.fact}}
        <div class="flex items-center justify-between gap-3 text-sm"><span class="muted">{{label}}</span><span>{{value}}</span></div>
        {{/sync.compare.left.fact}}
      </div>
    </div>
    <div class="panel-soft rounded-2xl border border-white/10 p-3">
      <div class="text-xs uppercase tracking-wide muted">Row B</div>
      <div class="mt-3 space-y-2">
        {{#sync.compare.right.fact}}
        <div class="flex items-center justify-between gap-3 text-sm"><span class="muted">{{label}}</span><span>{{value}}</span></div>
        {{/sync.compare.right.fact}}
      </div>
    </div>
    <div class="panel-soft rounded-2xl border border-white/10 p-3 space-y-3">
      <div class="text-xs uppercase tracking-wide muted">Differences</div>
      {{#sync.compare.diff}}
      <div>
        <div class="flex items-center gap-2"><span class="{{badgeClass}}">{{label}}</span></div>
        <div class="mt-1 text-sm text-slate-300">{{value}}</div>
      </div>
      {{/sync.compare.diff}}
    </div>
  </div>
</div>
