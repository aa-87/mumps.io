<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Governance variation</div>
      <h3 class="mt-2 text-lg font-semibold text-white">{{approve.title}}</h3>
      <p class="mt-2 text-sm text-slate-300">{{approve.desc}}</p>
    </div>
    <span class="rounded-full border border-slate-700 bg-slate-950 px-3 py-1 text-xs text-slate-200">{{approve.action.submit}}</span>
  </div>
  <div class="mt-4 grid gap-4 xl:grid-cols-3">
    {{#approve.item}}
    <article class="rounded-2xl border border-slate-800 bg-slate-950/40 p-4">
      <div class="text-sm font-semibold text-white">{{batch}}</div>
      <div class="mt-2 text-sm text-slate-300">{{scope}}</div>
      <div class="mt-2 text-xs text-slate-400">Owner: {{owner}}</div>
      <div class="mt-3 inline-flex rounded-full border border-slate-700 bg-slate-900 px-2 py-1 text-[11px] text-slate-200">{{state}}</div>
      <div class="mt-4 flex flex-wrap gap-2 text-xs">
        <span class="rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-emerald-200">{{approve.action.approve}}</span>
        <span class="rounded-full border border-rose-500/30 bg-rose-500/10 px-3 py-1 text-rose-200">{{approve.action.reject}}</span>
      </div>
    </article>
    {{/approve.item}}
  </div>
</section>
