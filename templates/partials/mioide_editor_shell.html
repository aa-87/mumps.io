<section class="editor-shell" id="mioide-editor-shell">
  <div class="editor-tabs scroll-vscode" id="tabs-strip"></div>
  <div class="editor-topbar">
    <div class="min-w-0">
      <div class="section-label">{{activeName}}</div>
      <div class="mt-1 text-xs muted" id="editor-filepath">{{currentPath}}</div>
    </div>
    <div class="editor-toolbar">
      <button type="button" class="icon-btn" id="btn-load" title="Reload current routine" aria-label="Reload current routine">⟲</button>
      <button type="button" class="tool-btn tool-btn-primary" id="btn-save" title="Save current routine" aria-label="Save current routine">Save</button>
      <button type="button" class="tool-btn" id="btn-compile" title="Compile current routine" aria-label="Compile current routine">Compile</button>
      <button type="button" class="tool-btn" id="btn-run" title="Run current routine" aria-label="Run current routine">Run</button>
    </div>
  </div>
  <div class="editor-view scroll-vscode">
    <div id="monaco-editor"></div>
    <textarea id="fallback-editor" class="fallback-editor">{{initialSource}}</textarea>
  </div>
</section>
<script>
(function () {
  var apiBase = '{{apiBase}}';
  var saveMethod = '{{saveMethod}}';
  var initialName = '{{activeName}}';
  var initialSource = document.getElementById('fallback-editor') ? document.getElementById('fallback-editor').value : '';
  var workbench = document.getElementById('mioide-workbench');
  var mainStage = document.getElementById('mioide-main-stage');
  var tabsHost = document.getElementById('tabs-strip');
  var monacoHost = document.getElementById('monaco-editor');
  var fallback = document.getElementById('fallback-editor');
  var titlebarStatus = document.getElementById('titlebar-status');
  var statusState = document.getElementById('status-state');
  var statusFile = document.getElementById('status-file');
  var statusLine = document.getElementById('status-lineinfo');
  var filepathNode = document.getElementById('editor-filepath');
  var outputList = document.getElementById('output-list');
  var floatOutputList = document.getElementById('floatOutputList');
  var paletteOverlay = document.getElementById('paletteOverlay');
  var paletteFilter = document.getElementById('paletteFilter');
  var searchHost = document.getElementById('search-results-list');
  var dockShell = document.getElementById('mioide-dock-shell');
  var windowLayer = document.getElementById('windowLayer');
  var sidebarSplitter = document.getElementById('sidebarSplitter');
  var dockSplitter = document.getElementById('dockSplitter');
  var activeSidebar = 'explorer';
  var activeDock = 'output';
  var activeName = initialName;
  var searchTimer = null;
  var editor = null;
  var xterms = {};
  var nextTerminalId = 1;
  var floatZ = 120;
  var outputLines = [];
  var tabs = {};
  var tabOrder = [];
  var lastSidebarWidth = 240;
  var lastDockHeight = 112;

  function encodeName(name) { return encodeURIComponent(name || ''); }
  function normalizeSource(text) { return String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'); }
  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function currentThemeMode() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function editorThemeForMode(mode) { return mode === 'light' ? 'mumps-light' : 'mumps-dark'; }
  function terminalThemeForMode(mode) {
    return mode === 'light'
      ? { background: '#f8fbff', foreground: '#122032', cursor: '#2563eb' }
      : { background: '#0b1118', foreground: '#d7e3f4', cursor: '#58a6ff' };
  }
  function setStatus(msg) {
    if (titlebarStatus) titlebarStatus.textContent = msg;
    if (statusState) statusState.textContent = msg;
  }
  function toast(msg) { setStatus(msg); }
  function getEditorValue() { return editor ? editor.getValue() : (fallback ? fallback.value : ''); }
  function focusEditor() { if (editor) editor.focus(); else if (fallback) fallback.focus(); }
  function setEditorValue(text) {
    var value = normalizeSource(text);
    if (editor) {
      editor.setValue(value);
      editor.setPosition({ lineNumber: 1, column: 1 });
      editor.revealPositionInCenter({ lineNumber: 1, column: 1 });
    }
    if (fallback) fallback.value = value;
    setTimeout(syncLineInfo, 0);
  }
  function getCursorInfo() {
    if (editor) {
      var pos = editor.getPosition();
      if (pos) return { line: pos.lineNumber, col: pos.column };
    }
    if (fallback) {
      var txt = fallback.value || '';
      var start = fallback.selectionStart || 0;
      var parts = txt.slice(0, start).split('\n');
      return { line: parts.length, col: ((parts[parts.length - 1] || '').length + 1) };
    }
    return { line: 1, col: 1 };
  }
  function syncLineInfo() {
    if (!statusLine) return;
    var info = getCursorInfo();
    statusLine.textContent = 'Ln ' + info.line + ', Col ' + info.col;
  }
  function setThemeMode(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    if (editor && window.monaco && window.monaco.editor) window.monaco.editor.setTheme(editorThemeForMode(mode));
    Object.keys(xterms).forEach(function (key) {
      var term = xterms[key];
      if (term) term.options.theme = terminalThemeForMode(mode);
    });
    toast('Theme: ' + mode);
  }
  function toggleTheme() { setThemeMode(currentThemeMode() === 'dark' ? 'light' : 'dark'); }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function setSidebarWidth(px) {
    lastSidebarWidth = clamp(px, 176, 420);
    workbench.style.setProperty('--sidebar-width', lastSidebarWidth + 'px');
  }
  function setDockHeight(px) {
    lastDockHeight = clamp(px, 72, Math.floor(window.innerHeight * 0.45));
    mainStage.style.setProperty('--dock-height', lastDockHeight + 'px');
  }

  function ensureTab(name, source) {
    if (!name) return;
    if (!tabs[name]) {
      tabs[name] = { name: name, source: normalizeSource(source || ''), loaded: false, dirty: false };
      tabOrder.push(name);
    } else if (typeof source === 'string') {
      tabs[name].source = normalizeSource(source);
    }
  }
  function captureActiveTab() {
    if (!activeName || !tabs[activeName]) return;
    tabs[activeName].source = getEditorValue();
  }
  function markDirty(name, dirty) {
    if (!name || !tabs[name]) return;
    tabs[name].dirty = !!dirty;
    renderTabs();
  }
  function renderTabs() {
    if (!tabsHost) return;
    tabsHost.innerHTML = tabOrder.map(function (name) {
      var tab = tabs[name];
      if (!tab) return '';
      var cls = 'tab-btn' + (name === activeName ? ' is-active' : '') + (tab.dirty ? ' is-dirty' : '');
      return '<div class="' + cls + '" data-name="' + escapeHtml(name) + '"><span class="tab-dot"></span><span class="truncate">' + escapeHtml(name) + '</span><button type="button" class="tab-close" data-close-tab="' + escapeHtml(name) + '" title="Close tab" aria-label="Close tab">×</button></div>';
    }).join('');
  }
  function activateTab(name) {
    if (!name || !tabs[name]) return;
    captureActiveTab();
    activeName = name;
    setEditorValue(tabs[name].source || '');
    if (statusFile) statusFile.textContent = name;
    if (filepathNode) filepathNode.textContent = 'routines/' + name + '.m';
    renderTabs();
    highlightRoutine(name);
    focusEditor();
    toast('Active: ' + name);
  }
  function closeTab(name) {
    var idx;
    if (!name || !tabs[name]) return;
    idx = tabOrder.indexOf(name);
    delete tabs[name];
    if (idx >= 0) tabOrder.splice(idx, 1);
    if (!tabOrder.length) {
      ensureTab(initialName || 'MIOIDE', initialSource || '');
      tabs[initialName || 'MIOIDE'].loaded = true;
      activeName = tabOrder[0];
    } else if (activeName === name) {
      activeName = tabOrder[Math.max(0, idx - 1)] || tabOrder[0];
    }
    renderTabs();
    activateTab(activeName);
  }
  function highlightRoutine(name) {
    document.querySelectorAll('[data-routine]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-routine') === name);
    });
  }

  function appendOutput(text) {
    if (text === undefined || text === null) return;
    String(text).split('\n').forEach(function (line) { outputLines.push(line); });
    if (outputLines.length > 300) outputLines = outputLines.slice(outputLines.length - 300);
    renderOutput();
  }
  function renderOutput() {
    var html = outputLines.map(function (line) { return '<div class="output-line compact-row">' + escapeHtml(line) + '</div>'; }).join('');
    if (outputList) outputList.innerHTML = html;
    if (floatOutputList) floatOutputList.innerHTML = html;
  }

  function openSidebarPanel(id) {
    if (!id) return;
    if (id === 'output' || id === 'terminal') { openDock(id); return; }
    if (id === 'palette') { openPalette(); return; }
    if (id === 'theme') { toggleTheme(); return; }
    if (activeSidebar === id && !workbench.classList.contains('is-sidebar-collapsed')) {
      workbench.classList.add('is-sidebar-collapsed');
      syncActivityButtons();
      return;
    }
    activeSidebar = id;
    workbench.classList.remove('is-sidebar-collapsed');
    setSidebarWidth(lastSidebarWidth);
    document.querySelectorAll('[data-sidebar-panel]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-sidebar-panel') === id);
    });
    syncActivityButtons();
    if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
  }
  function openDock(id) {
    activeDock = id === 'terminal' ? 'terminal' : 'output';
    mainStage.classList.remove('is-dock-collapsed');
    setDockHeight(lastDockHeight);
    document.querySelectorAll('[data-dock-tab]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-dock-tab') === activeDock);
    });
    document.querySelectorAll('[data-dock-pane]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-dock-pane') === activeDock);
    });
    syncActivityButtons();
    if (activeDock === 'terminal') {
      requestAnimationFrame(function () { initTerminalHost('dockTerminalHost', 'dock'); });
    }
    if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
  }
  function toggleDock() {
    mainStage.classList.toggle('is-dock-collapsed');
    if (!mainStage.classList.contains('is-dock-collapsed')) openDock(activeDock || 'output');
    syncActivityButtons();
    if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
  }
  function syncActivityButtons() {
    document.querySelectorAll('[data-activity]').forEach(function (node) {
      var aid = node.getAttribute('data-activity');
      var active = false;
      if (aid === 'output' || aid === 'terminal') active = (aid === activeDock && !mainStage.classList.contains('is-dock-collapsed'));
      else if (aid === 'palette' || aid === 'theme') active = false;
      else active = (aid === activeSidebar && !workbench.classList.contains('is-sidebar-collapsed'));
      node.classList.toggle('is-active', active);
    });
  }

  function filterRoutines() {
    var q = ((document.getElementById('routine-filter') || {}).value || '').toLowerCase();
    document.querySelectorAll('#routine-list [data-routine]').forEach(function (node) {
      var name = (node.getAttribute('data-routine') || '').toLowerCase();
      node.style.display = !q || name.indexOf(q) >= 0 ? '' : 'none';
    });
    syncFloatWindowContent('explorer');
  }
  function renderSearchResults(results) {
    var html = (results || []).map(function (item) {
      var routine = escapeHtml(item.routine || '');
      var line = escapeHtml(item.line || '');
      var text = escapeHtml(item.text || '');
      return '<button type="button" class="search-row compact-row w-full text-left" data-routine="' + routine + '"><div class="flex items-center justify-between gap-3"><span class="text-xs font-semibold">' + routine + '</span><span class="badge">line ' + line + '</span></div><div class="mt-1 text-[11px] muted">' + text + '</div></button>';
    }).join('');
    if (searchHost) searchHost.innerHTML = html || '<div class="debug-row compact-row"><div class="text-xs muted">No results</div></div>';
    syncFloatWindowContent('search');
  }
  function runSearch() {
    var q = ((document.getElementById('search-filter') || {}).value || '').trim();
    if (!q) { renderSearchResults([]); return; }
    fetch(apiBase + '/search?q=' + encodeName(q), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) { renderSearchResults((res.body && res.body.results) || []); })
      .catch(function () { renderSearchResults([]); });
  }

  function loadRoutine(name, opts) {
    opts = opts || {};
    if (!name) return;
    if (tabs[name] && tabs[name].loaded && !opts.force) { activateTab(name); return; }
    toast('Loading ' + name + ' ...');
    fetch(apiBase + '/routines/' + encodeName(name) + '/source', { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        if (!res.ok || !res.body || !res.body.ok) throw new Error('load_failed');
        ensureTab(name, normalizeSource(res.body.source || ''));
        tabs[name].loaded = true;
        tabs[name].dirty = false;
        renderTabs();
        activateTab(name);
        toast('Loaded ' + name);
      })
      .catch(function () {
        toast('Load failed');
        appendOutput('[load] failed: ' + name);
      });
  }
  function saveRoutine() {
    if (!activeName) return;
    captureActiveTab();
    fetch(apiBase + '/routines/' + encodeName(activeName) + '/source', {
      method: saveMethod || 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: getEditorValue()
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        if (!res.ok || !res.body || !res.body.ok) throw new Error('save_failed');
        tabs[activeName].dirty = false;
        renderTabs();
        appendOutput('[save] ' + activeName + ' saved');
        toast('Routine saved successfully');
      })
      .catch(function () {
        appendOutput('[save] failed: ' + activeName);
        toast('Save failed');
      });
  }
  function reloadRoutine() { if (activeName) loadRoutine(activeName, { force: true }); }
  function compileRoutine() {
    if (!activeName) return;
    fetch(apiBase + '/routines/' + encodeName(activeName) + '/compile', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        var body = res.body || {};
        if (!res.ok || !body.ok) { appendOutput('[compile] failed: ' + (body.error || 'compile_failed')); toast('Compile failed'); return; }
        appendOutput('[compile] ' + activeName + ' compiled');
        toast('Routine compiled successfully');
      })
      .catch(function () { appendOutput('[compile] request failed'); toast('Compile failed'); });
  }
  function runRoutine() {
    if (!activeName) return;
    openDock('output');
    fetch(apiBase + '/routines/' + encodeName(activeName) + '/run', { method: 'POST', credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        var body = res.body || {};
        if (!res.ok || !body.ok) { appendOutput('[run] failed: ' + (body.error || 'run_failed')); toast('Run failed'); return; }
        appendOutput('[run] ' + activeName);
        appendOutput(body.output || '(no output)');
        toast('Run completed');
      })
      .catch(function () { appendOutput('[run] request failed'); toast('Run failed'); });
  }

  function bringToFront(win) { floatZ = floatZ + 1; win.style.zIndex = String(floatZ); }
  function wireFloatWindow(win) {
    var handle = win.querySelector('.float-head');
    var drag = null;
    if (!handle) return;
    handle.addEventListener('pointerdown', function (ev) {
      if (ev.target && ev.target.closest('button')) return;
      bringToFront(win);
      drag = { pointerId: ev.pointerId, left: win.offsetLeft, top: win.offsetTop, startX: ev.clientX, startY: ev.clientY };
      win.classList.add('is-dragging');
      handle.classList.add('is-dragging');
      if (handle.setPointerCapture) handle.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    handle.addEventListener('pointermove', function (ev) {
      if (!drag || ev.pointerId !== drag.pointerId) return;
      win.style.left = clamp(drag.left + ev.clientX - drag.startX, 8, window.innerWidth - win.offsetWidth - 8) + 'px';
      win.style.top = clamp(drag.top + ev.clientY - drag.startY, 8, window.innerHeight - win.offsetHeight - 8) + 'px';
    });
    function stopDrag(ev) {
      if (!drag) return;
      if (ev && drag.pointerId !== ev.pointerId) return;
      drag = null;
      win.classList.remove('is-dragging');
      handle.classList.remove('is-dragging');
    }
    handle.addEventListener('pointerup', stopDrag);
    handle.addEventListener('pointercancel', stopDrag);
    win.addEventListener('pointerdown', function () { bringToFront(win); });
  }
  function syncFloatWindowContent(id) {
    var host;
    if (id === 'explorer') {
      host = document.getElementById('floatExplorerBody');
      if (host) host.innerHTML = document.getElementById('routine-list') ? document.getElementById('routine-list').innerHTML : '';
      return;
    }
    if (id === 'search') {
      host = document.getElementById('floatSearchBody');
      if (host) host.innerHTML = searchHost ? searchHost.innerHTML : '';
      return;
    }
    if (id === 'debug') {
      host = document.getElementById('floatDebugBody');
      if (host) host.innerHTML = document.getElementById('debug-panel-body') ? document.getElementById('debug-panel-body').innerHTML : '';
      return;
    }
    if (id === 'problems') {
      host = document.getElementById('floatProblemsBody');
      if (host) host.innerHTML = document.getElementById('problems-list') ? document.getElementById('problems-list').innerHTML : '';
      return;
    }
    if (id === 'snippets') {
      host = document.getElementById('floatSnippetsBody');
      if (host) host.innerHTML = document.getElementById('snippets-list') ? document.getElementById('snippets-list').innerHTML : '';
    }
  }
  function openFloatWindow(id) {
    var win = document.querySelector('[data-float-window="' + id + '"]');
    if (!win) return;
    syncFloatWindowContent(id);
    if (!win.style.left) { win.style.left = '96px'; win.style.top = '88px'; }
    win.classList.add('is-open');
    bringToFront(win);
    if (id === 'terminal') requestAnimationFrame(function () { initTerminalHost('floatTerminalHost', 'float-main'); });
  }
  function closeFloatWindow(id) {
    var win = document.querySelector('[data-float-window="' + id + '"]');
    if (!win) return;
    win.classList.remove('is-open');
  }

  function loadXterm() {
    if (window.Terminal) return Promise.resolve(window.Terminal);
    if (window.__mioideXtermPromise) return window.__mioideXtermPromise;
    window.__mioideXtermPromise = new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-mioide-xterm]');
      function done() { if (window.Terminal) resolve(window.Terminal); else reject(new Error('xterm_missing')); }
      if (existing) {
        if (window.Terminal) { resolve(window.Terminal); return; }
        existing.addEventListener('load', done, { once: true });
        existing.addEventListener('error', reject, { once: true });
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js';
      s.setAttribute('data-mioide-xterm', '1');
      s.onload = done;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return window.__mioideXtermPromise;
  }
  function initTerminalHost(hostId, key) {
    var host = document.getElementById(hostId);
    if (!host) return;
    if (xterms[key]) { if (xterms[key].focus) xterms[key].focus(); return; }
    loadXterm().then(function (TerminalCtor) {
      if (!host || xterms[key]) return;
      host.innerHTML = '';
      var term = new TerminalCtor({
        cursorBlink: true,
        fontFamily: 'IBM Plex Mono, ui-monospace, Menlo, monospace',
        fontSize: 12,
        theme: terminalThemeForMode(currentThemeMode()),
        convertEol: true,
        rows: 18
      });
      term.open(host);
      term.write('MIOIDE terminal\r\n');
      term.write('Xterm.js loaded\r\n');
      term.write('MIOWS session transport pending\r\n');
      term.write('YDB> ');
      xterms[key] = term;
      if (term.focus) term.focus();
    }).catch(function () {
      host.innerHTML = '<div class="output-line compact-row">Terminal library failed to load</div>';
    });
  }
  function createTerminalWindow() {
    var id = 'terminal-' + String(nextTerminalId++);
    var section = document.createElement('section');
    section.className = 'float-win is-open';
    section.setAttribute('data-float-window', id);
    section.style.left = (110 + nextTerminalId * 12) + 'px';
    section.style.top = (100 + nextTerminalId * 10) + 'px';
    section.innerHTML = '<div class="float-head" data-float-handle="' + id + '"><div class="font-semibold">Terminal #' + (nextTerminalId - 1) + '</div><div class="flex items-center gap-2"><button type="button" class="icon-btn icon-btn-compact" data-float-close="' + id + '">✕</button></div></div><div class="float-body"><div class="terminal-host" id="' + id + '-host"></div></div>';
    windowLayer.appendChild(section);
    wireFloatWindow(section);
    section.querySelector('[data-float-close]').addEventListener('click', function () { section.classList.remove('is-open'); });
    bringToFront(section);
    requestAnimationFrame(function () { initTerminalHost(id + '-host', id); });
  }

  function openPalette() {
    if (!paletteOverlay) return;
    paletteOverlay.classList.add('is-open');
    paletteOverlay.setAttribute('aria-hidden', 'false');
    setTimeout(function () { if (paletteFilter) paletteFilter.focus(); }, 10);
  }
  function closePalette() {
    if (!paletteOverlay) return;
    paletteOverlay.classList.remove('is-open');
    paletteOverlay.setAttribute('aria-hidden', 'true');
  }
  function dispatchCommand(id) {
    if (id === 'save') { saveRoutine(); return; }
    if (id === 'reload') { reloadRoutine(); return; }
    if (id === 'compile') { compileRoutine(); return; }
    if (id === 'run') { runRoutine(); return; }
    if (id === 'newterm') { createTerminalWindow(); return; }
    if (id === 'terminal') { openDock('terminal'); return; }
    if (id === 'output') { openDock('output'); return; }
    if (id === 'theme') { toggleTheme(); return; }
    if (id === 'dock') { toggleDock(); return; }
    openSidebarPanel(id);
  }
  function initPalette() {
    var closeBtn = document.getElementById('closePalette');
    var paletteBtn = document.querySelector('[data-activity="palette"]');
    if (paletteBtn) paletteBtn.addEventListener('click', function (ev) { ev.preventDefault(); openPalette(); });
    if (closeBtn) closeBtn.addEventListener('click', closePalette);
    if (paletteOverlay) {
      paletteOverlay.addEventListener('click', function (ev) { if (ev.target === paletteOverlay) closePalette(); });
    }
    if (paletteFilter) {
      paletteFilter.addEventListener('input', function () {
        var q = (paletteFilter.value || '').toLowerCase();
        document.querySelectorAll('#paletteList [data-palette-command]').forEach(function (node) {
          var txt = (node.textContent || '').toLowerCase();
          node.style.display = !q || txt.indexOf(q) >= 0 ? '' : 'none';
        });
      });
    }
    document.querySelectorAll('[data-palette-command]').forEach(function (btn) {
      btn.addEventListener('click', function () { closePalette(); dispatchCommand(btn.getAttribute('data-palette-command') || ''); });
    });
  }

  function loadMonaco() {
    if (window.monaco && window.monaco.editor) return Promise.resolve(window.monaco);
    if (window.__mioideMonacoPromise) return window.__mioideMonacoPromise;
    window.__mioideMonacoPromise = new Promise(function (resolve, reject) {
      function boot() {
        if (window.monaco && window.monaco.editor) { resolve(window.monaco); return; }
        if (!(window.require && window.require.config)) { reject(new Error('monaco_loader_missing')); return; }
        window.require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
        window.require(['vs/editor/editor.main'], function () { resolve(window.monaco); }, reject);
      }
      var existing = document.querySelector('script[data-mioide-monaco-loader]');
      if (existing) {
        if (window.monaco && window.monaco.editor) { resolve(window.monaco); return; }
        if (window.require && window.require.config) { boot(); return; }
        existing.addEventListener('load', boot, { once: true });
        existing.addEventListener('error', reject, { once: true });
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js';
      s.setAttribute('data-mioide-monaco-loader', '1');
      s.onload = boot;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return window.__mioideMonacoPromise;
  }
  function initMonaco() {
    if (!(monacoHost && fallback)) return;
    loadMonaco().then(function (monaco) {
      if (!window.__mioideMonacoConfigured) {
        monaco.languages.register({ id: 'mumps' });
        monaco.languages.setMonarchTokensProvider('mumps', {
          keywords: ['S','SET','D','DO','Q','QUIT','I','IF','E','ELSE','F','FOR','N','NEW','K','KILL','W','WRITE','R','READ','X','XECUTE','LOCK','OPEN','USE','CLOSE','MERGE','TSTART','TCOMMIT','TRESTART','TROLLBACK'],
          tokenizer: { root: [ [/;.*$/, 'comment'], [/"([^"\\]|\\.)*"?/, 'string'], [/\$[A-Z%][A-Z0-9]*/i, 'predefined'], [/\^[A-Z%][A-Z0-9]*/i, 'type.identifier'], [/(?:^|\s)(S|SET|D|DO|Q|QUIT|I|IF|E|ELSE|F|FOR|N|NEW|K|KILL|W|WRITE|R|READ|X|XECUTE|LOCK|OPEN|USE|CLOSE|MERGE|TSTART|TCOMMIT|TRESTART|TROLLBACK)(?=\s|$)/i, 'keyword'], [/%?[A-Z][A-Z0-9]*/i, 'identifier'], [/\d+(?:\.\d+)?/, 'number'], [/[,()]/, 'delimiter'] ] }
        });
        monaco.languages.setLanguageConfiguration('mumps', { comments: { lineComment: ';' }, autoClosingPairs: [{ open: '"', close: '"' }, { open: '(', close: ')' }] });
        monaco.editor.defineTheme('mumps-dark', { base: 'vs-dark', inherit: true, rules: [{ token: 'comment', foreground: '6a9955' }, { token: 'keyword', foreground: '58a6ff' }, { token: 'string', foreground: 'ce9178' }, { token: 'predefined', foreground: 'c586c0' }, { token: 'type.identifier', foreground: '4fc1ff' }], colors: { 'editor.background': '#0f1723', 'editor.lineHighlightBackground': '#162133', 'editorGutter.background': '#0f1723' } });
        monaco.editor.defineTheme('mumps-light', { base: 'vs', inherit: true, rules: [{ token: 'comment', foreground: '2f855a' }, { token: 'keyword', foreground: '2563eb' }, { token: 'string', foreground: 'b45309' }, { token: 'predefined', foreground: '7c3aed' }, { token: 'type.identifier', foreground: '0284c7' }], colors: { 'editor.background': '#ffffff', 'editor.lineHighlightBackground': '#eff6ff', 'editorGutter.background': '#ffffff' } });
        window.__mioideMonacoConfigured = true;
      }
      if (editor) return;
      editor = monaco.editor.create(monacoHost, {
        value: normalizeSource(fallback.value || ''),
        language: 'mumps',
        theme: editorThemeForMode(currentThemeMode()),
        automaticLayout: true,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        wordWrap: 'off',
        fontFamily: 'IBM Plex Mono, ui-monospace, Menlo, monospace',
        fontSize: 12,
        lineNumbersMinChars: 3,
        roundedSelection: false,
        renderLineHighlight: 'all'
      });
      fallback.style.display = 'none';
      monacoHost.style.display = 'block';
      editor.onDidChangeCursorPosition(syncLineInfo);
      editor.onDidFocusEditorText(syncLineInfo);
      editor.onDidChangeModelContent(function () { captureActiveTab(); markDirty(activeName, true); syncLineInfo(); });
      syncLineInfo();
    }).catch(function () {
      toast('Monaco failed to load');
    });
  }

  function initSplitters() {
    if (sidebarSplitter) {
      sidebarSplitter.addEventListener('pointerdown', function (ev) {
        if (workbench.classList.contains('is-sidebar-collapsed')) return;
        var rect = workbench.getBoundingClientRect();
        sidebarSplitter.classList.add('is-dragging');
        function move(e) { setSidebarWidth(e.clientX - rect.left - 54); if (editor && editor.layout) editor.layout(); }
        function up() { sidebarSplitter.classList.remove('is-dragging'); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up, { once: true });
        ev.preventDefault();
      });
    }
    if (dockSplitter) {
      dockSplitter.addEventListener('pointerdown', function (ev) {
        if (mainStage.classList.contains('is-dock-collapsed')) return;
        var rect = mainStage.getBoundingClientRect();
        var statusHeight = document.getElementById('mioide-statusbar') ? document.getElementById('mioide-statusbar').offsetHeight : 32;
        dockSplitter.classList.add('is-dragging');
        function move(e) { setDockHeight(rect.bottom - statusHeight - e.clientY); if (editor && editor.layout) editor.layout(); }
        function up() { dockSplitter.classList.remove('is-dragging'); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up, { once: true });
        ev.preventDefault();
      });
    }
  }
  function initButtons() {
    document.querySelectorAll('[data-activity]').forEach(function (btn) {
      var id = btn.getAttribute('data-activity');
      if (id === 'palette') return;
      btn.addEventListener('click', function (ev) { ev.preventDefault(); openSidebarPanel(id); });
    });
    document.getElementById('toggleSidebarBtn') && document.getElementById('toggleSidebarBtn').addEventListener('click', function () {
      workbench.classList.toggle('is-sidebar-collapsed');
      if (!workbench.classList.contains('is-sidebar-collapsed')) setSidebarWidth(lastSidebarWidth);
      syncActivityButtons();
      if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
    });
    document.getElementById('toggleDockBtn') && document.getElementById('toggleDockBtn').addEventListener('click', toggleDock);
    document.getElementById('btn-collapse-dock') && document.getElementById('btn-collapse-dock').addEventListener('click', toggleDock);
    document.getElementById('btn-new-terminal') && document.getElementById('btn-new-terminal').addEventListener('click', function () { dispatchCommand('newterm'); });
    document.getElementById('btn-load') && document.getElementById('btn-load').addEventListener('click', reloadRoutine);
    document.getElementById('btn-save') && document.getElementById('btn-save').addEventListener('click', saveRoutine);
    document.getElementById('btn-compile') && document.getElementById('btn-compile').addEventListener('click', compileRoutine);
    document.getElementById('btn-run') && document.getElementById('btn-run').addEventListener('click', runRoutine);
    document.getElementById('themeToggle') && document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.querySelectorAll('[data-dock-tab]').forEach(function (btn) { btn.addEventListener('click', function () { openDock(btn.getAttribute('data-dock-tab')); }); });
    document.querySelectorAll('[data-float-open]').forEach(function (btn) { btn.addEventListener('click', function () { openFloatWindow(btn.getAttribute('data-float-open')); }); });
    document.querySelectorAll('[data-float-close]').forEach(function (btn) { btn.addEventListener('click', function () { closeFloatWindow(btn.getAttribute('data-float-close')); }); });
    document.addEventListener('click', function (ev) {
      var item = ev.target.closest('[data-routine]');
      var tab = ev.target.closest('[data-name]');
      var closeTabBtn = ev.target.closest('[data-close-tab]');
      var sn = ev.target.closest('.snippet-btn[data-code]');
      if (closeTabBtn) { ev.preventDefault(); ev.stopPropagation(); closeTab(closeTabBtn.getAttribute('data-close-tab') || ''); return; }
      if (sn) { ev.preventDefault(); insertSnippet(sn.getAttribute('data-code') || ''); return; }
      if (item) { ev.preventDefault(); loadRoutine(item.getAttribute('data-routine') || ''); return; }
      if (tab) { ev.preventDefault(); activateTab(tab.getAttribute('data-name') || ''); }
    });
    document.addEventListener('keydown', function (ev) {
      var k = (ev.key || '').toLowerCase();
      if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && k === 'p') { ev.preventDefault(); openPalette(); return; }
      if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key === '`') { ev.preventDefault(); dispatchCommand('newterm'); return; }
      if ((ev.metaKey || ev.ctrlKey) && k === 's') { ev.preventDefault(); saveRoutine(); return; }
      if ((ev.metaKey || ev.ctrlKey) && k === 'r') { ev.preventDefault(); reloadRoutine(); return; }
      if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && k === 'b') { ev.preventDefault(); compileRoutine(); return; }
      if ((ev.metaKey || ev.ctrlKey) && k === 'j') { ev.preventDefault(); toggleDock(); return; }
      if ((ev.metaKey || ev.ctrlKey) && k === 'b') { ev.preventDefault(); document.getElementById('toggleSidebarBtn').click(); return; }
      if (ev.altKey && k === '1') { ev.preventDefault(); openSidebarPanel('explorer'); return; }
      if (ev.altKey && k === '2') { ev.preventDefault(); openSidebarPanel('search'); return; }
      if (ev.altKey && k === '3') { ev.preventDefault(); openSidebarPanel('debug'); return; }
      if (ev.altKey && k === '4') { ev.preventDefault(); openSidebarPanel('problems'); return; }
      if (ev.altKey && k === '5') { ev.preventDefault(); openSidebarPanel('snippets'); return; }
      if (ev.altKey && k === '6') { ev.preventDefault(); openDock('output'); return; }
      if (ev.altKey && k === '7') { ev.preventDefault(); openDock('terminal'); return; }
      if (ev.key === 'F5') { ev.preventDefault(); runRoutine(); return; }
      if (ev.key === 'Escape') { closePalette(); }
    });
    document.getElementById('routine-filter') && document.getElementById('routine-filter').addEventListener('input', filterRoutines);
    document.getElementById('search-filter') && document.getElementById('search-filter').addEventListener('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 180); });
    if (fallback) {
      fallback.addEventListener('keyup', syncLineInfo);
      fallback.addEventListener('click', syncLineInfo);
      fallback.addEventListener('input', function () { captureActiveTab(); markDirty(activeName, true); syncLineInfo(); });
    }
    window.addEventListener('resize', function () { if (editor && editor.layout) editor.layout(); });
  }
  function insertSnippet(code) {
    if (!code) return;
    if (editor) {
      var sel = editor.getSelection();
      editor.executeEdits('snippet', [{ range: sel, text: code, forceMoveMarkers: true }]);
      focusEditor();
    } else if (fallback) {
      var start = fallback.selectionStart || 0;
      var end = fallback.selectionEnd || 0;
      fallback.value = fallback.value.slice(0, start) + code + fallback.value.slice(end);
      fallback.focus();
    }
    captureActiveTab();
    markDirty(activeName, true);
    syncLineInfo();
  }

  setSidebarWidth(lastSidebarWidth);
  setDockHeight(lastDockHeight);
  ensureTab(initialName, initialSource);
  tabs[initialName].loaded = true;
  renderTabs();
  activateTab(initialName);
  Array.prototype.forEach.call(document.querySelectorAll('#output-list .output-line'), function (node) { outputLines.push(node.textContent || ''); });
  renderOutput();
  initButtons();
  initPalette();
  initSplitters();
  document.querySelectorAll('.float-win').forEach(function (win, idx) {
    if (!win.style.left) { win.style.left = (88 + idx * 16) + 'px'; win.style.top = (80 + idx * 12) + 'px'; }
    wireFloatWindow(win);
  });
  initMonaco();
  openDock('output');
  runSearch();
  syncActivityButtons();
  syncLineInfo();
})();
</script>
