<section class="editor-shell" id="mioide-editor-shell">
  <div class="editor-tabs scroll-vscode" id="tabs-strip"></div>
  <div class="editor-topbar">
    <div class="min-w-0">
      <div class="section-label">{{activeName}}</div>
      <div class="mt-1 text-xs muted" id="editor-filepath">{{currentPath}}</div>
    </div>
    <div class="editor-toolbar">
      <button type="button" class="icon-btn" id="btn-load" title="Reload current routine" aria-label="Reload current routine">⟲</button>
      <button type="button" class="tool-btn tool-btn-primary" id="btn-save" title="Save current routine" aria-label="Save current routine">Save</button>
      <button type="button" class="tool-btn" id="btn-compile" title="Compile current routine" aria-label="Compile current routine">Compile</button>
      <button type="button" class="tool-btn" id="btn-run" title="Run current routine" aria-label="Run current routine">Run</button>
    </div>
  </div>
  <div class="editor-view scroll-vscode">
    <div id="monaco-editor"></div>
    <textarea id="fallback-editor" class="fallback-editor">{{initialSource}}</textarea>
  </div>
</section>
<script>
(function () {
  var apiBase = '{{apiBase}}';
  var wsEventsUrl = '{{wsEventsUrl}}';
  var wsTerminalUrl = '{{wsTerminalUrl}}';
  var saveMethod = '{{saveMethod}}';
  var initialName = '{{activeName}}';
  var initialSource = document.getElementById('fallback-editor') ? document.getElementById('fallback-editor').value : '';
  var workbench = document.getElementById('mioide-workbench');
  var mainStage = document.getElementById('mioide-main-stage');
  var tabsHost = document.getElementById('tabs-strip');
  var monacoHost = document.getElementById('monaco-editor');
  var fallback = document.getElementById('fallback-editor');
  var titlebarStatus = document.getElementById('titlebar-status');
  var statusState = document.getElementById('status-state');
  var statusFile = document.getElementById('status-file');
  var statusLine = document.getElementById('status-lineinfo');
  var statusConn = document.getElementById('status-conn');
  var filepathNode = document.getElementById('editor-filepath');
  var outputList = document.getElementById('output-list');
  var floatOutputList = document.getElementById('floatOutputList');
  var paletteOverlay = document.getElementById('paletteOverlay');
  var paletteFilter = document.getElementById('paletteFilter');
  var searchHost = document.getElementById('search-results-list');
  var dockShell = document.getElementById('mioide-dock-shell');
  var windowLayer = document.getElementById('windowLayer');
  var sidebarSplitter = document.getElementById('sidebarSplitter');
  var dockSplitter = document.getElementById('dockSplitter');
  var activeSidebar = 'explorer';
  var activeDock = 'output';
  var activeName = initialName;
  var searchTimer = null;
  var editor = null;
  var xterms = {};
  var termSockets = {};
  var eventsSocket = null;
  var eventsSocketTimer = null;
  var clientId = loadClientId();
  var nextTerminalId = 1;
  var floatZ = 120;
  var outputLines = [];
  var tabs = {};
  var tabOrder = [];
  var lastSidebarWidth = 240;
  var lastDockHeight = 112;

  function encodeName(name) { return encodeURIComponent(name || ''); }

  function loadClientId() {
    var key = 'mioide.clientId';
    try {
      var cur = window.localStorage.getItem(key);
      if (cur) return cur;
      cur = 'mioide-' + Math.random().toString(36).slice(2, 10);
      window.localStorage.setItem(key, cur);
      return cur;
    } catch (e) {
      return 'mioide-' + Math.random().toString(36).slice(2, 10);
    }
  }
  function wsUrl(path) {
    var proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    return proto + window.location.host + path;
  }
  function updateConnection(text) {
    if (statusConn) statusConn.textContent = text;
  }
  function sendEvent(obj) {
    if (!eventsSocket || eventsSocket.readyState !== WebSocket.OPEN) return;
    eventsSocket.send(JSON.stringify(obj || {}));
  }
  function connectEvents() {
    if (!wsEventsUrl || typeof WebSocket === 'undefined') { updateConnection('Events unavailable'); return; }
    if (eventsSocket && (eventsSocket.readyState === WebSocket.OPEN || eventsSocket.readyState === WebSocket.CONNECTING)) return;
    updateConnection('Events connecting');
    eventsSocket = new WebSocket(wsUrl(wsEventsUrl));
    eventsSocket.addEventListener('open', function () {
      updateConnection('Events live');
      eventsSocket.send(JSON.stringify({ cmd: 'hello', clientId: clientId }));
    });
    eventsSocket.addEventListener('message', function (ev) {
      var obj = {};
      try { obj = JSON.parse(ev.data || '{}'); } catch (e) { return; }
      if (obj.type === 'hello') { updateConnection('Events live'); return; }
      if (obj.type === 'ping') { sendEvent({ cmd: 'ping', clientId: clientId }); return; }
      if (obj.message) toast(obj.message);
      if (obj.type && obj.status) appendOutput('[' + obj.type + '] ' + (obj.routine || '') + ' ' + obj.status);
      if (obj.output) appendOutput(obj.output);
      if (window.MIOIDE && typeof window.MIOIDE.onEvent === 'function') window.MIOIDE.onEvent(obj);
    });
    eventsSocket.addEventListener('close', function () {
      updateConnection('Events offline');
      if (eventsSocketTimer) window.clearTimeout(eventsSocketTimer);
      eventsSocketTimer = window.setTimeout(connectEvents, 1500);
    });
    eventsSocket.addEventListener('error', function () { updateConnection('Events error'); });
  }
  function normalizeSource(text) { return String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'); }
  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function currentThemeMode() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
  function editorThemeForMode(mode) { return mode === 'light' ? 'mumps-light' : 'mumps-dark'; }
  function terminalThemeForMode(mode) {
    return mode === 'light'
      ? { background: '#f8fbff', foreground: '#122032', cursor: '#2563eb' }
      : { background: '#0b1118', foreground: '#d7e3f4', cursor: '#58a6ff' };
  }
  function setStatus(msg) {
    if (titlebarStatus) titlebarStatus.textContent = msg;
    if (statusState) statusState.textContent = msg;
  }
  function toast(msg) { setStatus(msg); }
  function getEditorValue() { return editor ? editor.getValue() : (fallback ? fallback.value : ''); }
  function focusEditor() { if (editor) editor.focus(); else if (fallback) fallback.focus(); }
  function setEditorValue(text) {
    var value = normalizeSource(text);
    if (editor) {
      editor.setValue(value);
      editor.setPosition({ lineNumber: 1, column: 1 });
      editor.revealPositionInCenter({ lineNumber: 1, column: 1 });
    }
    if (fallback) fallback.value = value;
    setTimeout(syncLineInfo, 0);
  }
  function getCursorInfo() {
    if (editor) {
      var pos = editor.getPosition();
      if (pos) return { line: pos.lineNumber, col: pos.column };
    }
    if (fallback) {
      var txt = fallback.value || '';
      var start = fallback.selectionStart || 0;
      var parts = txt.slice(0, start).split('\n');
      return { line: parts.length, col: ((parts[parts.length - 1] || '').length + 1) };
    }
    return { line: 1, col: 1 };
  }
  function syncLineInfo() {
    if (!statusLine) return;
    var info = getCursorInfo();
    statusLine.textContent = 'Ln ' + info.line + ', Col ' + info.col;
    if (window.MIOIDE && typeof window.MIOIDE.onCursorChange === 'function') window.MIOIDE.onCursorChange(info);
  }
  function setThemeMode(mode) {
    document.documentElement.setAttribute('data-theme', mode);
    if (editor && window.monaco && window.monaco.editor) window.monaco.editor.setTheme(editorThemeForMode(mode));
    Object.keys(xterms).forEach(function (key) {
      var term = xterms[key];
      if (term) term.options.theme = terminalThemeForMode(mode);
    });
    toast('Theme: ' + mode);
  }
  function toggleTheme() { setThemeMode(currentThemeMode() === 'dark' ? 'light' : 'dark'); }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function setSidebarWidth(px) {
    lastSidebarWidth = clamp(px, 176, 420);
    workbench.style.setProperty('--sidebar-width', lastSidebarWidth + 'px');
  }
  function setDockHeight(px) {
    lastDockHeight = clamp(px, 72, Math.floor(window.innerHeight * 0.45));
    mainStage.style.setProperty('--dock-height', lastDockHeight + 'px');
  }

  function ensureTab(name, source) {
    if (!name) return;
    if (!tabs[name]) {
      tabs[name] = { name: name, source: normalizeSource(source || ''), loaded: false, dirty: false };
      tabOrder.push(name);
    } else if (typeof source === 'string') {
      tabs[name].source = normalizeSource(source);
    }
  }
  function captureActiveTab() {
    if (!activeName || !tabs[activeName]) return;
    tabs[activeName].source = getEditorValue();
  }
  function markDirty(name, dirty) {
    if (!name || !tabs[name]) return;
    tabs[name].dirty = !!dirty;
    renderTabs();
  }
  function renderTabs() {
    if (!tabsHost) return;
    tabsHost.innerHTML = tabOrder.map(function (name) {
      var tab = tabs[name];
      if (!tab) return '';
      var cls = 'tab-btn' + (name === activeName ? ' is-active' : '') + (tab.dirty ? ' is-dirty' : '');
      return '<div class="' + cls + '" data-name="' + escapeHtml(name) + '"><span class="tab-dot"></span><span class="truncate">' + escapeHtml(name) + '</span><button type="button" class="tab-close" data-close-tab="' + escapeHtml(name) + '" title="Close tab" aria-label="Close tab">×</button></div>';
    }).join('');
  }
  function activateTab(name) {
    if (!name || !tabs[name]) return;
    captureActiveTab();
    activeName = name;
    setEditorValue(tabs[name].source || '');
    if (statusFile) statusFile.textContent = name;
    if (filepathNode) filepathNode.textContent = 'routines/' + name + '.m';
    renderTabs();
    highlightRoutine(name);
    focusEditor();
    toast('Active: ' + name);
    if (window.MIOIDE && typeof window.MIOIDE.onRoutineChange === 'function') window.MIOIDE.onRoutineChange(name);
  }
  function closeTab(name) {
    var idx;
    if (!name || !tabs[name]) return;
    idx = tabOrder.indexOf(name);
    delete tabs[name];
    if (idx >= 0) tabOrder.splice(idx, 1);
    if (!tabOrder.length) {
      ensureTab(initialName || 'MIOIDE', initialSource || '');
      tabs[initialName || 'MIOIDE'].loaded = true;
      activeName = tabOrder[0];
    } else if (activeName === name) {
      activeName = tabOrder[Math.max(0, idx - 1)] || tabOrder[0];
    }
    renderTabs();
    activateTab(activeName);
  }
  function highlightRoutine(name) {
    document.querySelectorAll('[data-routine]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-routine') === name);
    });
  }

  function appendOutput(text) {
    if (text === undefined || text === null) return;
    String(text).split('\n').forEach(function (line) { outputLines.push(line); });
    if (outputLines.length > 300) outputLines = outputLines.slice(outputLines.length - 300);
    renderOutput();
  }
  function renderOutput() {
    var html = outputLines.map(function (line) { return '<div class="output-line compact-row">' + escapeHtml(line) + '</div>'; }).join('');
    if (outputList) outputList.innerHTML = html;
    if (floatOutputList) floatOutputList.innerHTML = html;
  }

  function openSidebarPanel(id) {
    if (!id) return;
    if (id === 'output' || id === 'terminal') { openDock(id); return; }
    if (id === 'palette') { openPalette(); return; }
    if (id === 'theme') { toggleTheme(); return; }
    if (activeSidebar === id && !workbench.classList.contains('is-sidebar-collapsed')) {
      workbench.classList.add('is-sidebar-collapsed');
      syncActivityButtons();
      return;
    }
    activeSidebar = id;
    workbench.classList.remove('is-sidebar-collapsed');
    setSidebarWidth(lastSidebarWidth);
    document.querySelectorAll('[data-sidebar-panel]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-sidebar-panel') === id);
    });
    syncActivityButtons();
    if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
  }
  function openDock(id) {
    activeDock = id === 'terminal' ? 'terminal' : 'output';
    mainStage.classList.remove('is-dock-collapsed');
    setDockHeight(lastDockHeight);
    document.querySelectorAll('[data-dock-tab]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-dock-tab') === activeDock);
    });
    document.querySelectorAll('[data-dock-pane]').forEach(function (node) {
      node.classList.toggle('is-active', node.getAttribute('data-dock-pane') === activeDock);
    });
    syncActivityButtons();
    if (activeDock === 'terminal') {
      requestAnimationFrame(function () { initTerminalHost('dockTerminalHost', 'dock'); });
    }
    if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
  }
  function toggleDock() {
    mainStage.classList.toggle('is-dock-collapsed');
    if (!mainStage.classList.contains('is-dock-collapsed')) openDock(activeDock || 'output');
    syncActivityButtons();
    if (editor && editor.layout) setTimeout(function () { editor.layout(); }, 15);
  }
  function syncActivityButtons() {
    document.querySelectorAll('[data-activity]').forEach(function (node) {
      var aid = node.getAttribute('data-activity');
      var active = false;
      if (aid === 'output' || aid === 'terminal') active = (aid === activeDock && !mainStage.classList.contains('is-dock-collapsed'));
      else if (aid === 'palette' || aid === 'theme') active = false;
      else active = (aid === activeSidebar && !workbench.classList.contains('is-sidebar-collapsed'));
      node.classList.toggle('is-active', active);
    });
  }

  function filterRoutines() {
    var q = ((document.getElementById('routine-filter') || {}).value || '').toLowerCase();
    document.querySelectorAll('#routine-list [data-routine]').forEach(function (node) {
      var name = (node.getAttribute('data-routine') || '').toLowerCase();
      node.style.display = !q || name.indexOf(q) >= 0 ? '' : 'none';
    });
    syncFloatWindowContent('explorer');
  }
  function renderSearchResults(results) {
    var html = (results || []).map(function (item) {
      var routine = escapeHtml(item.routine || '');
      var line = escapeHtml(item.line || '');
      var text = escapeHtml(item.text || '');
      return '<button type="button" class="search-row compact-row w-full text-left" data-routine="' + routine + '"><div class="flex items-center justify-between gap-3"><span class="text-xs font-semibold">' + routine + '</span><span class="badge">line ' + line + '</span></div><div class="mt-1 text-[11px] muted">' + text + '</div></button>';
    }).join('');
    if (searchHost) searchHost.innerHTML = html || '<div class="debug-row compact-row"><div class="text-xs muted">No results</div></div>';
    syncFloatWindowContent('search');
  }
  function runSearch() {
    var q = ((document.getElementById('search-filter') || {}).value || '').trim();
    if (!q) { renderSearchResults([]); return; }
    fetch(apiBase + '/search?q=' + encodeName(q) + '&client=' + encodeName(clientId), { credentials: 'same-origin', headers: { 'X-MIOIDE-Client': clientId } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) { renderSearchResults((res.body && res.body.results) || []); })
      .catch(function () { renderSearchResults([]); });
  }

  function loadRoutine(name, opts) {
    opts = opts || {};
    if (!name) return;
    if (tabs[name] && tabs[name].loaded && !opts.force) { activateTab(name); return; }
    toast('Loading ' + name + ' ...');
    fetch(apiBase + '/routines/' + encodeName(name) + '/source?client=' + encodeName(clientId), { credentials: 'same-origin', headers: { 'X-MIOIDE-Client': clientId } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        if (!res.ok || !res.body || !res.body.ok) throw new Error('load_failed');
        ensureTab(name, normalizeSource(res.body.source || ''));
        tabs[name].loaded = true;
        tabs[name].dirty = false;
        renderTabs();
        activateTab(name);
        toast('Loaded ' + name);
      })
      .catch(function () {
        toast('Load failed');
        appendOutput('[load] failed: ' + name);
      });
  }
  function saveRoutine() {
    if (!activeName) return;
    captureActiveTab();
    fetch(apiBase + '/routines/' + encodeName(activeName) + '/source', {
      method: saveMethod || 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'text/plain; charset=utf-8', 'X-MIOIDE-Client': clientId },
      body: getEditorValue()
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        if (!res.ok || !res.body || !res.body.ok) throw new Error('save_failed');
        tabs[activeName].dirty = false;
        renderTabs();
        appendOutput('[save] ' + activeName + ' saved');
        toast('Routine saved successfully');
      })
      .catch(function () {
        appendOutput('[save] failed: ' + activeName);
        toast('Save failed');
      });
  }
  function reloadRoutine() { if (activeName) loadRoutine(activeName, { force: true }); }
  function compileRoutine() {
    if (!activeName) return;
    fetch(apiBase + '/routines/' + encodeName(activeName) + '/compile?client=' + encodeName(clientId), { method: 'POST', credentials: 'same-origin', headers: { 'X-MIOIDE-Client': clientId } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        var body = res.body || {};
        if (!res.ok || !body.ok) { appendOutput('[compile] failed: ' + (body.error || 'compile_failed')); toast('Compile failed'); return; }
        appendOutput('[compile] ' + activeName + ' compiled');
        toast('Routine compiled successfully');
      })
      .catch(function () { appendOutput('[compile] request failed'); toast('Compile failed'); });
  }
  function runRoutine() {
    if (!activeName) return;
    openDock('output');
    fetch(apiBase + '/routines/' + encodeName(activeName) + '/run?client=' + encodeName(clientId), { method: 'POST', credentials: 'same-origin', headers: { 'X-MIOIDE-Client': clientId } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j || {} }; }); })
      .then(function (res) {
        var body = res.body || {};
        if (!res.ok || !body.ok) { appendOutput('[run] failed: ' + (body.error || 'run_failed')); toast('Run failed'); return; }
        appendOutput('[run] ' + activeName);
        appendOutput(body.output || '(no output)');
        toast('Run completed');
      })
      .catch(function () { appendOutput('[run] request failed'); toast('Run failed'); });
  }

  function bringToFront(win) { floatZ = floatZ + 1; win.style.zIndex = String(floatZ); }
  function wireFloatWindow(win) {
    var handle = win.querySelector('.float-head');
    var drag = null;
    if (!handle) return;
    handle.addEventListener('pointerdown', function (ev) {
      if (ev.target && ev.target.closest('button')) return;
      bringToFront(win);
      drag = { pointerId: ev.pointerId, left: win.offsetLeft, top: win.offsetTop, startX: ev.clientX, startY: ev.clientY };
      win.classList.add('is-dragging');
      handle.classList.add('is-dragging');
      if (handle.setPointerCapture) handle.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    handle.addEventListener('pointermove', function (ev) {
      if (!drag || ev.pointerId !== drag.pointerId) return;
      win.style.left = clamp(drag.left + ev.clientX - drag.startX, 8, window.innerWidth - win.offsetWidth - 8) + 'px';
      win.style.top = clamp(drag.top + ev.clientY - drag.startY, 8, window.innerHeight - win.offsetHeight - 8) + 'px';
    });
    function stopDrag(ev) {
      if (!drag) return;
      if (ev && drag.pointerId !== ev.pointerId) return;
      drag = null;
      win.classList.remove('is-dragging');
      handle.classList.remove('is-dragging');
    }
    handle.addEventListener('pointerup', stopDrag);
    handle.addEventListener('pointercancel', stopDrag);
    win.addEventListener('pointerdown', function () { bringToFront(win); });
  }
  function syncFloatWindowContent(id) {
    var host;
    if (id === 'explorer') {
      host = document.getElementById('floatExplorerBody');
      if (host) host.innerHTML = document.getElementById('routine-list') ? document.getElementById('routine-list').innerHTML : '';
      return;
    }
    if (id === 'search') {
      host = document.getElementById('floatSearchBody');
      if (host) host.innerHTML = searchHost ? searchHost.innerHTML : '';
      return;
    }
    if (id === 'debug') {
      host = document.getElementById('floatDebugBody');
      if (host) host.innerHTML = document.getElementById('debug-panel-body') ? document.getElementById('debug-panel-body').innerHTML : '';
      return;
    }
    if (id === 'problems') {
      host = document.getElementById('floatProblemsBody');
      if (host) host.innerHTML = document.getElementById('problems-list') ? document.getElementById('problems-list').innerHTML : '';
      return;
    }
    if (id === 'snippets') {
      host = document.getElementById('floatSnippetsBody');
      if (host) host.innerHTML = document.getElementById('snippets-list') ? document.getElementById('snippets-list').innerHTML : '';
    }
  }
  function openFloatWindow(id) {
    var win = document.querySelector('[data-float-window="' + id + '"]');
    if (!win) return;
    syncFloatWindowContent(id);
    if (!win.style.left) { win.style.left = '96px'; win.style.top = '88px'; }
    win.classList.add('is-open');
    bringToFront(win);
    if (id === 'terminal') requestAnimationFrame(function () { initTerminalHost('floatTerminalHost', 'float-main'); });
  }
  function closeFloatWindow(id) {
    var win = document.querySelector('[data-float-window="' + id + '"]');
    if (!win) return;
    win.classList.remove('is-open');
  }

  function loadXterm() {
    if (window.Terminal) return Promise.resolve(window.Terminal);
    if (window.__mioideXtermPromise) return window.__mioideXtermPromise;
    window.__mioideXtermPromise = new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-mioide-xterm]');
      function done() { if (window.Terminal) resolve(window.Terminal); else reject(new Error('xterm_missing')); }
      if (existing) {
        if (window.Terminal) { resolve(window.Terminal); return; }
        existing.addEventListener('load', done, { once: true });
        existing.addEventListener('error', reject, { once: true });
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js';
      s.setAttribute('data-mioide-xterm', '1');
      s.onload = done;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    return window.__mioideXtermPromise;
  }
  function closeTerminalSocket(key) {
    var ws = termSockets[key];
    if (!ws) return;
    try { ws.close(); } catch (e) {}
    delete termSockets[key];
  }
  function bindTerminal(term, key) {
    var line = '';
    term.onData(function (data) {
      var ws = termSockets[key];
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (data === '\r') {
        ws.send(JSON.stringify({ cmd: 'input', clientId: clientId, data: line }));
        line = '';
        return;
      }
      if (data === '\u007f') {
        if (line.length > 0) {
          line = line.slice(0, -1);
          term.write('\b \b');
        }
        return;
      }
      if (data === '\u0003') {
        ws.send(JSON.stringify({ cmd: 'clear', clientId: clientId }));
        return;
      }
      if (data >= ' ') {
        line += data;
        term.write(data);
      }
    });
    term.onResize(function (size) {
      var ws = termSockets[key];
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ cmd: 'resize', clientId: clientId, cols: size.cols, rows: size.rows }));
    });
  }
  function connectTerminal(term, key) {
    if (!wsTerminalUrl || typeof WebSocket === 'undefined') {
      term.write('WebSocket terminal unavailable\r\n');
      return;
    }
    closeTerminalSocket(key);
    var ws = new WebSocket(wsUrl(wsTerminalUrl));
    termSockets[key] = ws;

    if (!state.sid) { if (name === 'stop') return; start(); return; }
    json(apiBase + '/sessions/' + enc(state.sid) + '/command', 'POST', { cmd: name, clientId: ide.getClientId ? ide.getClientId() : '' }).then(function (res) {
      if (!res.ok || !res.body || !res.body.ok) { ide.toast && ide.toast('Debug command failed'); return; }
      updateSession(res.body);
      ide.appendOutput && ide.appendOutput('[debug] ' + name + ' -> ' + (res.body.status || '')); 
    });
  }
  function toggleBreakpoint(line) {
    var name = activeRoutine();
    line = parseInt(line || currentLine(), 10) || 1;
    if (!name) return;
    json(apiBase + '/routines/' + enc(name) + '/breakpoints/' + line + '/toggle', 'POST', { clientId: ide.getClientId ? ide.getClientId() : '' }).then(function (res) {
      if (!res.ok || !res.body || !res.body.ok) { ide.toast && ide.toast('Breakpoint toggle failed'); return; }
      ide.appendOutput && ide.appendOutput('[debug] breakpoint ' + (res.body.enabled ? 'enabled' : 'disabled') + ' @ ' + line);
      refreshBreakpoints();
      refreshSession();
    });
  }
  function addWatch() {
    var input = byId('dbg-watch-expr');
    if (!input || !input.value) return;
    if (!state.sid) { start(); setTimeout(addWatch, 150); return; }
    json(apiBase + '/sessions/' + enc(state.sid) + '/watches', 'POST', { expr: input.value }).then(function (res) {
      if (!res.ok || !res.body || !res.body.ok) { ide.toast && ide.toast('Watch add failed'); return; }
      input.value = '';
      updateSession(res.body);
    });
  }
  function removeWatch(idx) {
    if (!state.sid) return;
    json(apiBase + '/sessions/' + enc(state.sid) + '/watches/' + idx + '/remove', 'POST', { ok: 1 }).then(function (res) { if (res.ok && res.body && res.body.ok) updateSession(res.body); });
  }
  function evalExpr() {
    var input = byId('dbg-eval-expr');
    var out = byId('dbg-eval-result');
    if (!input || !input.value || !state.sid || !out) return;
    json(apiBase + '/sessions/' + enc(state.sid) + '/eval', 'POST', { expr: input.value }).then(function (res) {
      out.textContent = (res.ok && res.body && res.body.ok) ? String(res.body.value || '') : ((res.body && res.body.error) || 'eval_failed');
    });
  }
  ide.debug = { start: start, continueRun: function () { cmd('continue'); }, stepInto: function () { cmd('stepinto'); }, stepOver: function () { cmd('stepover'); }, stop: function () { cmd('stop'); }, toggleBreakpoint: toggleBreakpoint, refresh: refreshSession };
  ide.onRoutineChange = function () { refreshBreakpoints(); };
  ide.onEvent = function (obj) { if (!obj) return; if (obj.sid && state.sid && obj.sid === state.sid && (obj.type === 'debug' || obj.type === 'watch' || obj.type === 'debug_eval')) refreshSession(); if (obj.type === 'breakpoint' && obj.routine === activeRoutine()) refreshBreakpoints(); };
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.closest('#dbg-start-btn')) { ev.preventDefault(); start(); return; }
    if (t.closest('#dbg-continue-btn')) { ev.preventDefault(); cmd('continue'); return; }
    if (t.closest('#dbg-stepinto-btn')) { ev.preventDefault(); cmd('stepinto'); return; }
    if (t.closest('#dbg-stepover-btn')) { ev.preventDefault(); cmd('stepover'); return; }
    if (t.closest('#dbg-stop-btn')) { ev.preventDefault(); cmd('stop'); return; }
    if (t.closest('#dbg-bp-toggle')) { ev.preventDefault(); toggleBreakpoint((byId('dbg-bp-line') || {}).value); return; }
    if (t.closest('#dbg-watch-add')) { ev.preventDefault(); addWatch(); return; }
    if (t.closest('#dbg-eval-run')) { ev.preventDefault(); evalExpr(); return; }
    var bp = t.closest('[data-dbg-toggle-line]');
    if (bp) { ev.preventDefault(); toggleBreakpoint(bp.getAttribute('data-dbg-toggle-line')); return; }
    var wr = t.closest('[data-dbg-remove-watch]');
    if (wr) { ev.preventDefault(); removeWatch(wr.getAttribute('data-dbg-remove-watch')); return; }
  });
  refreshBreakpoints();
})();
</script>
