<div class="panel rounded-[1.45rem] p-5 space-y-4">
  <div>
    <div class="section-kicker">Combined surface</div>
    <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
    <p class="mt-2 text-sm muted max-w-3xl">{{lead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
    {{#insight}}
    <div class="panel-soft rounded-2xl p-4 fx-rise">
      <div class="stat-label">{{label}}</div>
      <div class="mt-2 flex items-center justify-between gap-3">
        <div class="text-2xl font-semibold">{{value}}</div>
        <span class="badge {{badgeClass}}">{{label}}</span>
      </div>
    </div>
    {{/insight}}
  </div>
  <div class="flex flex-wrap gap-2">
    {{#pref}}
    <span class="badge badge-slate">{{label}}: {{value}}</span>
    {{/pref}}
  </div>
</div>
