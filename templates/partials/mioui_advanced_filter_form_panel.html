<section class="panel rounded-[1.35rem] p-5 space-y-4">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">Dense filter form</p>
      <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
    </div>
    <div class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1 text-xs text-slate-600 dark:border-white/10 dark:bg-slate-950/40 dark:text-slate-300">{{savedName}}</div>
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    {{#field}}
    <div>
      <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{label}}</label>
      <input class="field w-full" value="{{value}}" />
    </div>
    {{/field}}
  </div>
  <button class="quick-button" data-callback="{{callback}}">{{primaryLabel}}</button>
</section>
