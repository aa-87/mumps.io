<header class="flex items-center justify-between gap-4">
  <a href="/plgd" class="group flex items-center gap-3">
    <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-sky-400/30 to-indigo-500/30 ring-1 ring-white/10 shadow-sm animate-floaty"></div>
    <div class="leading-tight">
      <div class="text-lg font-semibold tracking-tight">{{brand}}</div>
      <div class="text-xs text-slate-400">MIOTPL template playground + library</div>
    </div>
  </a>

  <nav class="flex items-center gap-2">
    {{#nav}}
      <a href="{{href}}"
         class="rounded-xl px-3 py-2 text-sm text-slate-200/90 hover:text-white hover:bg-white/5 ring-1 ring-transparent hover:ring-white/10 transition">
        {{label}}
      </a>
    {{/nav}}
    <a href="/plgd/playground"
       class="rounded-xl px-3 py-2 text-sm font-semibold bg-white/10 hover:bg-white/15 ring-1 ring-white/10 transition">
      Open Playground
    </a>
  </nav>
</header>
