<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Connected users</p>
      <h2 class="mt-2 text-lg font-semibold">Roster rows</h2>
    </div>
    <span class="badge badge-emerald">Realtime-ready</span>
  </div>
  <div class="mt-4 space-y-2">
    {{#connected}}
    <a href="{{href}}" class="panel-soft flex items-center justify-between gap-3 rounded-[1.15rem] px-3 py-3 hover:bg-slate-500/5">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}}">{{initials}}</div>
        <div>
          <div class="text-sm font-semibold">{{name}}</div>
          <div class="text-xs muted">{{workspace}}</div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs font-semibold">{{unreadLabel}}</div>
        <div class="text-xs muted">{{note}}</div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="inline-flex h-3 w-3 rounded-full {{stateClass}}"></span>
        <span class="muted">{{state}}</span>
      </div>
    </a>
    {{/connected}}
  </div>
</section>
