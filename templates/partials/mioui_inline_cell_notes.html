<div class="panel space-y-4">
  <div>
    <div class="section-kicker">Annotations</div>
    <h3 class="text-xl font-semibold">{{sync.notesTitle}}</h3>
    <p class="mt-2 text-sm text-slate-300">{{sync.notesLead}}</p>
  </div>
  <div class="space-y-3">
    {{#sync.note}}
    <div class="panel-soft rounded-2xl border border-white/10 p-3">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-medium">{{row}} / {{column}}</div>
        <span class="{{badgeClass}}">{{callback}}</span>
      </div>
      <p class="mt-2 text-sm text-slate-300">{{text}}</p>
    </div>
    {{/sync.note}}
  </div>
</div>
