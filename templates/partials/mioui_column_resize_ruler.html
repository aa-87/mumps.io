<section class="panel space-y-4">
  <div>
    <div class="section-kicker">Resize cues</div>
    <h3 class="text-lg font-semibold">{{resizeTitle}}</h3>
    <p class="text-sm text-slate-300">{{resizeLead}}</p>
  </div>
  <div class="space-y-2 text-sm">
    {{#mxResize}}
    <div class="rounded-xl border border-slate-700/80 px-3 py-2">
      <div class="flex items-center justify-between gap-3">
        <span class="font-medium text-slate-100">{{label}}</span>
        <span class="badge badge-amber">Resize handle</span>
      </div>
      <div class="mt-1 text-slate-300">Current {{width}} · Min {{min}} · Max {{max}}</div>
    </div>
    {{/mxResize}}
  </div>
</section>
