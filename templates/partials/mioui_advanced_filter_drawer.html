<div class="panel rounded-[1.45rem] p-5" id="advanced-filters">
  <div class="section-kicker">Advanced filters</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <div class="mt-4 space-y-4">
    {{#section}}
    <div class="panel-soft rounded-2xl p-4">
      <div class="stat-label">{{label}}</div>
      <p class="mt-2 text-sm muted">{{lead}}</p>
      <dl class="mt-3 grid gap-3 sm:grid-cols-2">
        {{#field}}
        <div class="rounded-2xl border border-slate-500/10 p-3">
          <dt class="stat-label">{{label}}</dt>
          <dd class="mt-2 text-sm font-medium">{{value}}</dd>
          <div class="mt-1 text-xs muted">{{meta}}</div>
        </div>
        {{/field}}
      </dl>
    </div>
    {{/section}}
  </div>
</div>
