<article class="panel p-5">
  <div class="chart-kicker">Histogram</div>
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <h2 class="mt-2 text-lg font-semibold chart-title">{{hist.title}}</h2>
      <p class="mt-2 max-w-2xl text-sm chart-copy">{{hist.desc}}</p>
    </div>
    <div class="chart-band-chip text-xs">{{hist.bandLabel}} · {{hist.bandRange}}</div>
  </div>
  <div class="mt-5 grid gap-4 xl:grid-cols-[4rem_1fr]">
    <div class="flex items-start justify-center">
      <div class="text-[11px] uppercase tracking-[0.22em] chart-muted" style="writing-mode:vertical-rl;transform:rotate(180deg);">{{hist.yMax}}</div>
    </div>
    <div class="chart-soft rounded-2xl p-4">
      <div class="chart-hist-grid">
        {{#hist.bucket}}
        <div class="chart-hist-bin">
          <div class="text-[11px] font-semibold chart-value">{{count}}</div>
          <div class="flex h-full w-full items-end">
            <div class="chart-hist-bar {{toneClass}}" style="height: {{pct}}%;"></div>
          </div>
          <div class="text-[11px] chart-muted">{{label}}</div>
        </div>
        {{/hist.bucket}}
      </div>
    </div>
  </div>
</article>
