<div class="panel-soft rounded-[1.35rem] p-4">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Denial mix</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Top denial reasons</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">High-dollar denial patterns paired with the next operator action.</p>
    </div>
    <span class="badge badge-slate">4 reasons</span>
  </div>
  <div class="mt-4 space-y-3">
    {{#billReport.reason}}
    <div class="rounded-2xl border border-slate-300/70 px-4 py-4 dark:border-slate-700/70 {{panelClass}}">
      <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <div class="font-semibold text-slate-900 dark:text-slate-100">{{reason}}</div>
            <span class="badge {{badgeClass}}">{{count}} claims</span>
          </div>
          <div class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{action}}</div>
        </div>
        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{amount}}</div>
      </div>
    </div>
    {{/billReport.reason}}
  </div>
</div>
