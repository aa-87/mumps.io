<article class="panel p-5">
  <div class="chart-kicker">Box range</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{box.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{box.desc}}</p>
  <div class="chart-soft mt-5 rounded-2xl p-5">
    <div class="flex items-center justify-between text-[11px] uppercase tracking-[0.2em] chart-muted">
      <span>{{box.scaleMin}}</span>
      <span>{{box.scaleMid}}</span>
      <span>{{box.scaleMax}}</span>
    </div>
    <div class="chart-box-lane mt-4">
      <div class="chart-box-whisker" style="left: {{box.minPct}}%; width: {{box.maxPct}}%;"></div>
      <div class="chart-box-whisker-cap" style="left: {{box.minPct}}%;"></div>
      <div class="chart-box-whisker-cap" style="left: {{box.maxPct}}%;"></div>
      <div class="chart-box-range" style="left: {{box.q1Pct}}%; width: calc({{box.q3Pct}}% - {{box.q1Pct}}%);"></div>
      <div class="chart-box-median" style="left: {{box.medianPct}}%;"></div>
    </div>
    <div class="mt-5 grid gap-3 sm:grid-cols-5">
      {{#box.summary}}
      <div class="chart-soft rounded-2xl p-3 text-center">
        <div class="text-[11px] uppercase tracking-[0.18em] chart-muted">{{label}}</div>
        <div class="mt-2 text-base font-semibold chart-value">{{value}}</div>
      </div>
      {{/box.summary}}
    </div>
  </div>
  <p class="mt-4 text-sm chart-copy">{{box.note}}</p>
</article>
