<section class="panel p-5 rounded-2xl border border-amber-400/30 bg-amber-500/10 space-y-3">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-amber-200">Validation</p>
    <h2 class="text-xl font-semibold">Please correct the highlighted fields</h2>
  </div>
  <ul class="space-y-2 text-sm text-amber-100">
    <li>Email must use a work domain</li>
    <li>Password must include a special character</li>
    <li>Role selection is required</li>
  </ul>
  <button class="quick-button" data-callback="{{validationCallback}}">Focus invalid field</button>
</section>
