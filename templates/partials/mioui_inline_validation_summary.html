<section class="panel rounded-[1.35rem] border border-amber-300 bg-amber-50/80 p-5 space-y-3 dark:border-amber-400/30 dark:bg-amber-500/10">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-amber-700 dark:text-amber-200">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-amber-900 dark:text-white">{{title}}</h2>
  </div>
  <ul class="space-y-2 text-sm text-amber-900 dark:text-amber-100">
    {{#issue}}
    <li class="rounded-xl border border-amber-300/70 bg-white/50 px-3 py-2 dark:border-amber-400/20 dark:bg-white/5">{{text}}</li>
    {{/issue}}
  </ul>
  <button class="quick-button" data-callback="{{callback}}">{{primaryLabel}}</button>
</section>
