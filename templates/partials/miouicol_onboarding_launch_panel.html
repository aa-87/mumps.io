<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Launch and defaults</p>
      <h2 class="mt-2 text-lg font-semibold">{{launchPanel.title}}</h2>
    </div>
    <span class="badge badge-violet">{{launchPanel.lead}}</span>
  </div>
  <p class="mt-3 text-sm muted">{{launchPanel.body}}</p>
  <div class="mt-4 space-y-2">
    {{#launchChoice}}
    <article class="panel-soft rounded-[1.15rem] px-3 py-3">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-sm font-semibold">{{label}}</div>
          <div class="mt-1 text-xs muted">{{detail}}</div>
        </div>
        <span class="badge {{badgeClass}}">Ready</span>
      </div>
    </article>
    {{/launchChoice}}
  </div>
  <div class="mt-4 rounded-[1.15rem] border border-slate-500/15 bg-slate-500/5 px-3 py-3">
    <div class="text-xs uppercase tracking-[0.24em] muted">{{launchPanel.tip}}</div>
    <div class="mt-2 text-sm muted">{{launchPanel.tipBody}}</div>
  </div>
  <div class="mt-4 flex flex-wrap gap-2">
    <a class="primary-button" href="{{launchPanel.primaryHref}}">{{launchPanel.primaryLabel}}</a>
    <a class="quick-button" href="{{launchPanel.secondaryHref}}">{{launchPanel.secondaryLabel}}</a>
  </div>
</section>
