<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{shortcutTitle}}</h2>
    <p class="text-sm text-slate-300">{{shortcutLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-5 md:grid-cols-2">
    {{#shortcut}}
    <article class="panel-soft space-y-1">
      <p class="text-sm font-semibold text-white">{{label}}</p>
      <p class="text-xs uppercase tracking-[0.22em] text-slate-400">{{key}}</p>
      <code class="text-[11px] text-slate-400">{{callback}}</code>
    </article>
    {{/shortcut}}
  </div>
</section>
