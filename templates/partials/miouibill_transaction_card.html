<div class="panel-soft rounded-[1.35rem] p-5 {{panelClass}}">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Service line</div>
      <h3 class="mt-2 text-lg font-semibold text-slate-900 dark:text-slate-100">{{title}}</h3>
      <p class="mt-1 text-sm text-slate-700 dark:text-slate-300">{{status}}</p>
    </div>
    <span class="badge {{badgeClass}}">{{title}}</span>
  </div>

  <div class="mt-4 grid gap-3 sm:grid-cols-2">
    {{#fact}}
    <div class="panel rounded-2xl p-4">
      <dt class="stat-label">{{label}}</dt>
      <dd class="mt-2 text-sm font-semibold text-slate-900 dark:text-slate-100">{{value}}</dd>
    </div>
    {{/fact}}
  </div>

  <div class="mt-4 grid gap-3 xl:grid-cols-3">
    <div class="panel rounded-2xl p-4">
      <div class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{codeTitle}}</div>
      <dl class="mt-3 space-y-2 text-sm">
        <div class="flex items-start justify-between gap-3">
          <dt class="font-semibold text-slate-600 dark:text-slate-300">Code</dt>
          <dd class="text-right font-semibold text-slate-900 dark:text-slate-100">{{code}}</dd>
        </div>
        <div>
          <dt class="font-semibold text-slate-600 dark:text-slate-300">Description</dt>
          <dd class="mt-1 text-slate-900 dark:text-slate-100">{{codeDesc}}</dd>
        </div>
      </dl>
    </div>

    <div class="panel rounded-2xl p-4">
      <div class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{diagTitle}}</div>
      <dl class="mt-3 space-y-2 text-sm">
        <div class="flex items-start justify-between gap-3">
          <dt class="font-semibold text-slate-600 dark:text-slate-300">Code</dt>
          <dd class="text-right font-semibold text-slate-900 dark:text-slate-100">{{diagCode}}</dd>
        </div>
        <div>
          <dt class="font-semibold text-slate-600 dark:text-slate-300">Description</dt>
          <dd class="mt-1 text-slate-900 dark:text-slate-100">{{diagDesc}}</dd>
        </div>
      </dl>
    </div>

    <div class="panel rounded-2xl p-4">
      <div class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Ordering Provider</div>
      <dl class="mt-3 space-y-2 text-sm">
        <div>
          <dt class="font-semibold text-slate-600 dark:text-slate-300">Name:</dt>
          <dd class="mt-1 font-semibold text-slate-900 dark:text-slate-100">{{providerName}}</dd>
        </div>
        <div>
          <dt class="font-semibold text-slate-600 dark:text-slate-300">NPI:</dt>
          <dd class="mt-1 text-slate-900 dark:text-slate-100">{{providerNpi}}</dd>
        </div>
        <div class="text-xs text-slate-600 dark:text-slate-400">{{providerTitle}}</div>
      </dl>
    </div>
  </div>
</div>
