<section class="panel space-y-3">
  <div>
    <p class="section-kicker">Transition sequence panel</p>
    <p class="text-sm text-slate-300">{{sequenceLead}}</p>
  </div>
  <div class="space-y-2">
    {{#sequence}}
    <article class="panel-soft">
      <div class="flex items-center justify-between gap-3">
        <h3 class="font-medium text-white">{{label}}</h3>
        <span class="text-xs text-sky-300">{{callback}}</span>
      </div>
      <p class="mt-2 text-sm text-slate-300">{{detail}}</p>
    </article>
    {{/sequence}}
  </div>
</section>
