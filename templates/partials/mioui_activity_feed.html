<div class="panel rounded-[1.45rem] p-5" id="activity-feed">
  <div class="section-kicker">Activity feed</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <div class="mt-4 space-y-3">
    {{#item}}
    <div class="panel-soft rounded-2xl p-4">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-sm font-semibold">{{title}}</div>
          <div class="mt-1 text-sm muted">{{body}}</div>
        </div>
        <span class="badge {{badgeClass}}">{{stamp}}</span>
      </div>
    </div>
    {{/item}}
  </div>
</div>
