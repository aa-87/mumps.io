{{#onboarding.launch}}
<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex flex-col gap-3 lg:flex-row lg:items-start lg:justify-between">
    <div>
      <div class="section-kicker">Workspace onboarding</div>
      <h2 class="mt-2 text-xl font-semibold">{{title}}</h2>
      <p class="mt-2 text-sm muted">{{lead}}</p>
    </div>
    <span class="badge {{badgeClass}}">{{summary}}</span>
  </div>
  <div class="mt-4 grid gap-3 lg:grid-cols-2">
    {{#step}}
    <article class="panel-soft rounded-[1.2rem] px-3 py-3">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <span class="badge {{badgeClass}}">{{number}}</span>
          <div>
            <div class="text-sm font-semibold">{{title}}</div>
            <div class="mt-1 text-xs muted">{{stepLabel}}</div>
          </div>
        </div>
        <span class="badge {{badgeClass}}">{{label}}</span>
      </div>
      <p class="mt-3 text-sm muted">{{body}}</p>
    </article>
    {{/step}}
  </div>
  <div class="mt-4 flex flex-wrap gap-2">
    {{#primaryLabel}}<a class="primary-button" href="{{primaryHref}}">{{primaryLabel}}</a>{{/primaryLabel}}
    {{#secondaryLabel}}<a class="quick-button" href="{{secondaryHref}}">{{secondaryLabel}}</a>{{/secondaryLabel}}
  </div>
</section>
{{/onboarding.launch}}
