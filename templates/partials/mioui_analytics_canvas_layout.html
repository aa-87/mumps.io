<section class="panel space-y-4">
  <div>
    <h2 class="text-lg font-semibold text-white">{{layout.analytics.title}}</h2>
    <p class="text-sm text-slate-300">{{layout.analytics.lead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-[1.4fr_1fr]">
    <div class="space-y-3">
      {{#layout.analytics.row}}
      <article class="panel-soft space-y-1">
        <p class="text-sm font-semibold text-white">{{title}}</p>
        <p class="text-xs text-slate-300">{{detail}}</p>
      </article>
      {{/layout.analytics.row}}
    </div>
    <article class="panel-soft">
      <p class="text-sm font-semibold text-white">Formula callback</p>
      <p class="mt-1 text-xs text-slate-300">Persist formula presets so aggregate footer logic and export parity stay synchronized.</p>
      <p class="mt-2 text-xs text-slate-400"><span class="font-mono text-slate-200">{{layout.analytics.callback}}</span></p>
    </article>
  </div>
</section>
