<div class="panel-soft rounded-[1.35rem] p-5" id="report-analytics-heat">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Heatmap</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Denial heatmap</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Reason-by-payer concentration without a client chart engine.</p>
    </div>
    <span class="badge badge-slate">16 cells</span>
  </div>
  <div class="mt-5 overflow-x-auto">
    <table class="min-w-full border-separate border-spacing-2">
      <thead>
        <tr>
          <th class="px-2 py-2 text-left text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Reason</th>
          <th class="px-2 py-2 text-center text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Commercial</th>
          <th class="px-2 py-2 text-center text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Medicare Advantage</th>
          <th class="px-2 py-2 text-center text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Managed Medicaid</th>
          <th class="px-2 py-2 text-center text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Employer Plan</th>
        </tr>
      </thead>
      <tbody>
        {{#billReportViz.heat}}
        <tr>
          <td class="pr-2 align-middle text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</td>
          {{#cell}}
          <td class="min-w-[5.5rem] rounded-2xl border border-slate-300/70 px-2 py-4 text-center dark:border-slate-700/70 {{panelClass}}" style="opacity: {{opacity}};">
            <div class="text-lg font-semibold text-slate-900 dark:text-slate-100">{{value}}</div>
            <div class="mt-1 text-[10px] font-semibold uppercase tracking-[0.14em] text-slate-600 dark:text-slate-400">{{label}}</div>
          </td>
          {{/cell}}
        </tr>
        {{/billReportViz.heat}}
      </tbody>
    </table>
  </div>
</div>
