<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Editor variation</div>
      <h3 class="mt-2 text-lg font-semibold text-white">{{inline.title}}</h3>
      <p class="mt-2 text-sm text-slate-300">{{inline.desc}}</p>
    </div>
    <span class="rounded-full border border-slate-700 bg-slate-950 px-3 py-1 text-xs text-slate-200">{{inline.action.open}}</span>
  </div>
  <div class="mt-4 overflow-hidden rounded-2xl border border-slate-800">
    <table class="min-w-full divide-y divide-slate-800 text-sm">
      <thead class="bg-slate-950/80 text-slate-400">
        <tr>
          <th class="px-3 py-2 text-left font-medium">Code</th>
          <th class="px-3 py-2 text-left font-medium">Field</th>
          <th class="px-3 py-2 text-left font-medium">Before</th>
          <th class="px-3 py-2 text-left font-medium">After</th>
          <th class="px-3 py-2 text-left font-medium">State</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800 bg-slate-950/30 text-slate-200">
        {{#inline.row}}
        <tr>
          <td class="px-3 py-2 font-semibold text-white">{{code}}</td>
          <td class="px-3 py-2">{{field}}</td>
          <td class="px-3 py-2 text-slate-400">{{before}}</td>
          <td class="px-3 py-2">{{after}}</td>
          <td class="px-3 py-2"><span class="rounded-full border border-slate-700 bg-slate-900 px-2 py-1 text-xs">{{state}}</span></td>
        </tr>
        {{/inline.row}}
      </tbody>
    </table>
  </div>
  <div class="mt-4 flex flex-wrap gap-2 text-xs">
    <span class="rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-emerald-200">{{inline.action.save}}</span>
    <span class="rounded-full border border-sky-500/30 bg-sky-500/10 px-3 py-1 text-sky-200">{{inline.action.compare}}</span>
  </div>
</section>
