<div class="panel rounded-[1.45rem] p-5" id="trace-detail">
  <div class="section-kicker">Detail card</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <dl class="mt-4 space-y-3">
    {{#field}}
    <div class="panel-soft rounded-2xl p-4">
      <dt class="stat-label">{{label}}</dt>
      <dd class="mt-2 text-sm font-medium break-all">{{value}}</dd>
    </div>
    {{/field}}
  </dl>
  <div class="mt-4 flex flex-wrap gap-3">
    {{#action}}
    <a href="{{href}}" class="{{class}}">{{label}}</a>
    {{/action}}
  </div>
</div>
