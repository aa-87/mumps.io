<div class="panel-soft rounded-[1.35rem] p-5" id="report-denials-stream">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Reason stream</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">{{billReportDenial.headline}}</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{billReportDenial.subhead}}</p>
    </div>
    <span class="badge badge-rose">4 families</span>
  </div>
  <div class="mt-5 space-y-4">
    {{#billReportDenial.stream}}
    <div class="rounded-[1.15rem] border border-slate-300/70 px-4 py-4 dark:border-slate-700/70 bg-white/80 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{title}}</div>
        <span class="badge {{badgeClass}}">{{title}}</span>
      </div>
      <div class="mt-3 grid gap-2">
        <div>
          <div class="mb-1 flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400"><span>Open</span><span>{{openPercent}}%</span></div>
          <div class="h-2.5 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-2.5 rounded-full bg-rose-700/75 dark:bg-rose-500/75" style="width: {{openPercent}}%;"></div></div>
        </div>
        <div>
          <div class="mb-1 flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400"><span>Appealed</span><span>{{appealPercent}}%</span></div>
          <div class="h-2.5 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-2.5 rounded-full bg-amber-700/75 dark:bg-amber-500/75" style="width: {{appealPercent}}%;"></div></div>
        </div>
        <div>
          <div class="mb-1 flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400"><span>Closed</span><span>{{closedPercent}}%</span></div>
          <div class="h-2.5 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-2.5 rounded-full bg-emerald-700/75 dark:bg-emerald-500/75" style="width: {{closedPercent}}%;"></div></div>
        </div>
      </div>
      <div class="mt-3 text-sm text-slate-700 dark:text-slate-300">{{note}}</div>
    </div>
    {{/billReportDenial.stream}}
  </div>
</div>
