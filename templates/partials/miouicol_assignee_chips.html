<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Assignee chip</p>
      <h2 class="mt-2 text-lg font-semibold">Inline ownership markers</h2>
    </div>
    <span class="badge badge-amber">Queue-friendly</span>
  </div>
  <div class="mt-4 flex flex-wrap gap-2">
    {{#chip}}
    <div class="panel-soft inline-flex items-center gap-3 rounded-full px-3 py-2">
      <div class="flex h-9 w-9 items-center justify-center rounded-2xl text-xs font-bold {{avatarClass}}">{{initials}}</div>
      <div>
        <div class="text-sm font-semibold leading-tight">{{name}}</div>
        <div class="text-xs muted leading-tight">{{role}}</div>
      </div>
      <div class="flex items-center gap-2 text-xs muted">
        <span class="inline-flex h-3 w-3 rounded-full {{stateClass}}"></span>
        <span>{{state}}</span>
      </div>
    </div>
    {{/chip}}
  </div>
</section>
