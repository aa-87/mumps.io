<section class="panel rounded-[1.35rem] p-5 space-y-4">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    <div>
      <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{workspaceLabel}}</label>
      <input class="field w-full" value="{{workspaceValue}}" />
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{roleLabel}}</label>
      <input class="field w-full" value="{{roleValue}}" />
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{emailLabel}}</label>
      <input class="field w-full" value="{{emailValue}}" />
    </div>
    <div>
      <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{expiryLabel}}</label>
      <input class="field w-full" value="{{expiryValue}}" />
    </div>
  </div>
  <div class="flex flex-wrap gap-3">
    <button class="primary-button" data-callback="{{callback}}">{{primaryLabel}}</button>
    <button class="ghost-button">{{secondaryLabel}}</button>
  </div>
</section>
