<div class="panel-soft rounded-[1.35rem] p-5" id="report-forecast-bridge">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Variance bridge</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Projected cash bridge</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Opening expectation, forecast drag, and upside recovery displayed as a compact waterfall-style sequence.</p>
    </div>
    <span class="badge badge-violet">Bridge</span>
  </div>
  <div class="mt-5 space-y-3">
    {{#billReportForecast.bridge}}
    <div class="rounded-[1.15rem] border border-slate-300/70 bg-white/80 px-4 py-4 dark:border-slate-700/70 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
          <div class="mt-1 text-xs text-slate-600 dark:text-slate-400">{{note}}</div>
        </div>
        <div class="text-right">
          <div class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">{{value}}</div>
          <span class="badge {{badgeClass}}">{{direction}}</span>
        </div>
      </div>
      <div class="mt-3 h-3 rounded-full bg-slate-200 dark:bg-slate-800">
        <div class="h-3 rounded-full {{#direction}}bg-sky-700/80 dark:bg-sky-500/80{{/direction}}" style="width: {{percent}}%;"></div>
      </div>
    </div>
    {{/billReportForecast.bridge}}
  </div>
</div>
