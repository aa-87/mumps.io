<section class="grid gap-3 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,.9fr)]">
  <article class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
    <p class="section-kicker">{{heroKicker}}</p>
    <div class="mt-3 grid gap-3 sm:grid-cols-3">
      {{#heroStat}}
      <div class="panel-soft rounded-2xl px-3 py-3">
        <div class="stat-label">{{label}}</div>
        <div class="mt-2 text-2xl font-semibold">{{value}}</div>
      </div>
      {{/heroStat}}
    </div>
  </article>
  <article class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
    <p class="section-kicker">Navigation family</p>
    <div class="mt-3 flex flex-wrap gap-2">
      {{#collabTab}}
      <span class="{{#isActive}}badge badge-sky{{/isActive}}{{^isActive}}badge badge-slate{{/isActive}}">{{label}}</span>
      {{/collabTab}}
    </div>
    <p class="mt-3 text-sm muted">Built as reusable identity primitives first, then extended into chat, activity, and workspaces in later ROIs.</p>
  </article>
</section>
