<section class="panel rounded-[1.35rem] p-5 space-y-5">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>

  <div class="overflow-x-auto rounded-[1.1rem] border border-slate-200 bg-white/70 dark:border-white/10 dark:bg-slate-950/40">
    <table class="min-w-full text-sm">
      <thead class="border-b border-slate-200 bg-slate-50/80 dark:border-white/10 dark:bg-slate-900/70">
        <tr>
          <th class="px-4 py-3 text-left font-semibold text-slate-900 dark:text-white">Capability</th>
          <th class="px-4 py-3 text-left font-semibold text-slate-900 dark:text-white">Patient</th>
          <th class="px-4 py-3 text-left font-semibold text-slate-900 dark:text-white">Biller</th>
          <th class="px-4 py-3 text-left font-semibold text-slate-900 dark:text-white">Manager</th>
        </tr>
      </thead>
      <tbody>
        {{#row}}
        <tr class="border-b border-slate-200 last:border-b-0 dark:border-white/10">
          <td class="px-4 py-3 font-medium text-slate-900 dark:text-white">{{label}}</td>
          <td class="px-4 py-3 text-slate-600 dark:text-slate-300">{{patient}}</td>
          <td class="px-4 py-3 text-slate-600 dark:text-slate-300">{{biller}}</td>
          <td class="px-4 py-3 text-slate-600 dark:text-slate-300">{{manager}}</td>
        </tr>
        {{/row}}
      </tbody>
    </table>
  </div>

  <div class="rounded-[1.1rem] border border-sky-500/20 bg-sky-500/5 p-4 dark:border-sky-400/20 dark:bg-sky-400/10">
    <h3 class="text-sm font-semibold text-slate-900 dark:text-white">{{noteTitle}}</h3>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{noteBody}}</p>
  </div>

  <div class="flex flex-wrap gap-3">
    <button class="primary-button" data-callback="{{callback}}">Open comparison studio</button>
  </div>
</section>
