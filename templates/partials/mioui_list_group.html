<div class="panel rounded-[1.45rem] p-5" id="grouped-evidence">
  <div class="section-kicker">List group</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <div class="mt-4 space-y-4">
    {{#group}}
    <div class="panel-soft rounded-2xl p-4">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-sm font-semibold">{{label}}</div>
          <div class="mt-1 text-sm muted">{{lead}}</div>
        </div>
        <span class="badge {{badgeClass}}">{{label}}</span>
      </div>
      <div class="mt-3 space-y-2">
        {{#row}}
        <div class="flex items-start justify-between gap-4 rounded-xl border border-slate-500/10 px-3 py-2">
          <div>
            <div class="text-sm font-medium">{{title}}</div>
            <div class="mt-1 text-xs muted">{{meta}}</div>
          </div>
          <span class="badge {{badgeClass}}">ready</span>
        </div>
        {{/row}}
      </div>
    </div>
    {{/group}}
  </div>
</div>
