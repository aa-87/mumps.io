<aside class="space-y-4" data-miouicol-chat-side>
  {{#chatSide}}
  <section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5 {{panelClass}}">
    <div class="flex items-center justify-between gap-3">
      <h3 class="text-sm font-semibold">{{title}}</h3>
      <span class="badge {{badgeClass}}">{{label}}</span>
    </div>
    <p class="mt-3 text-sm muted">{{detail}}</p>
  </section>
  {{/chatSide}}
</aside>
