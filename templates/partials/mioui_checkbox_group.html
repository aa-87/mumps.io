<div class="panel rounded-[1.45rem] p-5">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <div class="section-kicker">Field catalog</div>
      <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
      <p class="mt-2 text-sm muted">{{lead}}</p>
    </div>
    <span class="badge badge-sky">{{checkedCount}} selected</span>
  </div>
  <div class="mt-4 space-y-3">
    {{#item}}
    <label class="panel-soft flex items-start justify-between gap-4 rounded-2xl p-4">
      <div>
        <div class="text-sm font-semibold">{{label}}</div>
        <div class="mt-1 text-sm muted">{{help}}</div>
      </div>
      <div class="flex items-center gap-3">
        <input type="checkbox" name="{{name}}" value="1" {{#checked}}checked{{/checked}}>
        {{#checked}}<span class="badge badge-emerald">Selected</span>{{/checked}}
      </div>
    </label>
    {{/item}}
  </div>
</div>
