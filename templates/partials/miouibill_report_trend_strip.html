<div class="panel-soft rounded-[1.35rem] p-4">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Trend strip</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Daily net collections trend</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Six-day readout sized for side-rail scanning.</p>
    </div>
    <span class="badge badge-slate">6 days</span>
  </div>
  <div class="mt-4 grid grid-cols-6 gap-2 items-end h-44">
    {{#billReportDense.trend}}
    <div class="flex h-full flex-col justify-end gap-2">
      <div class="rounded-t-2xl border border-slate-300/70 dark:border-slate-700/70 {{panelClass}}" style="height: {{percent}}%;"></div>
      <div>
        <div class="text-xs font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <div class="text-[11px] text-slate-600 dark:text-slate-400">{{value}}</div>
      </div>
    </div>
    {{/billReportDense.trend}}
  </div>
  <div class="mt-4 space-y-2">
    {{#billReportDense.trend}}
    <div class="flex items-start justify-between gap-3 text-sm">
      <div class="text-slate-700 dark:text-slate-300">{{note}}</div>
      <span class="badge {{badgeClass}}">{{label}}</span>
    </div>
    {{/billReportDense.trend}}
  </div>
</div>
