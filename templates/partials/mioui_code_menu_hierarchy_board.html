<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Nested variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{hier.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{hier.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{hier.action.add}}</div>
      <div>{{hier.action.reorder}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#hier.group}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="font-semibold text-white">{{name}}</div>
      <div class="mt-3 space-y-2">
        {{#item}}
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">
          <div class="text-sm text-slate-100">{{label}}</div>
          <div class="text-xs text-slate-400">{{meta}}</div>
        </div>
        {{/item}}
      </div>
    </div>
    {{/hier.group}}
  </div>
</section>
