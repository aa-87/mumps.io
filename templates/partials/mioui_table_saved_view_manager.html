<div class="space-y-3">
  <div>
    <h3 class="text-lg font-semibold">{{workbench.viewsTitle}}</h3>
    <p class="mt-1 muted">Promote view ownership, exact filter recall, and clear row counts for every saved queue.</p>
  </div>
  <div class="space-y-2">
    {{#workbench.view}}
    <a href="{{href}}" class="panel-soft p-3 rounded-2xl border border-white/10 flex items-start justify-between gap-3 block hover:border-sky-400/50">
      <div>
        <div class="font-medium">{{label}}</div>
        <div class="mt-1 text-sm muted">{{note}}</div>
      </div>
      <div class="text-right">
        <span class="{{badgeClass}}">{{stateLabel}}</span>
        <div class="mt-2 text-sm muted">{{rowCount}}</div>
      </div>
    </a>
    {{/workbench.view}}
  </div>
</div>
