<div class="panel-soft rounded-[1.25rem] p-4">
  <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
    <div>
      <div class="text-sm font-semibold">{{windowLabel}}</div>
      <p class="mt-1 text-sm muted">Page {{page}} of {{lastPage}}</p>
    </div>
    <div class="flex gap-2">
      {{#hasPrev}}<a href="{{prevHref}}" class="quick-button">Previous</a>{{/hasPrev}}
      {{^hasPrev}}<span class="ghost-button opacity-50">Previous</span>{{/hasPrev}}
      {{#hasNext}}<a href="{{nextHref}}" class="primary-button">Next</a>{{/hasNext}}
      {{^hasNext}}<span class="ghost-button opacity-50">Next</span>{{/hasNext}}
    </div>
  </div>
</div>
