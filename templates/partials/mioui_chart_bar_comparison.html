<article class="panel p-5">
  <div class="chart-kicker">Bars</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{bar.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{bar.desc}}</p>
  <div class="mt-5 space-y-4">
    {{#bar.item}}
    <div class="grid items-center gap-3 md:grid-cols-[10rem_1fr_4rem]">
      <div class="text-sm chart-label">{{label}}</div>
      <div class="chart-track h-3 overflow-hidden rounded-full">
        <div class="h-3 rounded-full {{toneClass}}" style="width: {{pct}}%;"></div>
      </div>
      <div class="text-right text-sm font-semibold chart-value">{{value}}</div>
    </div>
    {{/bar.item}}
  </div>
</article>
