<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{focusTitle}}</h2>
    <p class="text-sm text-slate-300">{{focusLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-5 md:grid-cols-2">
    {{#focusPane}}
    <article class="panel-soft space-y-2">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm font-semibold text-white">{{label}}</p>
        <span class="{{badgeClass}}">{{key}}</span>
      </div>
      <p class="text-xs text-slate-300">{{detail}}</p>
    </article>
    {{/focusPane}}
  </div>
  <p class="text-xs text-slate-400">Callback: <code>{{focusCallback}}</code></p>
</section>
