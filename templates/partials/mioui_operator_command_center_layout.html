<section class="panel space-y-4">
  <div>
    <h2 class="text-lg font-semibold text-white">{{layout.command.title}}</h2>
    <p class="text-sm text-slate-300">{{layout.command.lead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-3">
    {{#layout.command.metric}}
    <article class="panel-soft space-y-2">
      <span class="{{badgeClass}}">{{label}}</span>
      <p class="text-2xl font-semibold text-white">{{value}}</p>
    </article>
    {{/layout.command.metric}}
  </div>
  <div class="grid gap-3 lg:grid-cols-[2fr_1fr]">
    {{#layout.command.slot}}
    <article class="panel-soft space-y-1">
      <p class="text-sm font-semibold text-white">{{title}}</p>
      <p class="text-xs text-slate-300">{{detail}}</p>
    </article>
    {{/layout.command.slot}}
  </div>
  <div class="flex flex-wrap gap-2">
    {{#layout.command.action}}
    <button class="quick-button" data-callback="{{callback}}">{{label}}</button>
    {{/layout.command.action}}
  </div>
</section>
