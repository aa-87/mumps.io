<article class="panel p-5">
  <div class="chart-kicker">Waterfall</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{waterfall.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{waterfall.desc}}</p>
  <div class="mt-5 space-y-4">
    {{#waterfall.step}}
    <div class="grid items-center gap-3 md:grid-cols-[10.5rem_1fr_5rem]">
      <div>
        <div class="text-sm font-medium chart-label">{{label}}</div>
        <div class="mt-1 text-[11px] chart-muted">{{detail}}</div>
      </div>
      <div class="chart-waterfall-lane">
        <div class="chart-waterfall-bar {{barClass}}" style="left: {{startPct}}%; width: {{widthPct}}%;"></div>
      </div>
      <div class="text-right text-sm font-semibold {{valueClass}}">{{value}}</div>
    </div>
    {{/waterfall.step}}
  </div>
  <div class="chart-soft mt-5 rounded-2xl p-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="text-xs uppercase tracking-[0.2em] chart-muted">Bridge rule</div>
        <div class="mt-2 text-sm chart-label">{{waterfall.rule}}</div>
      </div>
      <div class="flex flex-wrap gap-2 text-xs">
        <span class="chart-stat-chip">{{waterfall.legendPositive}}</span>
        <span class="chart-stat-chip">{{waterfall.legendNegative}}</span>
        <span class="chart-stat-chip">{{waterfall.legendTotal}}</span>
      </div>
    </div>
  </div>
</article>
