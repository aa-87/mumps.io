<div class="panel-soft rounded-[1.35rem] p-5" id="report-benchmark-ladder">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Benchmark ladder</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">{{billReportBench.headline}}</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{billReportBench.subhead}}</p>
    </div>
    <span class="badge badge-violet">Benchmark</span>
  </div>
  <div class="mt-5 space-y-4">
    {{#billReportBench.ladder}}
    <div class="rounded-[1.15rem] border border-slate-300/70 bg-white/80 px-4 py-4 dark:border-slate-700/70 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
          <div class="mt-1 text-xs text-slate-600 dark:text-slate-400">{{note}}</div>
        </div>
        <span class="badge {{badgeClass}}">Internal {{internal}}</span>
      </div>
      <div class="mt-3 rounded-full bg-slate-200 px-1 py-1 dark:bg-slate-800">
        <div class="relative h-4 rounded-full bg-gradient-to-r from-slate-300 via-sky-300 to-violet-400 dark:from-slate-700 dark:via-sky-600 dark:to-violet-700">
          <div class="absolute left-[50%] top-[-0.35rem] h-6 w-[2px] bg-slate-800 dark:bg-slate-100"></div>
          <div class="absolute left-[80%] top-[-0.35rem] h-6 w-[2px] bg-violet-900 dark:bg-violet-200"></div>
          <div class="absolute top-[-0.42rem] h-6 w-6 -translate-x-1/2 rounded-full border-2 border-white bg-slate-900 shadow-sm dark:border-slate-950 dark:bg-slate-100" style="left: {{position}}%;"></div>
        </div>
      </div>
      <div class="mt-2 flex flex-wrap items-center justify-between gap-3 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">
        <span>Peer median {{median}}</span>
        <span>Top quartile {{topQuartile}}</span>
      </div>
    </div>
    {{/billReportBench.ladder}}
  </div>
</div>
