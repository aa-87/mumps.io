<div class="panel-soft rounded-[1.35rem] p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Horizontal graph</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Payer mix and variance</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Paid volume and variance compressed into a dense payer pulse graph.</p>
    </div>
    <span class="badge badge-slate">5 payers</span>
  </div>
  <div class="mt-5 space-y-4">
    {{#billReportViz.bar}}
    <div>
      <div class="mb-2 flex items-center justify-between gap-3 text-sm">
        <div class="font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <div class="flex items-center gap-2">
          <span class="text-slate-700 dark:text-slate-300">{{value}}</span>
          <span class="badge {{badgeClass}}">{{note}}</span>
        </div>
      </div>
      <div class="h-4 overflow-hidden rounded-full bg-slate-200/80 dark:bg-slate-800/80">
        <div class="h-full rounded-full {{panelClass}}" style="width: {{percent}}%;"></div>
      </div>
    </div>
    {{/billReportViz.bar}}
  </div>
</div>
