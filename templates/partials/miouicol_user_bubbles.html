<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">User bubbles</p>
      <h2 class="mt-2 text-lg font-semibold">Identity, presence, and unread state</h2>
    </div>
    <span class="badge badge-violet">Bubble variants</span>
  </div>
  <div class="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-4">
    {{#bubble}}
    <article class="panel-soft rounded-[1.2rem] px-3 py-3">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}}">{{initials}}</div>
          <div>
            <div class="text-sm font-semibold">{{name}}</div>
            <div class="text-xs muted">{{role}}</div>
          </div>
        </div>
        <span class="mt-1 inline-flex h-3 w-3 rounded-full {{stateClass}}"></span>
      </div>
      <div class="mt-3 flex items-center justify-between gap-2 text-xs">
        <span class="badge {{badgeClass}}">{{state}}</span>
        <span class="muted">{{unread}} unread</span>
      </div>
      <div class="mt-3 text-sm font-medium">{{workspace}}</div>
      <p class="mt-1 text-sm muted">{{detail}}</p>
    </article>
    {{/bubble}}
  </div>
</section>
