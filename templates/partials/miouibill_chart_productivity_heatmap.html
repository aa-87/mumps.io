<div class="panel-soft rounded-[1.35rem] p-5" id="report-productivity-heat">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Queue touch heatmap</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Where the team spent effort this week</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Darker cells show higher touch concentration across the most visible queue families.</p>
    </div>
    <span class="badge badge-violet">16 cells</span>
  </div>
  <div class="mt-5 overflow-x-auto">
    <table class="min-w-full border-separate border-spacing-2">
      <thead>
        <tr>
          <th class="px-2 py-2 text-left text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Queue</th>
          <th class="px-2 py-2 text-left text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Mon</th>
          <th class="px-2 py-2 text-left text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Tue</th>
          <th class="px-2 py-2 text-left text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Wed</th>
          <th class="px-2 py-2 text-left text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Thu</th>
        </tr>
      </thead>
      <tbody>
        {{#billReportProd.heat}}
        <tr>
          <td class="px-2 py-2 text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</td>
          {{#cell}}
          <td class="min-w-[5.25rem] rounded-2xl border border-slate-300/70 px-3 py-3 text-center dark:border-slate-700/70 {{panelClass}}" style="opacity: {{opacity}};">
            <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{label}}</div>
            <div class="mt-1 text-base font-semibold text-slate-900 dark:text-slate-100">{{value}}</div>
          </td>
          {{/cell}}
        </tr>
        {{/billReportProd.heat}}
      </tbody>
    </table>
  </div>
</div>
