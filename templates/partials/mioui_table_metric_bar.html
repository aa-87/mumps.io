<div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
  {{#workbench.metric}}
  <div class="panel-soft p-3 rounded-2xl border border-white/10">
    <div class="text-xs uppercase tracking-wide muted">{{label}}</div>
    <div class="mt-2 text-2xl font-semibold">{{value}}</div>
    <div class="mt-2 flex items-center gap-2">
      <span class="{{badgeClass}}">{{note}}</span>
    </div>
  </div>
  {{/workbench.metric}}
</div>
