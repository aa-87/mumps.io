<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Mini directory</p>
      <h2 class="mt-2 text-lg font-semibold">Identity cards</h2>
    </div>
    <span class="badge badge-rose">Hover-ready</span>
  </div>
  <div class="mt-4 grid gap-3 lg:grid-cols-2 xl:grid-cols-5">
    {{#miniUser}}
    <article class="panel-soft rounded-[1.1rem] px-3 py-3">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}}">{{initials}}</div>
        <div>
          <div class="text-sm font-semibold">{{name}}</div>
          <div class="text-xs muted">{{role}}</div>
        </div>
      </div>
      <p class="mt-3 text-sm muted">{{detail}}</p>
    </article>
    {{/miniUser}}
  </div>
</section>
