<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Connected users</p>
      <h2 class="mt-2 text-lg font-semibold">Current workspace roster</h2>
    </div>
    <span class="badge badge-sky">Dense SSR table</span>
  </div>
  <div class="mt-4 overflow-x-auto">
    <table class="grid-table min-w-full text-sm">
      <thead class="text-left text-xs uppercase tracking-[0.18em] muted">
        <tr>
          <th>User</th>
          <th>Current workspace</th>
          <th>Unread</th>
          <th>Last active</th>
          <th>Workload</th>
          <th>Focus</th>
        </tr>
      </thead>
      <tbody>
        {{#roster}}
        <tr class="border-t border-slate-500/10">
          <td>
            <div class="flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}}">{{initials}}</div>
              <div>
                <div class="font-semibold">{{name}}</div>
                <div class="text-xs muted">{{role}} · {{state}}</div>
              </div>
            </div>
          </td>
          <td>{{workspace}}</td>
          <td>{{unread}}</td>
          <td>{{lastActive}}</td>
          <td>{{load}}</td>
          <td>{{focus}}</td>
        </tr>
        {{/roster}}
      </tbody>
    </table>
  </div>
</section>
