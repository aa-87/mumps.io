<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Extension variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{custom.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{custom.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{custom.action.save}}</div>
      <div>{{custom.action.search}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#custom.field}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="font-semibold text-white">{{name}}</div>
        <div class="text-xs text-slate-400">order {{order}}</div>
      </div>
      <div class="mt-2 grid gap-2 text-xs text-slate-300 sm:grid-cols-3">
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Type: {{type}}</div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Required: {{required}}</div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">List: {{list}}</div>
      </div>
    </div>
    {{/custom.field}}
  </div>
</section>
