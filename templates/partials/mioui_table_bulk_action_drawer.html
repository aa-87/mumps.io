<div class="space-y-3">
  <div>
    <h3 class="text-lg font-semibold">{{workbench.bulk.title}}</h3>
    <p class="mt-1 muted">{{workbench.bulk.lead}}</p>
  </div>
  <div class="panel-soft p-3 rounded-2xl border border-white/10 flex items-center justify-between gap-3">
    <div class="font-medium">{{workbench.bulk.selectedLabel}}</div>
    <span class="badge badge-emerald">Selected scope</span>
  </div>
  <div class="flex flex-wrap gap-2">
    {{#workbench.bulk.action}}
    <a href="{{href}}" data-callback="{{callback}}" class="{{class}}">{{label}}</a>
    {{/workbench.bulk.action}}
  </div>
</div>
