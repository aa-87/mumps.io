<section class="panel rounded-[1.35rem] p-5 space-y-5">
  <div>
    <p class="text-xs uppercase tracking-[0.2em] text-sky-700 dark:text-slate-400">{{eyebrow}}</p>
    <h2 class="text-xl font-semibold text-slate-900 dark:text-white">{{title}}</h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</p>
  </div>
  <div class="space-y-3 rounded-[1.1rem] border border-slate-200 bg-slate-50/80 p-4 dark:border-white/10 dark:bg-slate-950/40">
    {{#signal}}
    <div class="flex items-start justify-between gap-3 text-sm">
      <div class="text-slate-500 dark:text-slate-400">{{label}}</div>
      <div class="text-right font-medium text-slate-900 dark:text-white">{{value}}</div>
    </div>
    {{/signal}}
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    {{#field}}
    <div>
      <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{label}}</label>
      <input class="field w-full" value="{{value}}" />
    </div>
    {{/field}}
  </div>
  <div class="flex flex-wrap gap-3">
    <button class="primary-button" data-callback="{{callback}}">{{primaryLabel}}</button>
    <button class="ghost-button" data-callback="{{secondaryCallback}}">{{secondaryLabel}}</button>
  </div>
</section>
