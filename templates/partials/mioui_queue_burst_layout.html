<section class="panel space-y-3">
  <div>
    <p class="section-kicker">Queue burst layout</p>
    <h2 class="text-lg font-semibold text-white">{{burstTitle}}</h2>
    <p class="text-sm text-slate-300">{{burstLead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-3 text-sm text-slate-300">
    {{#burst}}
    <article class="rounded-xl border border-slate-800 bg-slate-950/70 p-4 space-y-2">
      <div class="font-medium text-white">{{label}}</div>
      <div>{{detail}}</div>
      <div class="text-xs text-amber-300">{{callback}}</div>
    </article>
    {{/burst}}
  </div>
</section>
