<div class="panel rounded-[1.45rem] p-5" id="column-chooser">
  <div class="section-kicker">Column chooser</div>
  <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
  <p class="mt-2 text-sm muted">{{lead}}</p>
  <div class="mt-4 space-y-3">
    {{#item}}
    <div class="panel-soft rounded-2xl p-4 flex items-start justify-between gap-4">
      <div>
        <div class="text-sm font-semibold">{{label}}</div>
        <div class="mt-1 text-xs muted">{{help}}</div>
      </div>
      <span class="badge {{badgeClass}}">{{stateLabel}}</span>
    </div>
    {{/item}}
  </div>
  <div class="mt-4 text-xs muted">{{summary}}</div>
</div>
