<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Bulk variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{import.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{import.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{import.action.import}}</div>
      <div>{{import.action.validate}}</div>
      <div>{{import.action.commit}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#import.batch}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="font-semibold text-white">{{name}}</div>
        <div class="text-xs text-slate-300">{{state}}</div>
      </div>
      <div class="mt-3 grid gap-2 text-xs text-slate-300 sm:grid-cols-2">
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Rows: {{rows}}</div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">{{issues}}</div>
      </div>
    </div>
    {{/import.batch}}
  </div>
</section>
