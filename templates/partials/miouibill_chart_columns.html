<div class="panel-soft rounded-[1.35rem] p-5" id="report-analytics-trend">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Column graph</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Daily collections rhythm</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Seven-day posted-cash pattern sized for quick weekday comparison.</p>
    </div>
    <span class="badge badge-slate">7 bars</span>
  </div>
  <div class="mt-5 grid h-56 grid-cols-7 items-end gap-3">
    {{#billReportViz.column}}
    <div class="flex h-full flex-col justify-end gap-2">
      <div class="rounded-t-2xl border border-slate-300/70 dark:border-slate-700/70 {{panelClass}}" style="height: {{percent}}%;"></div>
      <div>
        <div class="text-xs font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <div class="text-[11px] text-slate-600 dark:text-slate-400">{{value}}</div>
      </div>
    </div>
    {{/billReportViz.column}}
  </div>
  <div class="mt-4 grid gap-2 md:grid-cols-2 xl:grid-cols-3">
    {{#billReportViz.column}}
    <div class="rounded-2xl border border-slate-300/70 px-3 py-3 dark:border-slate-700/70 bg-white/70 dark:bg-slate-950/35">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <span class="badge {{badgeClass}}">{{percent}}%</span>
      </div>
      <div class="mt-2 text-sm text-slate-700 dark:text-slate-300">{{note}}</div>
    </div>
    {{/billReportViz.column}}
  </div>
</div>
