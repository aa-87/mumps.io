 <div class="panel-soft rounded-[1.35rem] p-4 {{panelClass}}">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{{title}}}</h3>
      <p class="mt-1 text-xs text-slate-700 dark:text-slate-300">{{{summary}}}</p>
    </div>
    <span class="badge {{badgeClass}}">{{{title}}}</span>
  </div>
  <dl class="mt-4 space-y-3">
    {{#item}}
    <div class="grid gap-1 sm:grid-cols-[11rem_minmax(0,1fr)] sm:items-start">
      <dt class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{{label}}}</dt>
      <dd class="text-sm text-slate-900 dark:text-slate-100 break-words">{{{value}}}</dd>
    </div>
    {{/item}}
  </dl>
</div>
