<div class="panel-soft rounded-[1.35rem] p-4" id="report-dense-queues">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Queue board</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Recovery lanes</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Open queues ranked by dollars and response window.</p>
    </div>
    <span class="badge badge-slate">4 lanes</span>
  </div>
  <div class="mt-4 space-y-3">
    {{#billReportDense.queue}}
    <div class="rounded-2xl border border-slate-300/70 px-3 py-3 dark:border-slate-700/70 {{panelClass}}">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="font-semibold text-slate-900 dark:text-slate-100">{{title}}</div>
          <div class="mt-1 text-xs font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{owner}}</div>
        </div>
        <span class="badge {{badgeClass}}">{{open}}</span>
      </div>
      <div class="mt-3 grid gap-2 sm:grid-cols-2 text-sm text-slate-700 dark:text-slate-300">
        <div>
          <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">At risk</div>
          <div class="mt-1 font-semibold text-slate-900 dark:text-slate-100">{{amount}}</div>
        </div>
        <div>
          <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">SLA</div>
          <div class="mt-1 font-semibold text-slate-900 dark:text-slate-100">{{sla}}</div>
        </div>
      </div>
      <p class="mt-3 text-sm text-slate-700 dark:text-slate-300">{{note}}</p>
    </div>
    {{/billReportDense.queue}}
  </div>
</div>
