<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Governance variation</div>
      <h3 class="mt-2 text-lg font-semibold text-white">{{compare.title}}</h3>
      <p class="mt-2 text-sm text-slate-300">{{compare.desc}}</p>
    </div>
    <span class="rounded-full border border-slate-700 bg-slate-950 px-3 py-1 text-xs text-slate-200">{{compare.action.compare}}</span>
  </div>
  <div class="mt-4 space-y-3">
    {{#compare.row}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/40 p-4">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-sm font-semibold text-white">{{code}}</div>
          <div class="mt-1 text-xs text-slate-400">Current</div>
          <div class="text-sm text-slate-300">{{current}}</div>
        </div>
        <div class="text-right">
          <div class="text-xs text-slate-400">Incoming</div>
          <div class="text-sm text-slate-200">{{incoming}}</div>
          <div class="mt-2 inline-flex rounded-full border border-slate-700 bg-slate-900 px-2 py-1 text-[11px] text-slate-200">{{decision}}</div>
        </div>
      </div>
    </div>
    {{/compare.row}}
  </div>
  <div class="mt-4 flex flex-wrap gap-2 text-xs">
    <span class="rounded-full border border-amber-500/30 bg-amber-500/10 px-3 py-1 text-amber-200">{{compare.action.merge}}</span>
    <span class="rounded-full border border-violet-500/30 bg-violet-500/10 px-3 py-1 text-violet-200">{{compare.action.submit}}</span>
  </div>
</section>
