<div class="panel rounded-[1.45rem] p-5 {{panelClass}}" id="publish-confirm">
  <div class="flex items-start justify-between gap-4">
    <div>
      <div class="section-kicker">Confirm action</div>
      <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
      <p class="mt-2 text-sm muted">{{body}}</p>
    </div>
    <span class="badge {{badgeClass}}">Review</span>
  </div>
  <div class="mt-5 flex flex-wrap gap-2">
    <a class="danger-button" href="{{confirmHref}}">{{confirmLabel}}</a>
    <a class="quick-button" href="{{cancelHref}}">{{cancelLabel}}</a>
  </div>
</div>
