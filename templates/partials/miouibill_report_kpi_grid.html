<div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3" id="report-kpis-grid">
  {{#billReport.kpi}}
  <div class="panel rounded-[1.35rem] p-4 {{panelClass}}">
    <div class="flex items-start justify-between gap-3">
      <div>
        <div class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{label}}</div>
        <div class="mt-2 text-2xl font-semibold tracking-tight text-slate-900 dark:text-slate-100">{{value}}</div>
      </div>
      <span class="badge {{badgeClass}}">{{delta}}</span>
    </div>
    <p class="mt-3 text-sm leading-6 text-slate-700 dark:text-slate-300">{{note}}</p>
  </div>
  {{/billReport.kpi}}
</div>
