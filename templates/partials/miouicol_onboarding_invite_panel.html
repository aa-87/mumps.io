<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Invite preview</p>
      <h2 class="mt-2 text-lg font-semibold">Seat assignments and presence</h2>
    </div>
    <span class="badge badge-emerald">Invite seats</span>
  </div>
  <div class="mt-4 space-y-2">
    {{#inviteMember}}
    <article class="panel-soft flex items-start justify-between gap-3 rounded-[1.15rem] px-3 py-3">
      <div class="flex items-start gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl text-sm font-bold {{avatarClass}}">{{initials}}</div>
        <div>
          <div class="text-sm font-semibold">{{name}}</div>
          <div class="text-xs muted">{{role}}</div>
          <div class="mt-1 text-xs muted">{{detail}}</div>
        </div>
      </div>
      <div class="text-right">
        <span class="badge {{badgeClass}}">{{seat}}</span>
        <div class="mt-2 flex items-center justify-end gap-2 text-xs">
          <span class="inline-flex h-3 w-3 rounded-full {{stateClass}}"></span>
          <span class="muted">{{state}}</span>
        </div>
      </div>
    </article>
    {{/inviteMember}}
  </div>
</section>
