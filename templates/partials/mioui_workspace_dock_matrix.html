<section class="panel space-y-3">
  <div>
    <p class="section-kicker">Workspace dock matrix</p>
    <p class="text-sm text-slate-300">{{dockLead}}</p>
  </div>
  <div class="grid gap-3 md:grid-cols-2">
    {{#dock}}
    <article class="panel-soft">
      <div class="flex items-center justify-between gap-3">
        <h3 class="font-medium text-white">{{label}}</h3>
        <span class="badge-sky">{{position}}</span>
      </div>
      <p class="mt-2 text-sm text-slate-300">{{detail}}</p>
      <p class="mt-2 text-xs text-sky-300">{{callback}}</p>
    </article>
    {{/dock}}
  </div>
</section>
