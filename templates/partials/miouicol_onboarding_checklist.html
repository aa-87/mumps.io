<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Checklist</p>
      <h2 class="mt-2 text-lg font-semibold">Launch readiness</h2>
    </div>
    <span class="badge badge-amber">First actions</span>
  </div>
  <div class="mt-4 space-y-2">
    {{#checkItem}}
    <article class="panel-soft rounded-[1.15rem] px-3 py-3">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-sm font-semibold">{{label}}</div>
          <div class="mt-1 text-xs muted">Owner: {{owner}} · Due: {{due}}</div>
        </div>
        <span class="badge {{badgeClass}}">{{state}}</span>
      </div>
    </article>
    {{/checkItem}}
  </div>
</section>
