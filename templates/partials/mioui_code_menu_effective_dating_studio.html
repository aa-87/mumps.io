<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Versioning variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{effective.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{effective.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{effective.action.schedule}}</div>
      <div>{{effective.action.publish}}</div>
      <div>{{effective.action.archive}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#effective.row}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="font-semibold text-white">{{code}} <span class="text-slate-400">{{version}}</span></div>
        <div class="text-xs text-slate-300">{{state}}</div>
      </div>
      <div class="mt-2 text-xs text-slate-400">{{window}}</div>
    </div>
    {{/effective.row}}
  </div>
</section>
