<article class="panel p-5">
  <div class="chart-kicker">Funnel</div>
  <h2 class="mt-2 text-lg font-semibold chart-title">{{funnel.title}}</h2>
  <p class="mt-2 text-sm chart-copy">{{funnel.desc}}</p>
  <div class="mt-5 space-y-3">
    {{#funnel.stage}}
    <div class="chart-stage-card rounded-2xl p-3">
      <div class="mb-2 flex items-center justify-between text-sm"><span class="chart-label">{{label}}</span><span class="font-semibold chart-value">{{value}}</span></div>
      <div class="mx-auto h-10 rounded-xl {{toneClass}}" style="width: {{pct}}%;"></div>
    </div>
    {{/funnel.stage}}
  </div>
</article>
