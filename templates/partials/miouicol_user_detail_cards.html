<section class="grid gap-3 xl:grid-cols-3">
  {{#detailCard}}
  <article class="panel {{panelClass}} rounded-[1.35rem] px-4 py-4">
    <div class="flex items-center justify-between gap-3">
      <div>
        <div class="text-sm font-semibold">{{name}}</div>
        <div class="text-xs muted">{{role}}</div>
      </div>
      <span class="badge {{badgeClass}}">{{state}}</span>
    </div>
    <div class="mt-4">
      <div class="text-sm font-semibold">{{title}}</div>
      <div class="mt-1 text-sm muted">{{subject}}</div>
      <p class="mt-3 text-sm">{{detail}}</p>
      <p class="mt-2 text-xs muted">{{help}}</p>
    </div>
  </article>
  {{/detailCard}}
</section>
