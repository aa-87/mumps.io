<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5" data-miouicol-chat-header>
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="section-kicker">{{chatVariantLabel}} chat workspace</p>
      <h2 class="mt-2 text-lg font-semibold">{{chatHeader.title}}</h2>
      <p class="mt-1 text-sm muted">{{chatHeader.subtitle}}</p>
    </div>
    <div class="flex flex-wrap items-center gap-2 text-xs">
      <span class="badge {{chatHeader.badgeClass}}">{{chatHeader.queue}}</span>
      <span class="badge badge-slate">{{chatHeader.status}}</span>
    </div>
  </div>
  <div class="mt-4 flex flex-wrap items-center gap-2">
    {{#participant}}
    <div class="panel-soft flex items-center gap-2 rounded-2xl px-3 py-2 text-sm">
      <div class="flex h-9 w-9 items-center justify-center rounded-2xl text-xs font-bold {{avatarClass}}">{{initials}}</div>
      <div>
        <div class="font-semibold leading-none">{{name}}</div>
        <div class="mt-1 flex items-center gap-2 text-[11px] muted">
          <span class="inline-flex h-2.5 w-2.5 rounded-full {{stateClass}}"></span>
          <span>{{role}}</span>
        </div>
      </div>
    </div>
    {{/participant}}
  </div>
  <p class="mt-4 text-sm muted">{{chatHeader.helper}}</p>
</section>
