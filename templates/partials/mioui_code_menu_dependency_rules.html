<section class="panel p-5">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Rule variation</div>
      <h2 class="mt-2 text-lg font-semibold text-white">{{depend.title}}</h2>
      <p class="mt-2 text-sm text-slate-300">{{depend.desc}}</p>
    </div>
    <div class="space-y-2 text-right text-xs text-slate-300">
      <div>{{depend.action.save}}</div>
      <div>{{depend.action.preview}}</div>
    </div>
  </div>
  <div class="mt-4 space-y-3">
    {{#depend.rule}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="font-semibold text-white">{{name}}</div>
      <div class="mt-3 space-y-2 text-xs text-slate-300">
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">If: {{if}}</div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Then: {{then}}</div>
      </div>
    </div>
    {{/depend.rule}}
  </div>
</section>
