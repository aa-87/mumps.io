<section class="panel p-5">
  <div class="text-xs uppercase tracking-[0.22em] text-slate-400">Coverage matrix</div>
  <h2 class="mt-2 text-lg font-semibold text-white">{{matrix.title}}</h2>
  <div class="mt-4 space-y-3">
    {{#matrix.row}}
    <div class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4">
      <div class="flex items-center justify-between gap-3">
        <div class="font-semibold text-white">{{label}}</div>
        <div class="text-xs text-slate-400">CRUD: {{crud}}</div>
      </div>
      <div class="mt-3 grid gap-2 sm:grid-cols-3 text-xs text-slate-300">
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Search: {{search}}</div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Order: {{order}}</div>
        <div class="rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2">Custom fields: {{custom}}</div>
      </div>
    </div>
    {{/matrix.row}}
  </div>
</section>
