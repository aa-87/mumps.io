{{#hasFilterPanel}}
<div class="panel-soft rounded-2xl p-4">
  <div class="section-kicker">{{filters.title}}</div>
  <div class="mt-2 text-sm muted">{{filters.lead}}</div>
  {{#hasFilters}}
  <div class="mt-4 flex flex-wrap gap-2">
    {{#filter}}
    <span class="{{#isActive}}badge badge-sky{{/isActive}}{{^isActive}}badge badge-slate{{/isActive}}">{{label}}</span>
    {{/filter}}
  </div>
  {{/hasFilters}}
</div>
{{/hasFilterPanel}}
