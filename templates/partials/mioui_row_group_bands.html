<section class="panel space-y-4">
  <div>
    <div class="section-kicker">Grouped review</div>
    <h3 class="text-lg font-semibold">{{groupTitle}}</h3>
    <p class="text-sm text-slate-300">{{groupLead}}</p>
  </div>
  <div class="space-y-4">
    {{#mxGroup}}
    <div class="rounded-2xl border border-slate-700/80 overflow-hidden">
      <div class="flex items-center justify-between gap-3 bg-slate-900/70 px-4 py-3">
        <div>
          <div class="text-sm font-semibold text-slate-100">{{label}}</div>
          <div class="text-xs text-slate-400">Grouped rows · {{count}}</div>
        </div>
        <div class="badge badge-emerald">{{total}}</div>
      </div>
      <div class="divide-y divide-slate-800/80">
        {{#row}}
        <div class="grid gap-2 px-4 py-3 text-sm md:grid-cols-4">
          <div class="font-medium text-slate-100">{{claim}}</div>
          <div class="text-slate-300">{{code}}</div>
          <div class="text-slate-300">{{owner}}</div>
          <div class="text-right text-slate-100">{{charge}}</div>
        </div>
        {{/row}}
      </div>
    </div>
    {{/mxGroup}}
  </div>
</section>
