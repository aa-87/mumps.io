<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5">
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">Online now</p>
      <h2 class="mt-2 text-lg font-semibold">Presence groups</h2>
    </div>
    <span class="badge badge-slate">Operator view</span>
  </div>
  <div class="mt-4 grid gap-3 md:grid-cols-3">
    {{#presenceGroup}}
    <article class="panel-soft rounded-2xl px-3 py-3">
      <span class="badge {{badgeClass}}">{{label}}</span>
      <p class="mt-3 text-sm muted">{{detail}}</p>
    </article>
    {{/presenceGroup}}
  </div>
</section>
