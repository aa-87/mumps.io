<header class="panel rounded-[1.55rem] px-4 py-4 lg:px-5">
  <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
    <div>
      <div class="section-kicker">{{page.eyebrow}}</div>
      <h1 class="mt-2 text-2xl font-semibold tracking-tight lg:text-3xl">{{page.heading}}</h1>
      <p class="mt-2 max-w-3xl text-sm muted lg:text-base">{{page.lead}}</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="badge badge-slate">{{theme.densityLabel}}</span>
      <button type="button" id="themeToggle" class="quick-button">{{theme.toggleLabel}}</button>
    </div>
  </div>
</header>
