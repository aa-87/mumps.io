<section class="panel rounded-[1.45rem] px-4 py-4 lg:px-5" data-miouicol-chat-composer>
  <div class="flex items-center justify-between gap-3">
    <div>
      <p class="section-kicker">{{composer.helper}}</p>
      <h3 class="mt-2 text-lg font-semibold">{{composer.placeholder}}</h3>
    </div>
    <span class="badge badge-slate">SSR-first</span>
  </div>
  <div class="mt-4 rounded-[1.2rem] border border-slate-500/10 bg-slate-50/80 px-4 py-4 text-sm text-slate-700 dark:bg-slate-500/5 dark:text-slate-200">{{composer.placeholder}}</div>
  <div class="mt-4 flex flex-wrap gap-2">
    {{#composerAction}}
    <span class="quick-button">{{label}}</span>
    {{/composerAction}}
  </div>
  <p class="mt-3 text-sm muted">{{composer.secondary}}</p>
</section>
