<div class="rounded-2xl border border-slate-200 bg-white/70 p-4 space-y-3 dark:border-white/10 dark:bg-slate-950/40">
  <div>
    <div class="text-sm font-medium text-slate-900 dark:text-white">{{title}}</div>
    <div class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{subtitle}}</div>
  </div>
  <div>
    <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{identityLabel}}</label>
    <input class="field w-full" value="{{identityValue}}" />
  </div>
  <div>
    <label class="mb-1 block text-sm text-slate-700 dark:text-slate-200">{{passwordLabel}}</label>
    <input class="field w-full" type="password" value="{{passwordValue}}" />
  </div>
  <div class="flex items-center justify-between gap-3 text-xs text-slate-500 dark:text-slate-400">
    <span>{{rememberLabel}}</span>
    <span>{{supportLabel}}</span>
  </div>
  <button class="primary-button" data-callback="{{callback}}">{{primaryLabel}}</button>
</div>
