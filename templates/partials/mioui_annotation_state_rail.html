<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{annotTitle}}</h2>
    <p class="text-sm text-slate-300">{{annotLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-2">
    {{#annotation}}
    <article class="panel-soft space-y-1">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm font-semibold text-white">{{label}}</p>
        <span class="badge badge-sky">{{pane}}</span>
      </div>
      <p class="text-xs text-slate-300">{{anchor}}</p>
      <code class="text-[11px] text-sky-300">{{callback}}</code>
    </article>
    {{/annotation}}
  </div>
</section>
