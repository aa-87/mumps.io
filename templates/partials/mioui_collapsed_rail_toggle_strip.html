<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{railTitle}}</h2>
    <p class="text-sm text-slate-300">{{railLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-3">
    {{#rail}}
    <article class="panel-soft flex items-center justify-between gap-3">
      <div>
        <p class="text-sm font-semibold text-white">{{label}}</p>
        <p class="text-xs text-slate-300">{{state}}</p>
      </div>
      <code class="text-[11px] text-slate-400">{{callback}}</code>
    </article>
    {{/rail}}
  </div>
  <p class="text-xs text-slate-400">Hot callback: <code>{{railCallback}}</code></p>
</section>
