<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{roleTitle}}</h2>
    <p class="text-sm text-slate-300">{{roleLead}}</p>
  </div>
  <div class="grid gap-3 lg:grid-cols-2 xl:grid-cols-4">
    {{#roleDefault}}
    <article class="panel-soft space-y-2">
      <div class="flex items-center justify-between">
        <p class="text-sm font-semibold text-white">{{role}}</p>
        <span class="badge">Default</span>
      </div>
      <p class="text-xs text-slate-300">{{layout}}</p>
      <p class="text-[11px] text-slate-400">{{detail}}</p>
      <code class="text-[11px] text-sky-300">{{callback}}</code>
    </article>
    {{/roleDefault}}
  </div>
</section>
