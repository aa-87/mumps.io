<section class="panel space-y-3">
  <div>
    <h2 class="text-lg font-semibold text-white">{{transitionTitle}}</h2>
    <p class="text-sm text-slate-300">{{transitionLead}}</p>
  </div>
  <div class="flex flex-wrap gap-2">
    {{#transition}}<button class="{{class}}" data-callback="{{callback}}">{{label}}</button>{{/transition}}
  </div>
  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
    {{#transition}}
    <article class="rounded-2xl border border-slate-800 bg-slate-950/60 p-4 text-sm text-slate-300">
      <div class="font-medium text-white">{{label}}</div>
      <div class="mt-1">{{detail}}</div>
      <div class="mt-2 text-xs text-sky-300">{{callback}}</div>
    </article>
    {{/transition}}
  </div>
</section>
