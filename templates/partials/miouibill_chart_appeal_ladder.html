<div class="panel-soft rounded-[1.35rem] p-5" id="report-denials-ladder">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Appeal ladder</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Appeal aging ladder</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">How long denials are waiting in appeal posture before final resolution or escalation.</p>
    </div>
    <span class="badge badge-violet">5 ranges</span>
  </div>
  <div class="mt-5 space-y-4">
    {{#billReportDenial.ladder}}
    <div class="rounded-[1.15rem] border border-slate-300/70 px-4 py-4 dark:border-slate-700/70 bg-white/80 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
          <div class="mt-1 text-xs text-slate-600 dark:text-slate-400">{{note}}</div>
        </div>
        <span class="badge {{badgeClass}}">{{value}}</span>
      </div>
      <div class="mt-3 h-2.5 rounded-full bg-slate-200 dark:bg-slate-800">
        <div class="h-2.5 rounded-full bg-violet-700/75 dark:bg-violet-500/75" style="width: {{percent}}%;"></div>
      </div>
    </div>
    {{/billReportDenial.ladder}}
  </div>
</div>
