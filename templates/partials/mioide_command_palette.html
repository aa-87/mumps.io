<div id="paletteOverlay" class="palette-overlay" aria-hidden="true">
  <div class="palette-shell">
    <div class="surface-soft rounded-[1rem] p-4">
      <div class="flex items-center justify-between gap-3">
        <div>
          <div class="section-label">Command Palette</div>
          <div class="mt-1 text-sm muted">{{commandPlaceholder}}</div>
        </div>
        <button type="button" class="icon-btn" id="closePalette" title="Close command palette" aria-label="Close command palette">Esc</button>
      </div>
      <div class="mt-3">
        <input id="paletteFilter" class="field-lite" placeholder="{{commandPlaceholder}}">
      </div>
      <div class="mt-3 space-y-2 scroll-vscode palette-list" id="paletteList">
        {{#palette}}
        <button type="button" class="palette-item" data-palette-command="{{id}}">
          <span class="text-sm font-semibold">{{label}}</span>
          <span class="badge">{{hint}}</span>
        </button>
        {{/palette}}
      </div>
    </div>
  </div>
</div>
