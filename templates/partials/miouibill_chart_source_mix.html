<div class="panel-soft rounded-[1.35rem] p-5" id="report-cashflow-mix">
  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="section-kicker">Source mix</div>
      <h3 class="mt-2 text-base font-semibold text-slate-900 dark:text-slate-100">Cash source mix</h3>
      <p class="mt-2 text-sm text-slate-700 dark:text-slate-300">Where posted cash is landing this week across automated, manual, and recovery pathways.</p>
    </div>
    <span class="badge badge-sky">4 lanes</span>
  </div>
  <div class="mt-5 space-y-4">
    {{#billReportCash.mix}}
    <div class="rounded-[1.15rem] border border-slate-300/70 px-4 py-4 dark:border-slate-700/70 bg-white/80 dark:bg-slate-950/40 {{panelClass}}">
      <div class="flex items-center justify-between gap-3">
        <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{label}}</div>
        <span class="badge {{badgeClass}}">{{value}}</span>
      </div>
      <div class="mt-3 h-3 rounded-full bg-slate-200 dark:bg-slate-800">
        <div class="h-3 rounded-full bg-slate-800/80 dark:bg-slate-100/80" style="width: {{percent}}%;"></div>
      </div>
      <div class="mt-2 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">{{percent}}% of posted cash</div>
    </div>
    {{/billReportCash.mix}}
  </div>
</div>
