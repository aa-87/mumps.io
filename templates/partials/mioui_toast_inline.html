<div class="panel rounded-[1.45rem] p-5 {{panelClass}}" id="toast-inline">
  <div class="flex items-start justify-between gap-4">
    <div>
      <div class="section-kicker">Inline toast</div>
      <h2 class="mt-2 text-lg font-semibold">{{title}}</h2>
      <p class="mt-2 text-sm muted">{{body}}</p>
    </div>
    {{#dismissible}}<span class="{{badgeClass}}">Dismissible</span>{{/dismissible}}
  </div>
</div>
