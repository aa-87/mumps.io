<section class="panel p-6">
  <div class="text-xs uppercase tracking-[0.24em] text-slate-400">Login</div>
  <h2 class="mt-2 text-xl font-semibold text-white">{{login.title}}</h2>
  <p class="mt-2 text-sm text-slate-300">{{login.subtitle}}</p>
  <div class="mt-4 grid gap-4">
    <label class="grid gap-1">
      <span class="text-xs text-slate-400">Email</span>
      <input class="field" value="{{login.email}}" />
    </label>
    <label class="grid gap-1">
      <span class="text-xs text-slate-400">Password</span>
      <input class="field" type="password" value="hunter2-hardened" />
    </label>
    <label class="inline-flex items-center gap-2 text-sm text-slate-300"><input type="checkbox" checked /> Remember this device</label>
    <div class="inline-flex items-center rounded-xl bg-sky-500/15 px-3 py-2 text-xs text-sky-200">{{login.callback}}</div>
  </div>
</section>
