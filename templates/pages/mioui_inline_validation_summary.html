<section class="panel p-6">
  <div class="text-xs uppercase tracking-[0.24em] text-slate-400">Validation</div>
  <h2 class="mt-2 text-xl font-semibold text-white">{{validation.title}}</h2>
  <div class="mt-4 space-y-3">
    {{#validation.issue}}
    <div class="rounded-2xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-100">{{.}}</div>
    {{/validation.issue}}
    <div class="inline-flex items-center rounded-xl bg-rose-500/15 px-3 py-2 text-xs text-rose-200">{{validation.callback}}</div>
  </div>
</section>
