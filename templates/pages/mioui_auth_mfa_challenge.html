<section class="panel p-6">
  <div class="text-xs uppercase tracking-[0.24em] text-slate-400">Verification</div>
  <h2 class="mt-2 text-xl font-semibold text-white">{{mfa.title}}</h2>
  <p class="mt-2 text-sm text-slate-300">Verification code</p>
  <div class="mt-4 grid gap-3 sm:grid-cols-6">
    <input class="field text-center" value="4" /><input class="field text-center" value="2" /><input class="field text-center" value="1" /><input class="field text-center" value="8" /><input class="field text-center" value="7" /><input class="field text-center" value="3" />
  </div>
  <div class="mt-4 inline-flex items-center rounded-xl bg-rose-500/15 px-3 py-2 text-xs text-rose-200">{{mfa.callback}}</div>
</section>
