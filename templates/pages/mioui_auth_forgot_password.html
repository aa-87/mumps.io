<section class="panel p-6">
  <div class="text-xs uppercase tracking-[0.24em] text-slate-400">Recovery</div>
  <h2 class="mt-2 text-xl font-semibold text-white">{{forgot.title}}</h2>
  <p class="mt-2 text-sm text-slate-300">Send a secure reset link without leaving the operator shell.</p>
  <div class="mt-4 grid gap-3">
    <input class="field" value="operator@efuzy.local" />
    <div class="inline-flex items-center rounded-xl bg-amber-500/15 px-3 py-2 text-xs text-amber-200">{{forgot.callback}}</div>
  </div>
</section>
