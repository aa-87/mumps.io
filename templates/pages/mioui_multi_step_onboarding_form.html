<section class="panel p-6">
  <div class="text-xs uppercase tracking-[0.24em] text-slate-400">Onboarding</div>
  <h2 class="mt-2 text-xl font-semibold text-white">{{onboard.title}}</h2>
  <div class="mt-4 grid gap-3">
    {{#onboard.step}}
    <div class="rounded-2xl border border-slate-700 bg-slate-900/50 p-4">
      <div class="text-sm font-semibold text-white">{{title}}</div>
    </div>
    {{/onboard.step}}
    <div class="inline-flex items-center rounded-xl bg-emerald-500/15 px-3 py-2 text-xs text-emerald-200">{{onboard.callback}}</div>
  </div>
</section>
