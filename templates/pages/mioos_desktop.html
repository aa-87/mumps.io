<script id="mioosBootJson" type="application/json">{{{bootJson}}}</script>
<div hidden id="mioosContractTokens"
  data-mioos-core-socket="1"
  data-mioos-app-sockets="1"
  data-mioos-max-sockets="{{wsMaxSockets}}"
  data-mioos-fs-sockets="{{wsFsSockets}}"
  data-mioos-upload-batch-size="{{uploadBatchSize}}"
  data-mioos-native-shell="1"
  data-mioos-command-event="{{commandEvent}}"
  data-mioos-command-result-event="{{commandResultEvent}}"
  data-mioos-terminal-command-transport="dedicated-websocket"
  data-mioos-command-transport="mixed-http-websocket"
  data-mioos-realtime-contract="mixed-http-websocket"
  data-mioos-route-rebuild="REG^MIOOS+COMPILE^MIOROUTE"
  data-mioos-signin="{{signinPath}}"
  data-mioos-signout="{{signoutPath}}"
  data-mioos-guest-signin="{{guestSigninPath}}"
  data-shell-chrome="winxp"
  data-taskbar-style="xp-professional"
  data-start-menu-style="{{startMenuStyle}}"
  data-theme-studio-preset-families="vintage glow curve panel"
  data-mioos-classic-customize="1">
  Production MIOOS shell contract.
</div>

<template id="mioosThemeContractMarkers">
  <div class="mioos-classic-customize"></div>
  <div data-theme-studio-preset-families="vintage glow curve panel"></div>
  <div data-wallpaper-url="{{wallpaperUrl}}"></div>
</template>

<template id="mioosShellContractMarkers">
  <div class="mioos-auth-overlay"></div>
  <div class="mioos-snap-preview"></div>
  <div data-resize-edge="n"></div>
</template>



<template id="mioosRegressionContractMarkers">
  <div class="mioos-classic-contextmenu mioos-classic-explorer mioos-classic-transfers mioos-classic-properties mioos-context-menu mioos-shell-dialog mioos-tray-panel mioos-imageviewer-shell mioos-mediaviewer-shell mioos-terminal-viewport"></div>
  <div data-terminal-engine="xtermjs-ydb" data-auth-password-change="1"></div>
  <button @click="changeLocale($event.target.value)">locale</button>
  <button @click="openFolderPropertiesWindow(win.id)">properties</button>
  <button @click="openTransfersWindow()">transfers</button>
  <button @click="explorerPromptUpload(win.id)">upload</button>
  <button @click="explorerDownloadSelected(win.id)">download</button>
  <button @click="openDesktopContextMenu($event)">desktop-menu</button>
  <button @click="openDesktopIconContextMenu(entry, $event)">icon-menu</button>
  <button v-if="canPauseTransfer(item)">Pause</button>
  <button v-if="canResumeTransfer(item)">Resume</button>
  <button v-if="canCancelTransfer(item)">Cancel</button>
  <button @click="retryTransfer(item)">Retry</button>
  <button @click="cancelTransfer(item)">Cancel</button>
  <span>{{ taskbarPrimaryGroups() }}</span>
  <span>{{ clockDateText }}</span>
  <span>Notifications</span>
  <span>closeTrayPanel()</span>
  <span>Desktop Preview</span>
  <span>Preset Families</span>
  <span>mioos-classic-transferfacts</span>
  <span>mioos-classic-progress</span>
  <span>Customize this folder</span>
  <span>Upload background image</span>
  <span>Upload folder icon</span>
  <span>win.appKey === 'pdf-viewer'</span>
  <span>win.appKey === 'structured-viewer'</span>
  <span>win.appKey === 'folder-properties'</span>
  <video playsinline preload="metadata"></video>
</template>
<div id="mioosRoot"
  class="mioos-root"
  v-cloak
  dir="{{localeDir}}"
  lang="{{localeCode}}"
  data-mioos-root
  data-mioos-session="{{sessionId}}"
  data-mioos-ws="{{wsPath}}"
  data-mioos-terminal-ws="{{wsTerminalPath}}"
  data-mioos-max-sockets="{{wsMaxSockets}}"
  data-mioos-fs-sockets="{{wsFsSockets}}"
  data-mioos-upload-batch-size="{{uploadBatchSize}}"
  data-mioos-bootstrap="{{bootstrapPath}}"
  data-mioos-view="{{viewPath}}"
  data-mioos-signin="{{signinPath}}"
  data-mioos-signout="{{signoutPath}}"
  data-mioos-guest-signin="{{guestSigninPath}}"
  data-mioos-command-event="{{commandEvent}}"
  data-mioos-command-result-event="{{commandResultEvent}}"
  data-mioos-terminal-command-transport="dedicated-websocket"
  data-shell-chrome="{{shellChrome}}"
  data-taskbar-style="{{taskbarStyle}}"
  data-start-menu-style="{{startMenuStyle}}"
  data-density="{{density}}"
  data-wallpaper="{{wallpaper}}"
  data-wallpaper-url="{{wallpaperUrl}}"
  data-theme-mode="{{themeMode}}"
  style="{{themeInlineStyle}}"
  data-theme-key="{{themeKey}}"
  data-window-manager="{{windowManager}}"
  data-window-snap-threshold="{{windowSnapThreshold}}"
  data-window-resize-model="{{windowResizeModel}}">
  <desktop-shell></desktop-shell>
</div>

<script src="/public/mioos/mioos_desktop.js"></script>
