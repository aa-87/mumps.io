<!doctype html>
<html lang="en" data-theme="{{theme.mode}}" data-density="{{theme.density}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.lead}}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
          boxShadow: { shell: '0 16px 38px rgba(2,6,23,.18)' }
        }
      }
    };
  </script>
  <style>
    :root {
      --bg:#f3f6fb;
      --bg-soft:#ffffff;
      --panel:rgba(255,255,255,.92);
      --panel-soft:#ffffff;
      --border:rgba(15,23,42,.10);
      --text:#0f172a;
      --muted:#475569;
      --accent:#0284c7;
      --shadow:0 16px 38px rgba(15,23,42,.08);
    }
    html[data-theme="dark"] {
      --bg:#0a1221;
      --bg-soft:#0f172a;
      --panel:rgba(10,18,33,.92);
      --panel-soft:rgba(15,23,42,.98);
      --border:rgba(148,163,184,.16);
      --text:#dbe7f5;
      --muted:#94a3b8;
      --accent:#38bdf8;
      --shadow:0 18px 44px rgba(2,6,23,.34);
    }
    html[data-density="dense"] { --row-pad-y:.64rem; --row-pad-x:.9rem; }
    html[data-density="normal"] { --row-pad-y:.82rem; --row-pad-x:1rem; }
    html[data-density="spacious"] { --row-pad-y:1rem; --row-pad-x:1.05rem; }
    body {
      background:
        radial-gradient(circle at top left, rgba(14,165,233,.08), transparent 26%),
        radial-gradient(circle at top right, rgba(139,92,246,.07), transparent 22%),
        var(--bg);
      color:var(--text);
    }
    .panel { background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow); backdrop-filter:blur(16px); }
    .panel-soft { background:var(--panel-soft); border:1px solid var(--border); }
    .muted { color:var(--muted); }
    .section-kicker { letter-spacing:.16em; text-transform:uppercase; font-size:.68rem; color:var(--accent); font-weight:700; }
    .nav-link { display:flex; flex-direction:column; align-items:flex-start; gap:.1rem; border-radius:1rem; border:1px solid transparent; padding:.85rem .95rem; color:var(--muted); transition:all .16s ease; }
    .nav-link:hover { background:rgba(148,163,184,.08); color:var(--text); }
    .nav-link.active { background:rgba(14,165,233,.10); color:#7dd3fc; border-color:rgba(14,165,233,.18); }
    html[data-theme="light"] .nav-link.active { color:#075985; }
    .nav-hint { font-size:.72rem; line-height:1.25; color:var(--muted); }
    .quick-button,.ghost-button,.danger-button { border-radius:.95rem; border:1px solid var(--border); padding:.74rem .95rem; font-size:.84rem; font-weight:600; background:rgba(148,163,184,.06); }
    .quick-button:hover,.ghost-button:hover,.danger-button:hover { background:rgba(148,163,184,.11); }
    .primary-button { border-radius:.95rem; padding:.8rem 1.02rem; font-size:.85rem; font-weight:700; color:#03131f; background:linear-gradient(180deg,#67e8f9,#38bdf8); border:1px solid rgba(56,189,248,.30); }
    .danger-button { color:#fecaca; background:rgba(239,68,68,.08); border-color:rgba(239,68,68,.18); }
    .field,.textarea,.select { width:100%; border-radius:.95rem; border:1px solid var(--border); background:rgba(2,6,23,.16); color:var(--text); padding:.85rem .95rem; font-size:.87rem; }
    html[data-theme="light"] .field,html[data-theme="light"] .textarea,html[data-theme="light"] .select { background:rgba(255,255,255,.78); }
    .field::placeholder,.textarea::placeholder { color:var(--muted); }
    .badge { display:inline-flex; align-items:center; gap:.45rem; padding:.35rem .72rem; border-radius:999px; font-size:.72rem; font-weight:700; border:1px solid transparent; line-height:1; }
    .badge::before { content:''; width:.45rem; height:.45rem; border-radius:999px; background:currentColor; opacity:.95; }
    .badge-sky{color:#7dd3fc;background:rgba(14,165,233,.12);border-color:rgba(14,165,233,.18)}
    .badge-emerald{color:#6ee7b7;background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.18)}
    .badge-amber{color:#fcd34d;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.18)}
    .badge-rose{color:#fda4af;background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.18)}
    .badge-violet{color:#c4b5fd;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.18)}
    .badge-slate{color:#cbd5e1;background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.18)}
    .tone-sky{background:linear-gradient(180deg, rgba(14,165,233,.12), rgba(14,165,233,.05)); border-color:rgba(14,165,233,.18)}
    .tone-emerald{background:linear-gradient(180deg, rgba(16,185,129,.14), rgba(16,185,129,.05)); border-color:rgba(16,185,129,.18)}
    .tone-amber{background:linear-gradient(180deg, rgba(245,158,11,.14), rgba(245,158,11,.05)); border-color:rgba(245,158,11,.18)}
    .tone-rose{background:linear-gradient(180deg, rgba(244,63,94,.12), rgba(244,63,94,.05)); border-color:rgba(244,63,94,.18)}
    .tone-violet{background:linear-gradient(180deg, rgba(139,92,246,.14), rgba(139,92,246,.05)); border-color:rgba(139,92,246,.18)}
    .tone-slate{background:linear-gradient(180deg, rgba(148,163,184,.09), rgba(148,163,184,.04)); border-color:rgba(148,163,184,.18)}
    .grid-table th,.grid-table td { padding:var(--row-pad-y) var(--row-pad-x); white-space:nowrap; }
    .grid-table tbody tr:hover { background:rgba(148,163,184,.06); }
    .stat-label { font-size:.74rem; text-transform:uppercase; letter-spacing:.16em; color:var(--muted); }
    .fx-rise { opacity:0; transform:translateY(12px); transition:opacity .42s ease, transform .42s ease; }
    .fx-rise.is-visible { opacity:1; transform:none; }
  </style>
</head>
<body class="font-sans antialiased">
  <div class="min-h-screen lg:grid lg:grid-cols-[17rem_minmax(0,1fr)]">
    {{> partials/mioui_shell_sidebar.html}}
    <main class="px-4 pb-8 pt-4 lg:px-6 lg:pb-12 lg:pt-5">
      {{> partials/mioui_shell_header.html}}
      <div class="mt-6">{{{content}}}</div>
      <footer class="mt-8 panel rounded-[1.35rem] px-4 py-4 lg:px-5">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <div class="text-sm font-semibold">{{app.name}}</div>
            <div class="mt-1 text-sm muted">{{app.tagline}}</div>
          </div>
          <div class="flex flex-wrap gap-2">
            {{#footer.links}}
            <a href="{{href}}" class="quick-button">{{label}}</a>
            {{/footer.links}}
          </div>
          <div class="text-sm muted">{{app.version}}</div>
        </div>
      </footer>
    </main>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var key = 'mioui-theme';
      function setTheme(mode) { root.setAttribute('data-theme', mode); try { localStorage.setItem(key, mode); } catch (e) {} }
      var saved = null;
      try { saved = localStorage.getItem(key); } catch (e) {}
      if (!saved) saved = root.getAttribute('data-theme') || 'dark';
      setTheme(saved);
      function toggle() { setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
      var btn = document.getElementById('themeToggle'); if (btn) btn.addEventListener('click', toggle);
      var items = document.querySelectorAll('.fx-rise');
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){ if (entry.isIntersecting) entry.target.classList.add('is-visible'); });
        }, { threshold: 0.12 });
        items.forEach(function(el){ io.observe(el); });
      } else {
        items.forEach(function(el){ el.classList.add('is-visible'); });
      }
    }());
  </script>
</body>
</html>
