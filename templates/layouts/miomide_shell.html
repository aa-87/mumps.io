<!DOCTYPE html>
<html lang="en" class="{{themeClass}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{pageTitle}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <style>
    :root{
      --wb-bg:#1e1e1e;--wb-bg2:#181818;--wb-panel:#252526;--wb-panel2:#202020;--wb-panel3:#2a2d2e;--wb-border:#313131;
      --wb-text:#cccccc;--wb-text-dim:#8b949e;--wb-text-soft:#9da3af;--wb-accent:#0e639c;--wb-accent-2:#1177bb;--wb-success:#3fb950;
      --wb-warning:#d29922;--wb-danger:#f85149;--wb-tab:#2d2d2d;--wb-tab-active:#1f1f1f;--wb-status:#007acc;
      --wb-overlay:rgba(0,0,0,.58);--wb-input:#1f1f1f;--wb-shadow:0 18px 60px rgba(0,0,0,.38);--wb-title:#d7dae0;
      --wb-chip:rgba(255,255,255,.04);--wb-hover:rgba(255,255,255,.06);--wb-hover-2:rgba(255,255,255,.08);
    }
    html.mioide-light{
      --wb-bg:#f3f3f3;--wb-bg2:#e9e9e9;--wb-panel:#ffffff;--wb-panel2:#f7f7f7;--wb-panel3:#f0f2f5;--wb-border:#d4d7dc;
      --wb-text:#1f2328;--wb-text-dim:#57606a;--wb-text-soft:#6b7280;--wb-accent:#005fb8;--wb-accent-2:#2678d0;--wb-success:#1f883d;
      --wb-warning:#9a6700;--wb-danger:#cf222e;--wb-tab:#e6e8eb;--wb-tab-active:#ffffff;--wb-status:#005fb8;
      --wb-overlay:rgba(15,23,42,.18);--wb-input:#ffffff;--wb-shadow:0 18px 60px rgba(15,23,42,.16);--wb-title:#111827;
      --wb-chip:rgba(15,23,42,.03);--wb-hover:rgba(15,23,42,.05);--wb-hover-2:rgba(15,23,42,.08);
    }
    html,body{height:100%;}
    body{margin:0;background:var(--wb-bg);color:var(--wb-text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden;}
    button,input,textarea{font:inherit;}
    .mioide-shell{display:grid;grid-template-rows:34px 1fr 22px;height:100vh;background:var(--wb-bg);}
    .mioide-titlebar{background:linear-gradient(180deg,var(--wb-panel3),var(--wb-panel2));border-bottom:1px solid var(--wb-border);}
    .mioide-workbench{display:flex;min-width:0;min-height:0;}
    .mioide-activity{width:48px;flex:0 0 48px;background:var(--wb-bg2);border-right:1px solid var(--wb-border);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;}
    .mioide-activity-btn{width:100%;padding:10px 0;border-left:2px solid transparent;color:var(--wb-text-dim);display:flex;align-items:center;justify-content:center;background:transparent;border-top:0;border-right:0;border-bottom:0;}
    .mioide-activity-btn.is-active{border-left-color:var(--wb-accent);color:var(--wb-text);background:var(--wb-hover);}
    .mioide-sidebar-shell{display:flex;flex-direction:column;min-width:0;background:var(--wb-panel);border-right:1px solid var(--wb-border);overflow:hidden;}
    .mioide-sidebar-header,.mioide-panel-header,.mioide-editor-toolbar,.mioide-open-editors{background:var(--wb-panel2);border-bottom:1px solid var(--wb-border);}
    .mioide-sidebar-body,.mioide-panel-stage,.mioide-editor-stage,.mioide-routine-list{min-height:0;}
    .mioide-sidebar-body{display:flex;flex-direction:column;overflow:hidden;}
    .mioide-editor-shell{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--wb-bg);}
    .mioide-tab-strip{display:flex;align-items:stretch;min-height:35px;background:var(--wb-panel2);border-bottom:1px solid var(--wb-border);overflow:hidden;}
    .mioide-tab-scroll{display:flex;align-items:stretch;overflow:auto hidden;flex:1;scrollbar-width:none;}
    .mioide-tab-scroll::-webkit-scrollbar{display:none;}
    .mioide-tab{display:flex;align-items:center;gap:8px;min-width:140px;max-width:240px;padding:0 12px;background:var(--wb-tab);border-right:1px solid var(--wb-border);color:var(--wb-text-dim);user-select:none;position:relative;cursor:pointer;}
    .mioide-tab::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:transparent;}
    .mioide-tab.is-active{background:var(--wb-tab-active);color:var(--wb-text);}
    .mioide-tab.is-active::before{background:var(--wb-accent);}
    .mioide-tab.is-drag-target{box-shadow:inset 2px 0 0 var(--wb-accent);}
    .mioide-tab:hover,.mioide-title-btn:hover,.mioide-side-action:hover,.mioide-panel-tab:hover,.mioide-list-row:hover,.mioide-command-item:hover,.mioide-context-item:hover,.mioide-tab-plus:hover,.mioide-window-action:hover{background:var(--wb-hover);}
    .mioide-tab.is-active:hover{background:var(--wb-tab-active);}
    .mioide-tab-close{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--wb-text-soft);border:0;background:transparent;}
    .mioide-tab-close:hover{background:var(--wb-hover-2);color:var(--wb-text);}
    .mioide-tab-plus{width:34px;flex:0 0 34px;border-left:1px solid var(--wb-border);display:flex;align-items:center;justify-content:center;color:var(--wb-text-soft);background:transparent;border-top:0;border-right:0;border-bottom:0;}
    .mioide-editor-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px;min-height:34px;}
    .mioide-editor-stage{position:relative;flex:1;display:flex;min-height:0;overflow:hidden;background:var(--wb-bg);}
    .mioide-editor-empty{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
    .mioide-editor-wrap{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);width:100%;height:100%;min-height:0;}
    .mioide-gutter{background:var(--wb-bg2);border-right:1px solid var(--wb-border);font:13px/1.6 Consolas,Monaco,monospace;color:var(--wb-text-dim);overflow:hidden;padding:16px 8px;text-align:right;user-select:none;white-space:pre;}
    .mioide-code-area{position:relative;min-width:0;min-height:0;}
    .mioide-code-layer,.mioide-code-input{font:13px/1.6 Consolas,Monaco,monospace;white-space:pre;}
    .mioide-code-layer{position:absolute;inset:0;padding:16px 20px;overflow:auto;pointer-events:none;color:var(--wb-text);}
    .mioide-code-input{position:absolute;inset:0;padding:16px 20px;background:transparent;color:transparent;caret-color:var(--wb-text);resize:none;border:0;outline:0;overflow:auto;}
    .tok-key{color:#569cd6}.tok-str{color:#ce9178}.tok-cmt{color:#6a9955}.tok-sys{color:#dcdcaa}.tok-lbl{color:#4ec9b0}
    html.mioide-light .tok-key{color:#0b62a3} html.mioide-light .tok-str{color:#a2461d} html.mioide-light .tok-cmt{color:#2f7d32} html.mioide-light .tok-sys{color:#795e26} html.mioide-light .tok-lbl{color:#0f766e}
    .mioide-panel-shell{display:flex;flex-direction:column;background:var(--wb-panel);border-top:1px solid var(--wb-border);min-height:0;}
    .mioide-panel-tabs{display:flex;align-items:center;gap:2px;overflow:auto hidden;}
    .mioide-panel-tab{padding:8px 10px;border-radius:6px 6px 0 0;color:var(--wb-text-dim);background:transparent;border:0;}
    .mioide-panel-tab.is-active{color:var(--wb-text);background:var(--wb-tab-active);}
    .mioide-panel-stage{flex:1;overflow:hidden;min-height:0;}
    .mioide-panel-pane{height:100%;min-height:0;display:flex;flex-direction:column;}
    .mioide-panel-scroll{flex:1;overflow:auto;min-height:0;}
    .mioide-terminal-stage{height:100%;min-height:0;display:grid;grid-template-rows:34px 1fr;}
    .mioide-terminal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 10px;border-bottom:1px solid var(--wb-border);background:var(--wb-panel2);}
    .mioide-terminal-host{width:100%;height:100%;min-height:0;padding:8px;overflow:hidden;}
    .mioide-terminal-status.is-connected{color:var(--wb-success);} .mioide-terminal-status.is-error{color:var(--wb-danger);} .mioide-terminal-status.is-connecting{color:var(--wb-warning);}
    .mioide-statusbar{background:var(--wb-status);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:12px;}
    .mioide-chip{border:1px solid var(--wb-border);background:var(--wb-chip);border-radius:999px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;}
    .mioide-card{background:linear-gradient(180deg,rgba(14,99,156,.12),rgba(14,99,156,.04));border:1px solid rgba(14,99,156,.28);border-radius:12px;}
    .mioide-list-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:inherit;text-align:left;background:transparent;border:0;}
    .mioide-title-btn,.mioide-window-action,.mioide-side-action{border:0;background:transparent;color:inherit;border-radius:6px;}
    .mioide-resizer{position:relative;flex:0 0 auto;background:var(--wb-bg);}
    .mioide-resizer--sidebar{width:5px;cursor:col-resize;}
    .mioide-resizer--panel{height:5px;cursor:row-resize;}
    .mioide-resizer::after{content:"";position:absolute;background:transparent;transition:background .12s ease;}
    .mioide-resizer--sidebar::after{top:0;bottom:0;left:1px;width:2px;}
    .mioide-resizer--panel::after{left:0;right:0;top:1px;height:2px;}
    .mioide-resizer:hover::after,.mioide-resizer.is-active::after{background:var(--wb-accent);}
    .mioide-overlay{position:fixed;inset:0;background:var(--wb-overlay);display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;z-index:60;}
    .mioide-dialog{width:min(760px,92vw);background:var(--wb-panel);border:1px solid var(--wb-border);border-radius:12px;box-shadow:var(--wb-shadow);overflow:hidden;}
    .mioide-dialog-header{padding:14px 16px;border-bottom:1px solid var(--wb-border);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--wb-text-dim);}
    .mioide-command-input{width:100%;border:0;background:var(--wb-input);color:var(--wb-text);padding:16px 18px;font-size:15px;outline:none;}
    .mioide-command-list{max-height:min(52vh,420px);overflow:auto;}
    .mioide-command-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 16px;border:0;background:transparent;color:var(--wb-text);text-align:left;}
    .mioide-context-menu{position:fixed;z-index:80;min-width:220px;background:var(--wb-panel);border:1px solid var(--wb-border);border-radius:10px;box-shadow:var(--wb-shadow);padding:6px;}
    .mioide-context-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--wb-text);border-radius:8px;text-align:left;}
    .mioide-toast-stack{position:fixed;right:16px;bottom:30px;display:flex;flex-direction:column;gap:10px;z-index:70;}
    .mioide-toast{min-width:240px;max-width:360px;background:var(--wb-panel);border:1px solid var(--wb-border);border-left:4px solid var(--wb-accent);box-shadow:var(--wb-shadow);border-radius:10px;padding:12px 14px;}
    .mioide-kbd{border:1px solid var(--wb-border);background:var(--wb-chip);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--wb-text-soft);}
    .xterm-viewport{overflow-y:auto!important;}
  </style>
</head>
<body>
{{{content}}}
</body>
</html>
