# Nginx reverse proxy recipe for MUMPS.IO MIO
#
# Assumes MIO listens on 127.0.0.1:9080 (or restricted via firewall if 0.0.0.0)
# TLS termination is assumed to happen in this Nginx server block.

upstream mio_backend {
    server 127.0.0.1:9080;
    keepalive 64;
}

server {
    listen 80;
    # listen 443 ssl http2;  # enable TLS + http2 here
    server_name example.com;

    # If you terminate TLS here, configure ssl_certificate / ssl_certificate_key.

    # Health endpoints (optional direct forwarding)
    location = /healthz {
        proxy_pass http://mio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
    location = /readyz {
        proxy_pass http://mio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # WebSocket support: if you use Upgrade routes
    location / {
        proxy_pass http://mio_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts (tune as needed)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }
}
