apiVersion: apps/v1
kind: Deployment
metadata:
  name: mws
  namespace: mumps-io
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mws
  template:
    metadata:
      labels:
        app: mws
    spec:
      containers:
        - name: mws
          image: ghcr.io/mumps-io/mws:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MWS_CONF
              value: /etc/mumps-io/mws.conf.json
          ports:
            - containerPort: 9080
              name: http
          volumeMounts:
            - name: mws-config
              mountPath: /etc/mumps-io/mws.conf.json
              subPath: mws.conf.json
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
      volumes:
        - name: mws-config
          configMap:
            name: mws-config
