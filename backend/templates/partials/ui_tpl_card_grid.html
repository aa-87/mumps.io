<article class="group rounded-2xl bg-white/5 ring-1 ring-white/10 shadow-sm hover:bg-white/7 transition overflow-hidden">
  <div class="p-5">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <h3 class="text-base font-semibold tracking-tight text-white truncate">{{name}}</h3>
          <a href="{{groupHref}}"
             class="text-[10px] uppercase tracking-widest text-slate-300 bg-black/20 hover:bg-black/30 ring-1 ring-white/10 rounded-full px-2 py-1 transition">{{group}}</a>
        </div>
        <p class="mt-1 text-sm text-slate-300/90">{{desc}}</p>

        {{#tagsArr}}
          {{! render as inline chips }}
        {{/tagsArr}}
        <div class="mt-3 flex flex-wrap gap-2">
          {{#tagsArr}}
            <a href="{{href}}"
               class="rounded-full px-2.5 py-1 text-[11px] bg-black/20 hover:bg-black/30 ring-1 ring-white/10 text-slate-200 transition">#{{label}}</a>
          {{/tagsArr}}
          {{^tagsArr}}
            <span class="text-xs text-slate-500">No tags</span>
          {{/tagsArr}}
        </div>
      </div>

      <button type="button"
              class="js-fav rounded-xl px-3 py-2 text-sm bg-black/20 hover:bg-black/35 ring-1 ring-white/10 transition"
              data-id="{{id}}" data-fav="{{fav}}">
        <span class="js-fav-icon">{{favIcon}}</span>
      </button>
    </div>

    <div class="mt-4 flex items-center justify-between">
      <a href="/plgd/playground?id={{id}}"
         class="rounded-xl px-3 py-2 text-sm font-semibold bg-gradient-to-r from-sky-500/20 to-indigo-500/20 ring-1 ring-white/10 hover:from-sky-500/30 hover:to-indigo-500/30 transition">
        Open
      </a>
      <div class="text-xs text-slate-500">{{updatedAgo}} · ID {{id}}</div>
    </div>
  </div>
</article>
