<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{{blocks.title}}}</title>
  <style> 
    :root{--bg:#070b10;--panel:#0f1620;--border:#1b2633;--muted:#9bb0c9;--text:#e8eef6;--accent:#2b76ff;}
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text)}
    header{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0}
    main{padding:18px;max-width:1100px;margin:0 auto}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;flex:1;min-width:280px}
    .muted{color:var(--muted)}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #35506e;border-radius:999px;font-size:12px;color:#b9d3f3}
    a{color:#9ad1ff;text-decoration:none}
    a:hover{text-decoration:underline}
    .btn{display:inline-block;background:var(--accent);color:white;padding:10px 12px;border-radius:12px;font-weight:650}
    .btn.secondary{background:#223246}
    textarea,input{width:100%;box-sizing:border-box;background:#0b0f14;color:var(--text);border:1px solid #233246;border-radius:12px;padding:10px;font:inherit}
    textarea{min-height:160px;resize:vertical}
    pre{white-space:pre-wrap;background:#0b0f14;border:1px solid #233246;border-radius:12px;padding:10px;overflow:auto}
  </style>
</head> 
<body>
<header>
  <div class="row" style="align-items:center;justify-content:space-between">
    <div><strong>{{brand}}</strong> <span class="muted">wow demo</span></div>
    <div class="row" style="gap:10px">
      {{#nav}}<a href="{{href}}">{{label}}</a>{{/nav}}
    </div>
  </div>
</header>
<main>
  {{{content}}}
</main>
</body>
</html>
