<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{#blocks.title}}{{{blocks.title}}} · {{/blocks.title}}MIOPLGD</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["ui-sans-serif","system-ui","Segoe UI","Roboto","Helvetica Neue","Arial","Noto Sans","Apple Color Emoji","Segoe UI Emoji"] },
          keyframes: {
            floaty: { "0%,100%": { transform: "translateY(0)" }, "50%": { transform: "translateY(-6px)" } },
            shimmer: { "0%": { backgroundPosition: "0% 50%" }, "100%": { backgroundPosition: "100% 50%" } }
          },
          animation: {
            floaty: "floaty 6s ease-in-out infinite",
            shimmer: "shimmer 10s ease infinite"
          }
        }
      }
    }
  </script>

  <style>
    /* crisp scrollbar */
    * { scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.6) transparent; }
    *::-webkit-scrollbar { height: 10px; width: 10px; }
    *::-webkit-scrollbar-thumb { background: rgba(148,163,184,.5); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
    *::-webkit-scrollbar-track { background: transparent; }

    /* subtle background grain */
    .grain::before{
      content:"";
      position:absolute; inset:0;
      background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 18px 18px;
      pointer-events:none;
      mask-image: radial-gradient(circle at 10% 0%, rgba(0,0,0,.9), transparent 60%);
      opacity:.55;
    }
  </style>

  {{{blocks.head}}}
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative grain">
    <!-- animated gradient -->
    <div class="absolute inset-0 -z-10 opacity-70">
      <div class="absolute -top-48 left-1/2 h-[520px] w-[900px] -translate-x-1/2 rounded-full blur-3xl"
           style="background: radial-gradient(circle at 50% 50%, rgba(56,189,248,.20), rgba(99,102,241,.12), rgba(0,0,0,0));"></div>
      <div class="absolute -bottom-52 left-1/2 h-[520px] w-[900px] -translate-x-1/2 rounded-full blur-3xl"
           style="background: radial-gradient(circle at 50% 50%, rgba(244,114,182,.16), rgba(34,197,94,.10), rgba(0,0,0,0));"></div>
    </div>

    <div class="mx-auto max-w-6xl px-4 py-6">
      {{> partials/ui_nav}}
      <main class="mt-6">
        {{{content}}}
      </main>
      <div class="mt-14">
        {{> partials/ui_footer}}
      </div>
    </div>
  </div>

  {{{blocks.scripts}}}
</body>
</html>
