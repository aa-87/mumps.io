{{#block:title}}MIOTPL — Wow Dashboard{{/block:title}}

<div class="card">
  <div class="pill">Dashboard</div>
  <h1 style="margin:10px 0 0 0">{{page.heading}}</h1>
  <p class="muted" style="margin:6px 0 0 0">{{page.lead}}</p>
  <div style="height:12px"></div>

  {{> *hero.component}}
</div>

<div style="height:12px"></div>

<div class="row">
  {{#metrics}}
  <div class="card">
    <div class="muted">{{label}}</div>
    <div style="font-size:20px;font-weight:700;margin-top:6px">{{value}}</div>
  </div>
  {{/metrics}}
</div>

<div style="height:12px"></div>

<div class="card">
  <div class="pill">Next</div>
  <p class="muted" style="margin-top:8px">Try the playground to render templates on demand.</p>
  <a class="btn" href="/wow/playground">Open Playground</a>
</div>
