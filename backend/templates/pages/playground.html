{{#block:title}}MIOTPL — Template Playground{{/block:title}}

<div class="card">
  <div class="pill">Playground</div>
  <h1 style="margin:10px 0 0 0">{{page.heading}}</h1>
  <p class="muted" style="margin:6px 0 0 0">{{page.lead}}</p>
</div>

<div style="height:12px"></div>

<div class="row">
  <div class="card">
    <div class="muted">Template</div>
    <textarea id="tpl" style="min-height:400px;">{{starterTpl}}</textarea>
  </div>
  <div class="card">
    <div class="muted">Context (JSON)</div>
    <textarea id="json" style="min-height:400px;"> {{starterJson}}</textarea>
  </div>
</div>

<div style="height:12px"></div>

<div class="card">
  <div class="row" style="align-items:center;justify-content:space-between">
    <div>
      <div class="muted">Output</div>
      <small class="muted">Demo endpoint uses server render. Hook `POST /wow/api/render` to your JSON parser for full support.</small>
    </div>
    <a class="btn" href="#" onclick="renderNow();return false;">Render</a>
  </div>
  <div style="height:10px"></div>
  <pre id="out"></pre>
</div>

<script>
async function renderNow(){
  const tpl = document.getElementById('tpl').value;
  const json = document.getElementById('json').value;
  // Minimal demo: send form fields. Replace with JSON POST in your app.
  const body = new URLSearchParams({ template: tpl, name: 'World', json: json });
  const res = await fetch('/wow/api/render', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
  const txt = await res.text();
  document.getElementById('out').textContent = txt;
}
</script>
