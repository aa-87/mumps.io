<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{{blocks.title}}}</title>
    <meta name="description" content="{{desc}}" />

    <!-- Tailwind CSS (no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .glass { backdrop-filter: blur(10px); background: rgba(2,6,23,.70); }
      .ring-soft { box-shadow: 0 0 0 1px rgba(255,255,255,.10) inset; }
    </style>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="fixed inset-0 -z-10">
      <div class="absolute inset-0 bg-gradient-to-b from-slate-950 via-slate-950 to-slate-900"></div>
      <div class="absolute -top-24 left-1/2 h-96 w-96 -translate-x-1/2 rounded-full bg-emerald-500/10 blur-3xl"></div>
      <div class="absolute top-64 right-0 h-96 w-96 rounded-full bg-sky-500/10 blur-3xl"></div>
    </div>

    {{> partials/mio_nav.html}}

    <main class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
      {{{content}}}
    </main>

    {{> partials/mio_footer.html}}
  </body>
</html>
