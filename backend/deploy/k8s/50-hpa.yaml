apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mws
  namespace: mumps-io
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mws
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
