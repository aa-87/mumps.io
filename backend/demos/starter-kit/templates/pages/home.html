{{#block:title}}MIOTPL — 5 minute success{{/block:title}}

<section class="row">
  {{> ui_card}}
  <div class="card">
    <div><span class="pill">List</span> Recent items</div>
    <div style="height:10px"></div>

    {{#items}}
      <div>• <strong>{{name}}</strong> <small class="muted">#{{id}}</small></div>
    {{/items}}

    {{^items}}
      <div class="muted">No items yet</div>
    {{/items}}
  </div>
</section>

<div style="height:14px"></div>

<div class="card">
  <div><span class="pill">Raw</span> Context preview</div>
  <div style="height:10px"></div>
  <div class="log">{{ctxPreview}}</div>
</div>
