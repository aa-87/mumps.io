<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{{blocks.title}}}</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#0b0f14;color:#e8eef6}
    header{padding:16px 20px;border-bottom:1px solid #1b2633;background:#0f1620;position:sticky;top:0}
    main{padding:20px;max-width:980px;margin:0 auto}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .card{background:#0f1620;border:1px solid #1b2633;border-radius:14px;padding:14px;flex:1;min-width:280px}
    input,textarea,button{font:inherit}
    small.muted{color:#9bb0c9}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #35506e;border-radius:999px;font-size:12px;color:#b9d3f3}
    .log{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;background:#0b0f14;border:1px solid #233246;border-radius:10px;padding:10px;max-height:220px;overflow:auto}
    a{color:#9ad1ff}
  </style>
</head>
<body>
<header>
  <div><strong>MIOTPL Starter</strong> <small class="muted">layout + blocks + partials</small></div>
</header>
<main>
  {{{content}}}
</main>
</body>
</html>
